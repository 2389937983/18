<!DOCTYPE html>
<html lang="zh-CN" data-theme="sakura">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffe8ee">
<title>梦角 · 字卡传讯</title>
<style>
/* ============ 主题变量（默认 粉樱，设置页可换） ============ */
:root{
  --acc:#ef9cb5; --acc-d:#e2779a; --acc-s:#fad9e3; --acc-f:#fdf0f4;
  --bg1:#ffe8ee; --bg2:#fffcfd;
  --ink:#4a3d42; --ink2:#a08d94; --ink3:#c9b6bd;
  --card:#ffffff; --line:#f4dfe6; --ok:#7fc39e;
  --sh:0 10px 28px rgba(226,119,154,.14);
  --sh-s:0 4px 14px rgba(226,119,154,.10);
  /* 压在主题色上的文字/图标色（第34单）：默认白 —— 与改动前逐像素一致。
     选自选色时由 paintTheme() 写内联：浅色会自动换成同色相深墨，免得白字糊在淡底上。 */
  --on-acc:#ffffff;
  --r:22px; --r-s:14px;
  /* 气泡整体缩放（第29单）：一条设置项同时带动 字号 / 内边距 / 圆角 / 气泡最大宽度。
     系数由 paintBub() 写到 documentElement 上，默认 1 = 与改动前**逐像素一致**。
     全用 calc + 变量，不用 min()/clamp() —— 老 WebView（APK 内置）兼容更稳。 */
  --bub-k:1;
  --mcol-mw:74%;
  /* 第58单 · 全局字体样式：用户选了/导入了字体就写 --font-user，两条链同时改 —— 
     所以标题（--serif）和正文（--sans）会一起换；没设时取兜底值，与改动前逐字一致。 */
  --serif:var(--font-user,"Noto Serif SC","Songti SC","STSong","SimSun",Georgia,serif);
  --sans:var(--font-user,"PingFang SC","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif);
  --vvh:100vh; --vvt:0px;   /* 第111单 · --vvh=可见高度（键盘弹起会缩）；--vvt=视觉视口位移的反向抵消（默认 0） */
}
:root[data-theme="peach"]  {--acc:#f2b48c;--acc-d:#e08f5c;--acc-s:#fbe4d0;--acc-f:#fdf5ec;--bg1:#ffeede;--bg2:#fffdfa;}
:root[data-theme="lavender"]{--acc:#b3a0e2;--acc-d:#937dd2;--acc-s:#e6def7;--acc-f:#f5f1fd;--bg1:#ece6fa;--bg2:#fdfcff;}
:root[data-theme="sky"]    {--acc:#90b8e8;--acc-d:#6b99d6;--acc-s:#d9e7f9;--acc-f:#eff6fe;--bg1:#e4eefb;--bg2:#fcfdff;}
:root[data-theme="mint"]   {--acc:#8cc9b2;--acc-d:#5fae8f;--acc-s:#d8f0e4;--acc-f:#effaf4;--bg1:#e3f5ee;--bg2:#fcfffe;}
:root[data-theme="moon"]   {--acc:#c0aea6;--acc-d:#9d8780;--acc-s:#ece3de;--acc-f:#f8f3f0;--bg1:#f2ebe6;--bg2:#fffefd;}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:var(--sans); color:var(--ink);
  background:var(--bg1);
  display:flex; align-items:center; justify-content:center;
  min-height:100vh; min-height:var(--vvh); overflow:hidden;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;}
img{display:block;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

/* ============ 手机框架（桌面居中，移动端全屏） ============ */
#phone{
  position:relative; width:min(402px,100vw);
  height:min(872px,calc(var(--vvh) - 28px));
  background:var(--bg2); border-radius:38px; overflow:hidden;
  box-shadow:0 24px 70px rgba(160,90,115,.22), 0 0 0 1px rgba(255,255,255,.6) inset;
  display:flex; flex-direction:column;
}
@media (max-width:480px), (max-height:640px){
  body{display:block;}
  #phone{width:100vw;height:100vh;height:var(--vvh);border-radius:0;box-shadow:none;margin-top:var(--vvt,0px);}
  /* 第111单 · margin-top 用 --vvt（不是 transform）：transform 会让 #phone 变成 fixed 子元素的包含块，
     弹层/浮窗的定位会跟着变；margin 只挪位置，不动包含块。默认 0 → 平时完全无影响。 */
}
#app{position:relative;flex:1;overflow:hidden;}

/* ============ 通用屏幕 ============ */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg2);}
.body-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
.bar{
  flex:none;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  background:var(--bg1);
  border-bottom:1px solid var(--line); position:relative; z-index:5;
}
.bar__title{flex:1;font-family:var(--serif);font-size:calc(18px * var(--fk,1));letter-spacing:2px;}
/* 第64/65/66单 · 「对方正在输入中……」在**分割线正下方**（与线上方那颗搜索键对称）。
   第67单 · 用户反馈「字有点小、太贴着线了」：字号 11 → 12.5px、与线的间距 5 → 11px。
   ⚠️ 间距和字号都是**可量**的，别靠肉眼调：夹具 E1 正面钉着「距线 ≥8px」与「字号 ≥12px」。 */
.typingline{
  position:absolute;left:50%;top:calc(100% + 11px);transform:translateX(-50%);
  white-space:nowrap;font-size:calc(12.5px * var(--fk,1));letter-spacing:1px;color:var(--acc-d);
  pointer-events:none;
}
.typingline[hidden]{display:none;}
/* ===================== 第73单 · 顶栏（按用户给的图）=====================
   ① 删掉两人之间那条分割线（连心形一起）；② 名字小一点；③ 名字与头像拉开距离；
   ④ 名字在头像下方居中；⑤ 中间那排图标对齐**头像中线**（定位已挪到 .chatduo__acts）。
   ⚠️ 分割线用**后置覆盖**关掉、不去动原来那几行：那片注释里混着历史乱码，
      按字符串替换有改坏字节的风险；`display:none` 效果一样且可逆。 */
/* （这三条已搬到文件末尾：原规则在后面，写早了会被它们盖掉） */
/* 第70单 · OSS 配置输入框：铺满设置行、左对齐（.txt 本身是给 HEX 那种居中小框用的） */
.ossin{flex:1;min-width:0;text-align:left;}
/* 第38单 · 聊天顶栏并排两个人：对方在左、我在右。
   第50单改成**名字在头像正上方**（原来「头像 + 名字 + 双击拍一拍」挤在右半边，不好看）：
     - 两块各自竖排（名字在上、头像在下、居中对齐），所以顶栏比原来高一点、两侧也更宽松；
     - 「双击拍一拍」那句副标题整块删掉（功能没删：左块整块仍是 avtap 入口，双击头像照样拍），
       aria-label 保留，键盘/读屏用户还能知道这块可双击。
   窄屏也不挤：名字超长省略、头像 flex:none 不被压。

   第52单「磨砂名牌」—— 第51单只补了一条虚线，两块本身还是"飘"在顶栏上的两坨，
   所以这一单给每个人各坐一块半透明磨砂玻璃牌，并把连接线做成装饰：
     ① 好看：两块有了明确载体（圆角 + 双层投影 + 内高光），顶上不再是"名字和头像悬空"；
     ② 好读（比好看更要紧的收益）：顶栏**默认就是全透明**的 —— `.screen--chat .bar`
        用 --bar-fb，而 barOp 默认 100 → alpha 0，所以名字是直接压在整屏底图上的；
        设了聊天背景图时底图是「照片 + 45% 柔白」，深色或花哨的照片上名字会糊。
        加了这张白色磨砂牌之后，名字永远落在"自己的 ≥90% 白"的底上 —— 
        **换任何照片都读得清**（D13 钉的就是这条，不是钉某个色值）；
     ③ 连接线不再用硬邦邦的 dashed（第51单那条），换成「两端渐隐的 --acc 细线 +
        中间一颗带白晕的圆点」，像一枚把两个人扣在一起的纽扣：
        两端渐隐所以不会顶到名牌上，白晕让圆点在深浅底上都立得起来。

   宽度预算：牌宽 max-width 44%（含 padding，全局 border-box）。两块 44% + gap 8px + 
   连接线 min-width 14px ≈ 96% 内，两块**永远压不上**（D11 钉的就是「不许压上」）。 */
.bar--duo{padding-left:12px;padding-right:12px;padding-bottom:10px;}
.chatduo{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0;}
.chatduo__side{
  display:flex;flex-direction:column;align-items:center;gap:5px;max-width:44%;
  padding:6px 12px 8px;border-radius:20px;
  /* min-width 80：名字短（「我」这种一个字）时牌宽只有 64px，而牌高固定 78px —— 
     实测出来是一块又高又窄的竖条，像个小手机，不好看。给个下限让它至少接近方形。 */
  min-width:80px;
  /* 白磨砂：上端 .93（名字就落在这上头，所以最不透明的这一段必须在上面）、
     下端 .68 让照片还透得出来一点，不至于变成两块实心白砖。 */
  background:rgba(255,255,255,.86);
  /* 描边用 --acc-s：与 .iconbtn 同款（本应用"白面 + 浅主题色描边"的既有手法）。
     不用写死的粉色 —— 自定义主题（第20单 accDerive）会把它一起带着变。 */
  border:1px solid var(--acc-s);
  box-shadow:0 5px 14px rgba(160,120,135,.13),inset 0 1px 0 rgba(255,255,255,.9);
  /* 有模糊才是"玻璃"，没有它也只是半透明白块 —— 半透明白本身就已经够读，
     所以老 WebView 不支持 backdrop-filter 时只是少了那层柔和，不会变糊。 */
  -webkit-backdrop-filter:blur(9px) saturate(1.3);backdrop-filter:blur(9px) saturate(1.3);
  transition:transform .12s ease,opacity .12s ease;
}
.chatduo__side--act{cursor:pointer;}
/* 左块整块是拍一拍入口（双击判定在 30_act.js），按下去给一点"被按到"的反馈；
   提示文案（第50单删掉的副标题）不回来，可点性靠 cursor + 这记反馈 + aria-label 表达。 */
.chatduo__side--act:active{opacity:.78;transform:scale(.97);}
/* ===== 第55单 · 按用户要求**去掉外框**，并改成「头像在上 / 昵称在下」=====
   第52单那套「磨砂名牌」里，只有**装饰部分**在这里归零：
     白磨砂底 / --acc-s 描边 / 圆角 / 投影 / backdrop-filter。
   ⚠️ **padding 与 min-width 必须留着** —— 它们不是装饰，是这一块的**布局盒**：
      头像在盒内居中，盒宽 80（min-width）+ 左右各 12（padding）就决定了头像落在离栏边 33px 处，
      两人头像间距 258px。第55单第一版把这两条也归零了，块缩成 38px 宽（纯内容宽），
      头像直接被顶到栏边（左右各 12px）→ **两头像间距变成 300px**，看着像"两人闹别扭各站一边"。
      用户点出来的正是这个（"就按原来的间距，单纯删了边框而已"）—— 所以这里只关装饰、不动盒子。
   ⚠️ 代价是一条**被取消的保障**：那张牌原本保证「名字永远落在自己 ≥90% 白上，换任何背景照片
      都读得清」。牌去掉了，这条不再成立 —— 设了聊天背景图时昵称直接压在照片上；
      真需要底色就把设置页的「顶栏不透明度」往下拖（100% 是全透明）。
   连接线 .chatduo__mid 用户没让动，保留。 */
.chatduo__side{border-radius:0;background:none;border:0;box-shadow:none;
  -webkit-backdrop-filter:none;backdrop-filter:none;}
/* 点头像 = 当场换头像（TA 那块同时是双击拍一拍，单击延迟到双击窗口之后再弹选择器，见 30_act.js）；
   点昵称 = 当场改名。两个都给按下反馈，可点性不靠文案。 */
.chatduo__av{cursor:pointer;}
.chatduo__nm{cursor:pointer;}
.chatduo__av,.chatduo__nm{transition:transform .12s ease,opacity .12s ease;}
.chatduo__av:active{opacity:.75;transform:scale(.96);}
.chatduo__nm:active{opacity:.7;}
/* 当场改名的输入框：宽度跟着格子走、字号与昵称一致，免得一进编辑态整条顶栏跳一下 */
.chatduo__inp{
  width:100%;min-width:52px;max-width:100%;font-family:var(--serif);font-size:calc(17px * var(--fk,1));letter-spacing:1.6px;
  line-height:1.1;text-align:center;color:var(--ink);background:rgba(255,255,255,.94);
  border:1px solid var(--acc);border-radius:9px;padding:1px 6px;outline:none;
}
.chatduo__av{flex:none;display:flex;}
/* 顶栏头像比消息区大一号（34→38，尺寸由 avSpan 的内联 style 给，这里只管质感）。
   白环 2px：牌面本身就是白的，所以白环边上再补一圈 --acc-s 细线（0 0 0 1px）当"轮廓"，
   否则头像在纯白牌面上是"没有边"的；投影给一点浮起感。 */
.chatduo__av .mav{border:2px solid #fff;box-shadow:0 0 0 1px var(--acc-s),0 4px 10px rgba(160,120,135,.16);}
/* 连接线：两端渐隐的 --acc 细线。渐隐用透明端（rgba(255,255,255,0)）而不是"把线画短"，
   这样它自然贴着两块名牌"化开"，牌宽随名字长短变化时也不会露馅。
   min-width 22 而不是 14：名字都拉满时（各 44%）连接线收到下限，线上那颗圆点连带
   白晕一共 12px —— 留 14px 的话白晕几乎贴着两块牌子，像"卡住了"；22px 才有左右各
   5px 的余量。22px 也仍在宽度预算内（见上面的算式：44%×2 + gap + 22 ≈ 98%）。 */
.chatduo__mid{
  position:relative;flex:1;min-width:40px;height:1px;align-self:center;
  /* 第57单 · 线挪到 ::before：因为要在**线自己**身上用 mask 挖掉中间一段（给爱心让位），
     而 mask 是"连同子树一起遮"的 —— 挂在 .chatduo__mid 上的话，里面的爱心会被一起挖空。
     放 ::before 就只有这条线受影响，爱心是真子元素、不受牵连。 */
  background-image:none;
}
/* 第57单 · 中间那颗实心圆点换成**细的镂空爱心**（用户要求）。
   爱心用站内图标库的 heart（10_core.js 的 W()：fill:none + stroke:currentColor + stroke-width 1.8），
   14px 时线宽约 1.05px —— 这就是"细"；fill:none 就是"镂空"。不用 emoji（本站一贯规矩）。
   ⚠️ 线必须在爱心处**断开**：实心圆点会把底下的线盖住，镂空的爱心盖不住，
      线段会从心形内部穿过去。所以用 mask 在线正中挖一个半径 6px 的洞（定宽，不随连接线长度变），
      线在心的两侧各留 ~5px（连接线最短 22px 时也还有）。 */
.chatduo__mid::before{
  content:'';position:absolute;inset:0;
  background:var(--acc);
  -webkit-mask-image:radial-gradient(circle at 50% 50%,transparent 6px,#000 6.5px);
  mask-image:radial-gradient(circle at 50% 50%,transparent 6px,#000 6.5px);
}
/* 爱心：绝对居中压在那条线上；白晕是它在深色照片上也能立住的原因（同 .mav 的环一个道理）。
   16px：heart 路径占 viewBox 的 x≈4.5~19.5，画出来约 10px 宽，比 mask 那个 12px 的洞略窄，
   两侧各留 ~1px —— 线端刚好"递"到心边上，不会看着像断了一大截。 */
/* ⚠️ 必须限定**直接子** svg（`>`）：这条本来是给正中那颗爱心写的（绝对定位压在线正中）。
   第68单把搜索/主题/气泡/背景四个图标放进中列里的按钮之后，宽泛的 `.chatduo__mid svg`
   会把它们**也**抓成绝对定位 → 四个图标叠在同一个点上、只看得见最上面那个（截图里就是这么翻车的）。 */
.chatduo__mid > svg{
  position:absolute;left:50%;top:50%;width:16px;height:16px;
  transform:translate(-50%,-50%);color:var(--acc);
  filter:drop-shadow(0 0 1px rgba(255,255,255,.9));
}
.chatduo__nm{font-family:var(--serif);font-size:calc(17px * var(--fk,1));letter-spacing:1.6px;line-height:1.1;
  max-width:100%;text-align:center;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.iconbtn{
  width:40px;height:40px;border-radius:14px;flex:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--card);border:1px dashed var(--acc-s);color:var(--acc-d);
  box-shadow:var(--sh-s); transition:transform .12s;
}
.iconbtn:active{transform:scale(.92);}
.iconbtn svg{width:20px;height:20px;}
.iconbtn.is-on{background:var(--acc-s);border-style:solid;}

/* ============ 加载页（参考主视觉：轨道圆环 + 蜘蛛 + 衬线大字） ============ */
#splash{
  position:absolute;inset:0;z-index:99;
  background:var(--bg1);
  display:flex;align-items:center;justify-content:center;
  transition:opacity .7s;
}
#splash.bye{opacity:0;pointer-events:none;}
.sp-card{
  width:78%;max-width:300px;background:var(--card);border-radius:34px;
  box-shadow:0 18px 50px rgba(226,119,154,.18);
  padding:52px 24px 44px;text-align:center;
}
.sp-orbit{
  position:relative;width:150px;height:150px;margin:0 auto 8px;
  display:flex;align-items:center;justify-content:center;
}
.sp-orbit .ring{position:absolute;border-radius:50%;border:1px dashed var(--acc-s);}
.sp-orbit .r1{inset:0;}
.sp-orbit .r2{inset:22px;border-style:dotted;}
.sp-orbit .dot{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--acc);}
.sp-orbit .dot--a{top:6px;left:34px;}
.sp-orbit .dot--b{bottom:16px;right:26px;width:6px;height:6px;}
.sp-orbit .halo{width:92px;height:92px;border-radius:50%;background:var(--acc-s);position:absolute;}
.sp-orbit .mascot{width:56px;height:56px;color:var(--acc);animation:spBreathe 2.6s ease-in-out infinite;}
@keyframes spBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.sp-en{
  font-size:calc(10px * var(--fk,1));letter-spacing:6px;color:var(--acc-d);text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 0 14px;
}
.sp-en::before,.sp-en::after{content:"✦";font-size:calc(8px * var(--fk,1));letter-spacing:0;}
.sp-title{font-family:var(--serif);font-size:calc(30px * var(--fk,1));letter-spacing:10px;text-indent:10px;color:#3d3237;font-weight:600;}
.sp-sub{margin-top:10px;font-size:calc(10px * var(--fk,1));letter-spacing:4px;color:var(--ink3);}
.sp-track{margin:26px auto 0;width:72%;height:2px;background:var(--acc-f);border-radius:2px;overflow:hidden;}
.sp-track i{display:block;height:100%;width:38%;background:var(--acc);animation:spRun 1.4s linear infinite;}
@keyframes spRun{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
.sp-build{margin-top:18px;font-size:calc(10px * var(--fk,1));letter-spacing:3px;color:var(--ink3);text-transform:uppercase;}

/* ============ 首页 ============ */
.screen--home{background:var(--bg1);}
.home-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 16px calc(24px + env(safe-area-inset-bottom));}
.home-head{padding:calc(20px + env(safe-area-inset-top)) 4px 6px;display:flex;align-items:center;justify-content:space-between;}
.home-head__date{font-size:calc(10px * var(--fk,1));letter-spacing:3px;color:var(--acc-d);text-transform:uppercase;}
.home-head__on{display:flex;align-items:center;gap:6px;font-size:calc(11px * var(--fk,1));color:var(--ink2);}
.home-head__on i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(127,195,158,.18);}
.hgreet{
  margin:8px 0 4px;color:var(--on-acc);box-shadow:0 14px 34px rgba(170,110,135,.13);
  border-radius:28px;padding:24px 22px 26px;position:relative;overflow:hidden;
  background:var(--acc);
}
.hgreet::after{
  content:"";position:absolute;right:-52px;top:-70px;width:230px;height:230px;border-radius:50%;
  background:rgba(255,255,255,.18);
}
.hgreet::before{
  content:"";position:absolute;right:6px;bottom:-96px;width:210px;height:210px;border-radius:50%;
  background:rgba(255,255,255,.15);
}
.hgreet__hi{font-size:calc(10px * var(--fk,1));letter-spacing:5px;opacity:.85;text-transform:uppercase;text-shadow:0 1px 8px rgba(80,40,60,.10);}
.hgreet__big{font-family:var(--serif);font-size:calc(30px * var(--fk,1));letter-spacing:4px;margin-top:8px;font-weight:600;text-shadow:0 2px 14px rgba(80,40,60,.14);}
.hgreet__ta{margin-top:14px;font-size:calc(12px * var(--fk,1));opacity:.92;display:flex;align-items:center;gap:8px;text-shadow:0 1px 8px rgba(80,40,60,.10);}
.hgreet__ta .mini-av{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.55);}
.hquote{
  margin:14px 2px 6px;display:flex;align-items:center;gap:10px;
  font-size:calc(11px * var(--fk,1));color:var(--acc-d);letter-spacing:1px;
}
.hquote::after{content:"";flex:1;border-top:1px dashed var(--acc-s);}
/* 第47单 · 更多页那一行右侧的「调整顺序」入口：虚线(::after)排到按钮之前 */
.hquote--row::after{order:1;margin-right:2px;}
.hquote--row .mini{order:2;flex:none;}
.hsearch{
  display:flex;align-items:center;gap:8px;background:var(--card);
  border:1px dashed var(--acc-s);border-radius:16px;padding:10px 14px;margin:8px 0 4px;
  box-shadow:var(--sh-s);
}
.hsearch svg{width:16px;height:16px;color:var(--ink3);flex:none;}
.hsearch input{flex:1;border:none;outline:none;background:none;font-size:calc(13px * var(--fk,1));color:var(--ink);}
.hsearch input::placeholder{color:var(--ink3);}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px;}
.tile{
  position:relative;background:var(--card);border-radius:20px;
  padding:14px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;
  border:1px solid var(--line);box-shadow:var(--sh-s);transition:transform .12s;
}
.tile:active{transform:scale(.94);}
.tile__ic{
  width:42px;height:42px;border-radius:15px;background:var(--acc-f);
  /* 第104单 · 图标图案改跟随主题色本身（--acc），不再用被强制压深的 --acc-d：
     这样单主把主题色调浅，图标就真的跟着变淡。底仍是 96.5% 的 --acc-f，观感更轻。 */
  display:flex;align-items:center;justify-content:center;color:var(--acc);opacity:.92;
}
.tile__ic svg{width:22px;height:22px;}
.tile--main .tile__ic{background:var(--acc);color:var(--on-acc);}
.tile__nm{font-size:calc(11px * var(--fk,1));color:var(--ink);letter-spacing:1px;}
.tile__soon{
  position:absolute;top:6px;right:6px;font-size:calc(8px * var(--fk,1));letter-spacing:1px;color:var(--ink3);
  border:1px solid var(--line);border-radius:8px;padding:1px 4px;background:var(--acc-f);
}
.badge{
  position:absolute;top:-4px;right:-2px;min-width:18px;height:18px;padding:0 5px;
  border-radius:9px;background:var(--acc-d);color:var(--on-acc);font-size:calc(10px * var(--fk,1));
  display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-s);
}

/* ============ 底部栏（聊天 / 字卡库 / 朋友圈 / 更多 / 设置） ============ */
.tabbar{
  flex:none;display:flex;align-items:stretch;background:var(--card);
  border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:5px 2px;border-radius:14px;color:var(--ink3);
}
.tab:active{background:var(--acc-f);}
.tab__ic{position:relative;display:flex;}
.tab__ic svg{width:21px;height:21px;}
.tab span:last-child{font-size:calc(10px * var(--fk,1));letter-spacing:1px;}
.tab.on{color:var(--acc-d);background:var(--acc-f);}

/* ============ 聊天页 ============ */
/* 第39/40单 · 聊天背景图 + 顶底栏透明度为什么必须成对看：
   .bar / .thread / .composer 是 flex 里**并排的兄弟**，不是叠在一起 ——
   所以单看"把顶栏调透明"是看不到变化的：它后面是 .screen 的纯色 --bg2。
   修法：背景图挂在 .screen--chat 这一层（整屏一张、cover），三块都变成半透明时，
   透出来的就是**同一张图**，顶栏底栏与消息区才是连成一片的。 */
.screen--chat{
  background:var(--bg2);
  background-image:var(--chat-bg,none);
  background-size:cover;
  background-position:center;
}
/* 第41单 · 聊天页只画**一层**底色：顶栏 / 消息区 / 底栏三块都变透明，底下的
   .screen--chat 才是一整张连续的渐变（+ 可选背景图）。
   以前三块各自带一层不透明底色，互相挡着 —— 顶栏和底栏调透明度后面还是纯色，
   拖到底都看不出变化（用户实机两次反馈"调了没反应"）。
   透明三块 + 一层底色之后，渐变会连续铺满整屏，滑杆一动就看得见。 */
/* 整屏只画一层底。⚠️ background-image 多层时**第一层在最上面**：
   照片必须排第一层，不透明的柔光排第二层压照片下面 ——
   反过来写（柔光在前）会把照片整张盖住，聊天背景变成一片白（用户实机发现）。
   --chat-bg-layer 整段由 paintChatBg() 写：有照片=图在上+半透明柔光垫底，
   没照片=原来那条不透明渐变（观感与改动前一致）。 */
.screen--chat{
  background:var(--bg2);
  background-image:var(--chat-bg-layer,var(--bg2));
  background-size:cover;
  background-position:center;
}
/* 三块自己都不带底色了（底下就是那层渐变）。 */
.screen--chat .thread{background:none;}
/* 第39/40单的顶栏/底栏透明度规则放在 .composer 基础规则**之后**（见聊天页输入条下方），
   这里只留一句指路，免得下次再被同特异度"后写者胜"盖掉。 */
/* 第41单起：.thread 不再自带底色（整屏 .screen--chat 那一层渐变已经铺满），
   否则三块互相挡着、顶底栏调透明度看不出变化。
   ⚠️ flex:1 / overflow 这两行**绝不能丢**：没有 flex:1，消息流就缩成内容高度、
   输入条和 + 面板悬在屏幕中间被底部导航压住（用户实机截图报过一次）。
   背景一律走 .screen--chat，这里只写 none。 */
.thread{
  flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:14px 8px 10px;display:flex;flex-direction:column;gap:12px;
  background:none;
}
/* ---- 置顶消息（第28单）：顶部栏正下方那一条 ----
   结构 = 一张白卡，里面「图钉 + 谁：摘要」可点（跳到那条消息）、右侧「移除」。
   ⚠️ 它**不是** .thread 的子元素：聊天记录滚动时它要钉住不动（截图里就是这么摆的），
   所以放在 .bar 与 .thread 之间，flex:none 不参与滚动。 */
.pinbar{display:none;flex:none;margin:9px 12px 0;padding:9px 4px 9px 12px;align-items:center;gap:4px;
  background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--sh-s);}
.pinbar.is-on{display:flex;}
.pinbar__main{flex:1;min-width:0;display:flex;align-items:center;gap:9px;padding:0;background:none;border:none;text-align:left;}
.pinbar__ic{flex:none;display:flex;align-items:center;justify-content:center;color:var(--acc-d);}
.pinbar__ic svg{width:17px;height:17px;}
/* 单行省略：__tx 是 flex item（会被 blockify），所以 nowrap+ellipsis 在它身上是生效的 */
.pinbar__tx{flex:1;min-width:0;font-size:calc(12.5px * var(--fk,1));line-height:1.5;letter-spacing:.3px;color:var(--ink2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pinbar__tx b{color:var(--ink);font-weight:600;}
.pinbar__x{flex:none;padding:5px 10px;font-size:calc(12.5px * var(--fk,1));letter-spacing:.5px;color:var(--acc-d);
  background:none;border:none;}
/* 跳到置顶那条时闪一下，不然用户不知道跳到哪了 */
@keyframes pinFlash{
  0%{box-shadow:0 0 0 0 var(--acc);}
  45%{box-shadow:0 0 0 5px var(--acc);}
  100%{box-shadow:0 0 0 0 rgba(0,0,0,0);}
}
.mrow.pinflash .bub{animation:pinFlash 1.3s ease 1;}
.mrow.pinflash .mav{animation:pinFlash 1.3s ease 1;}
/* 消息菜单（单击气泡弹出）顶上那条「这条是谁说的、内容是什么」 */
.msgpv{display:flex;gap:6px;padding:11px 13px;margin-bottom:14px;border-radius:14px;
  background:var(--acc-f);border:1px solid var(--line);font-size:calc(13px * var(--fk,1));line-height:1.6;color:var(--ink);}
.msgpv__nm{flex:none;font-weight:600;color:var(--acc-d);}
.msgpv__tx{flex:1;min-width:0;word-break:break-word;}
/* 第63单 · 头像与气泡**顶边平齐**：原来是 align-items:flex-end（头像贴着行底，
   而气泡下面还挂着「已读」那一行，于是头像看着比气泡低一截）。改成 flex-start 后
   头像顶边 = 气泡顶边。行里其它元素（已读那行）仍在气泡下方，不受影响。 */
.mrow{display:flex;gap:8px;align-items:flex-start;max-width:100%;}
.mrow--self{flex-direction:row-reverse;}
/* 第53/54单 · 整行**朝向由应用钉死**。理由是一条实测过的方向坑：外面抄来的聊天 CSS
   几乎都写着 `.msg-out{justify-content:flex-end}`（在他们那边整行是 flex-direction:row），
   而本站"我发的"那行是 row-reverse —— 不钉的话那一句会把我的消息顶到**左边**去。
   ⚠️ 必须带 !important 且带上 #phone 作用域：抄来的 CSS 普遍满屏 !important（用户给的兔丸那套就是），
     而 !important **压过一切非 important 声明、与特异性无关**；同时第54单起用户规则会被统一套上
     `#phone ` 前缀（(1,x,x)，用来压过站内类选择器）—— 两件事叠起来，守卫若不跟着抬特异性就会被
     `#phone .msg-out{justify-content:flex-end !important}` 一句话打穿。
     抬到 (1,2,0) 之后：两边都 important 时比特异性，守卫赢。
      也就是说"整行朝向"是硬锁（左/右是语义不是样式），而间距/对齐/气泡外观统统照常可改。
   ⚠️ 只写 .mrow.mrow--ta / .mrow.mrow--self：`.msys.mrow--shadow`（系统消息）虽然也带
      mrow--shadow，但它**没有 .mrow 类**，所以不会被这条误伤。 */
#phone .mrow.mrow--ta{flex-direction:row !important;justify-content:flex-start !important;}
#phone .mrow.mrow--self{flex-direction:row-reverse !important;justify-content:flex-start !important;}
/* 第54单 · 尺寸走 --av-s（由 avSpan 写内联变量），不再写死内联 width/height：
   内联样式用户 CSS 压不动，所以以前 `.avatar{width:26px}` 这类写法永远无效。 */
.mav{width:var(--av-s,40px);height:var(--av-s,40px);border-radius:50%;flex:none;overflow:hidden;background:var(--acc-s);
  display:flex;align-items:center;justify-content:center;color:var(--acc-d);border:1px solid rgba(255,255,255,.7);box-shadow:var(--sh-s);}
.mav img{width:100%;height:100%;object-fit:cover;}
.mav svg{width:23px;height:23px;}
.mcol{max-width:var(--mcol-mw);display:flex;flex-direction:column;gap:3px;}
.mrow--self .mcol{align-items:flex-end;}
.bub{
  padding:calc(10px*var(--bub-k)) calc(13px*var(--bub-k));border-radius:calc(18px*var(--bub-k));
  /* 第58单 · 气泡自己的字体三件套（都带兜底值 → 没设时与改动前逐像素一致）：
     --bub-fs 字号系数、--bub-ink 文字色、--bub-font 字体。字号与「气泡大小」是**相乘**关系
     （基础 × 气泡自己的），所以两个滑杆可以各自调、互不覆盖。 */
  font-size:calc(calc(14px*var(--bub-k)*var(--bub-fs,1)) * var(--fk,1));line-height:1.65;word-break:break-word;
  font-family:var(--bub-font,inherit);
  white-space:pre-wrap;box-shadow:var(--sh-s);position:relative;
}
.mrow--ta .bub{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:calc(6px*var(--bub-k));color:var(--bub-ink,var(--ink));}
.mrow--self .bub{background:var(--acc);color:var(--bub-ink,var(--on-acc));border-bottom-right-radius:calc(6px*var(--bub-k));}
.bub--card{
  background:var(--card);border:1px solid var(--acc-s);color:var(--ink);
  font-family:var(--bub-font,var(--serif));letter-spacing:1px;padding:calc(13px*var(--bub-k)) calc(15px*var(--bub-k));
}
.mstat{display:flex;align-items:center;font-size:calc(calc(10px*var(--bub-k)) * var(--fk,1));color:var(--ink3);padding:0 4px;line-height:1;}
.mstat svg{width:calc(12px*var(--bub-k));height:calc(12px*var(--bub-k));display:block;}
.mstat--rd{color:var(--acc);}   /* 第127单 · 已读跟随**主题色**（原 --acc-d 是被对比度钳制压深的那个，调淡主题它也不跟着淡） */
/* 第128单 · 气泡下面那一行 = 时间戳 +（我发的才有）对钩。
   用户：「只有一个对钩感觉有点孤独，对钩左边增加消息时间戳吧。梦角消息那边也加时间」。
   所以两边都有时间；对钩仍只在我这边（梦角的消息没有送达/已读这回事）。
   ⚠️ `.mstat` 自身样式（字号 10px / 内边距 4px / 灰或主题色）**一律不动** —— 它是对钩的锚点，
       theme T12 与 bubcss C12 两条判据直接量它的字号与颜色；这里只加一层容器把时间摆在它左边。
   对齐：我这行靠右、梦角那行靠左，跟各自气泡同侧（气泡已经由 .mcol 的 align-items 决定）。 */
.mfoot{display:flex;align-items:center;justify-content:flex-start;gap:5px;line-height:1;
  font-size:calc(calc(10px*var(--bub-k)) * var(--fk,1));color:var(--ink3);padding:0 4px;}
.mfoot--self{justify-content:flex-end;}
.mfoot .mstat{padding:0;}          /* 间距交给 .mfoot 的 gap，别再叠一层，免得时间离对钩忽远忽近 */
.mfoot__t{letter-spacing:.3px;font-variant-numeric:tabular-nums;}
.msys{align-self:center;max-width:86%;background:rgba(255,255,255,.75);border:1px dashed var(--acc-s);
  color:var(--ink2);font-size:calc(11px * var(--fk,1));border-radius:999px;padding:5px 14px;text-align:center;letter-spacing:.5px;}
/* 第46单：同一枚 .msys 的两种变体 ——
   · msys--co：陪伴结束那条「陪了多久」，它是**消息**不是系统提示，所以把虚线换成实线（其余尺寸/底色/圆角一字不动）；
   · mpoke：拍一拍不再是气泡，退成一行纯文字，左右各一段短分割线（-内容- 的形式）。 */
.msys--co{border-style:solid;}
.mpoke{align-self:center;display:flex;align-items:center;justify-content:center;gap:8px;
  max-width:88%;padding:5px 0;color:var(--ink2);font-size:calc(11.5px * var(--fk,1));letter-spacing:.5px;text-align:center;line-height:1.6;}
.mpoke::before,.mpoke::after{content:"";flex:none;width:16px;border-top:1px solid var(--ink3);}
/* 第61单 · 撤回行：**与拍一拍同一套视觉**（居中一行纯文字、没有气泡、没有虚线框），
   但用户点名**不要两端那两条短横线** —— 所以这里故意不写 ::before/::after。
   开了「显示梦角撤回内容」时，下面多一行小字写它撤回了什么。 */
.mrec{align-self:center;display:flex;flex-direction:column;align-items:center;gap:2px;
  max-width:88%;padding:5px 0;color:var(--ink2);font-size:calc(11.5px * var(--fk,1));letter-spacing:.5px;text-align:center;line-height:1.6;}
.mrec__c{max-width:100%;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* 第117单 · 撤回原文过长时被上面那条截成一行（ellipsis）→ 点这一行（.mrec--more）就地展开/收起。
   展开后放开 nowrap/overflow，让长句按正常换行铺开；对齐方式保持这一行原有的居中观感不变。 */
.mrec--more{cursor:pointer;}
.mrec--more:active{opacity:.75;}
.mrec--more.on .mrec__c{white-space:normal;overflow:visible;text-overflow:clip;word-break:break-word;}
.typing{display:inline-flex;gap:4px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:18px;border-bottom-left-radius:6px;box-shadow:var(--sh-s);}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink3);animation:tp 1.1s infinite;}
.typing i:nth-child(2){animation-delay:.18s;}
.typing i:nth-child(3){animation-delay:.36s;}
@keyframes tp{0%,100%{opacity:.25;transform:translateY(0)}45%{opacity:1;transform:translateY(-3px)}}
.daysep{align-self:center;font-size:calc(10px * var(--fk,1));color:var(--ink3);letter-spacing:2px;margin:4px 0;}

/* 面板（消息流与输入条之间，展开时顶上去） */
.panel{
  flex:none;max-height:0;overflow:hidden;transition:max-height .22s ease;
  background:var(--card);border-top:1px solid var(--line);
}
.panel.open{max-height:264px;overflow-y:auto;}
.panel__grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px;}
.panel__it{
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px;
  border-radius:14px;background:var(--acc-f);border:1px dashed var(--acc-s);color:var(--acc-d);
}
.panel__it:active{transform:scale(.94);}
.panel__it svg{width:22px;height:22px;}
.panel__it span{font-size:calc(10px * var(--fk,1));color:var(--ink2);letter-spacing:1px;}
.panel__emo{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:12px;}
.panel__emo button{font-size:calc(22px * var(--fk,1));padding:6px 0;border-radius:10px;}
.panel__emo button:active{background:var(--acc-f);}

/* 输入条：更多(＋) → 输入区 → 表情 → 发送 */
.composer{
  flex:none;display:flex;align-items:flex-end;gap:8px;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:var(--card);border-top:1px solid var(--line);
}

/* 第41单 · 聊天顶栏与底栏的底色（必须紧跟基础规则之后：同特异度后写者胜）。
   语义翻转了：**100% = 完全透明**（底下就是整屏那一层连续渐变/图），
   0% 才是原来那层实心底色。所以拖到 100 就是"完全融入页面"，拖到 0 才是"一块实心板"。
   没写内联变量时 fallback 到 transparent —— 等于默认完全融入（观感与整屏渐变连续一致）。 */
.screen--chat .bar{
  background:var(--bar-fb,transparent);
  border-bottom-color:var(--line);
}
.screen--chat .composer{background:var(--composer-fb,transparent);}
.composer__input{
  flex:1;resize:none;border:1px solid var(--line);background:var(--acc-f);
  border-radius:20px;padding:9px 14px;font-size:calc(14px * var(--fk,1));line-height:1.5;font-family:inherit;
  color:var(--ink);outline:none;max-height:96px;min-height:38px;
}
.composer__input:focus{border-color:var(--acc);}
.composer .iconbtn{width:38px;height:38px;border-radius:50%;}
.sendbtn{
  width:38px;height:38px;border-radius:50%;flex:none;
  /* 第62单：原来是 --acc→--acc-d 的渐变粉圆，用户要求改成**很淡的半透明色**。
     --acc-a 是 JS 按当前主题色算出来的 rgba（见 paintBarOp），所以换主题/自选色调都不会脱节。 */
  background:var(--acc-a,rgba(239,156,181,.18));color:var(--acc-d);
  display:flex;align-items:center;justify-content:center;
  transition:transform .12s;
}
.sendbtn:active{transform:scale(.9);}
.sendbtn svg{width:18px;height:18px;margin-left:2px;}

/* ============ 纪念日小组件（Pair Card 版式） ============ */
.pcard{
  width:100%;margin-top:14px;background:var(--card);border:1px solid var(--line);
  border-radius:24px;box-shadow:var(--sh-s);padding:18px 16px 16px;
  display:flex;flex-direction:column;align-items:center;gap:9px;
}
.pcard:active{transform:scale(.985);}
.pcard__cap{font-size:calc(9px * var(--fk,1));letter-spacing:4px;color:var(--ink3);text-transform:uppercase;}
.pcard__avs{display:flex;align-items:center;margin-top:2px;}
.pcard__avs .mav{width:46px;height:46px;border:2.5px solid #fff;box-shadow:var(--sh-s);}
.pcard__avs .mav + .mav{margin-left:-12px;}
.pcard__nm{font-family:var(--serif);font-size:calc(17px * var(--fk,1));letter-spacing:2px;color:var(--ink);}
.pcard__pill{
  /* 第104单 · 单主要"淡淡的感觉"：原来底是 --acc-d（**被强制压深**以保证对比度的那个色）、
     文字是 --on-acc，所以调浅主题也还是深。改成：底=18% 极淡的 --acc-a，文字=主题色本身 --acc —— 
     这两者都不经过压深夹取，主题调浅它就跟着浅。 */
  background:var(--acc-a);color:var(--acc);
  font-size:calc(11px * var(--fk,1));letter-spacing:2px;padding:6px 15px;border-radius:999px;box-shadow:var(--sh-s);
}
.pcard__q{font-size:calc(11px * var(--fk,1));color:var(--ink2);letter-spacing:1.5px;}
/* 第32单 · 纪念日卡自选背景图：等比保留整张、cover 铺满卡面；再压一层白色柔光，
   保证浅色/花哨的照片上文字照样读得清（遮罩是真元素，便于量不透明度）。
   ⚠️ 只有设了背景时才挂 .pcard--bg / 插 .pcard__scrim —— 没背景时卡面与改动前逐像素一致。 */
.pcard{position:relative;overflow:hidden;}
.pcard--bg{background-size:cover;background-position:center;border-color:transparent;}
/* 第35单：柔光强度改为可调 —— 不再写死 .80→.64，改读内联 --scrim-a/--scrim-b
   （由 S.anniv.scr 算出，paintAnnivScrim() 写上；滑杆拖动时也走它）。
   下面这组 fallback 等于改动前那档观感：没设背景、或老档没这个字段时，卡面与改动前一致。 */
.pcard__scrim{position:absolute;inset:0;background:var(--scrim-a,rgba(255,255,255,.80));pointer-events:none;}
.pcard--bg .pcard__cap,.pcard--bg .pcard__avs,.pcard--bg .pcard__nm,
.pcard--bg .pcard__pill,.pcard--bg .pcard__q{position:relative;z-index:1;}

/* ============ 字卡库 ============ */
.lib-search{display:flex;align-items:center;gap:8px;margin:12px 16px 0;background:var(--card);
  border:1px dashed var(--acc-s);border-radius:16px;padding:9px 13px;box-shadow:var(--sh-s);}
.lib-search svg{width:15px;height:15px;color:var(--ink3);}
.lib-search input{flex:1;border:none;outline:none;background:none;font-size:calc(13px * var(--fk,1));color:var(--ink);}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;flex:none;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{
  flex:none;display:flex;align-items:center;gap:5px;font-size:calc(12px * var(--fk,1));letter-spacing:1px;
  padding:7px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink2);
}
.chip.on{background:var(--acc);color:var(--on-acc);border-color:transparent;box-shadow:var(--sh-s);}
.chip--hide{opacity:.55;text-decoration:line-through;}
.chip--add{border-style:dashed;color:var(--acc-d);}
/* 第58单 · 字体样式 chips：容器用**换行**而不是 .chips 那种横向滚动（设置页里导入了好几个字库时，
   横滑会藏住后面的项）；内距对齐 .bubslider 的 2px 16px 12px，跟同一张卡里的滑杆对齐。
   chip__x = 每个已导入字库右侧那个删除叉；cwell = 设置行里的小取色井（照 .accwell 的写法缩一档）。 */
.fchips{display:flex;flex-wrap:wrap;gap:8px;padding:2px 16px 12px;}
.chip__x{font-style:normal;opacity:.6;margin-left:2px;padding:0 1px;}
.chip__x:active{opacity:1;}
.cwell{position:relative;width:30px;height:30px;flex:none;border-radius:10px;overflow:hidden;
  border:1px solid var(--line);background:var(--card);box-shadow:var(--sh-s);}
.cwell input[type=color]{position:absolute;left:-10px;top:-10px;width:52px;height:52px;padding:0;border:none;background:none;cursor:pointer;}
.lib-meta{padding:8px 18px 0;font-size:calc(11px * var(--fk,1));color:var(--ink3);letter-spacing:1px;display:flex;justify-content:space-between;align-items:center;}
.lib-meta .ops{display:flex;gap:6px;}
.mini{
  font-size:calc(11px * var(--fk,1));padding:5px 11px;border-radius:999px;border:1px dashed var(--acc-s);
  background:var(--card);color:var(--acc-d);letter-spacing:1px;
}
.mini:active{transform:scale(.94);}
.mini--solid{background:var(--acc);color:var(--on-acc);border:none;}
.cardlist{flex:1;overflow-y:auto;padding:10px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px;}
.cardit{
  display:flex;align-items:flex-start;gap:10px;background:var(--card);
  border:1px solid var(--line);border-radius:16px;padding:12px 13px;box-shadow:var(--sh-s);
}
.cardit__tx{flex:1;font-size:calc(13.5px * var(--fk,1));line-height:1.7;white-space:pre-wrap;word-break:break-word;}
.cardit__ops{display:flex;gap:4px;flex:none;}
.cardit__ops button{width:28px;height:28px;border-radius:10px;color:var(--ink3);display:flex;align-items:center;justify-content:center;}
.cardit__ops button:active{background:var(--acc-f);color:var(--acc-d);}
.cardit__ops svg{width:15px;height:15px;}
/* 第45单 · 字卡库升级成三大类（字卡 / 双方的拍一拍 / 表情包）。
   顶部一排等宽分段键；每个大类各自一个滚动容器，切换即换内容。 */
.libtabs{display:flex;gap:7px;padding:11px 16px 2px;flex:none;}
.libtabs button{
  flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:calc(12.5px * var(--fk,1));letter-spacing:.5px;padding:9px 4px;border-radius:13px;color:var(--ink2);
  background:var(--card);border:1px solid var(--acc-f);
}
.libtabs button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.libtabs button i{font-style:normal;font-size:calc(10px * var(--fk,1));color:var(--ink3);flex:none;}
.libtabs button.on{color:var(--on-acc);border-color:transparent;background:var(--acc);box-shadow:var(--sh-s);}
.libtabs button.on i{color:rgba(255,255,255,.85);}
.libtabs button:active{transform:scale(.97);}
.libscroll{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:calc(22px + env(safe-area-inset-bottom));}
.libhint{padding:0 16px 10px;font-size:calc(11px * var(--fk,1));color:var(--ink3);line-height:1.7;letter-spacing:.5px;}
.libhint b{color:var(--acc-d);font-weight:600;}
/* 第46单：表情包大类的正文原本只活在弹层里，横向留白是 .sheet__bd 给的（18px）；
   搬到字卡库页之后就没人给这份留白，文字全贴边了。这里补上与页面同一套的 16px 节奏。 */
.libpad{padding:0 16px;}
.empty{
  margin:30px auto;text-align:center;color:var(--ink3);font-size:calc(12.5px * var(--fk,1));letter-spacing:2px;
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
.empty svg{width:34px;height:34px;opacity:.5;}

/* ============ 设置页 ============ */
.set-sec{margin:14px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh-s);overflow:hidden;}
.set-sec__t{
  font-size:calc(10px * var(--fk,1));letter-spacing:3px;color:var(--acc-d);text-transform:uppercase;
  padding:13px 16px 3px;display:flex;align-items:center;gap:8px;
}
.set-sec__t::after{content:"";flex:1;border-top:1px dashed var(--acc-f);}
/* 第46单 · 设置页每个类别默认折叠，点标题那一行展开。
   只作用于设置页（.screen--fold）—— 字卡库页「拍一拍」大类用的是**同一份** .set-sec markup，
   那边是完整管理界面，必须一直是展开的，所以折叠规则一个字节都不能外溢。
   折叠靠 CSS「藏掉标题之外的直接子元素」实现：展开时不写任何 display，
   每个子元素保留自己原本的 display（.setrow 是 flex，写死 display:block 会把它压坏）。 */
.screen--fold .set-sec__t{padding:14px 16px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;}
.screen--fold .set-sec__t::after{order:1;margin-right:10px;}
/* 折叠指示：右下两条边组成的角，rotate(-45deg)=朝右（收起）、rotate(45deg)=朝下（展开）。
   用 order 把它排到虚线**之后**（文字是匿名的 0 号 flex 项）。 */
.screen--fold .set-sec__t::before{
  content:"";order:2;flex:none;width:6px;height:6px;margin-right:2px;
  border-right:1.5px solid var(--ink3);border-bottom:1.5px solid var(--ink3);
  transform:rotate(-45deg);transition:transform .18s;
}
.screen--fold .set-sec.open .set-sec__t::before{transform:rotate(45deg);}
.screen--fold .set-sec:not(.open) > *:not(.set-sec__t){display:none;}
.setrow{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--acc-f);}
.setrow:first-of-type{border-top:none;}
.setrow__lb{flex:1;font-size:calc(13.5px * var(--fk,1));color:var(--ink);}
.setrow__ds{font-size:calc(10.5px * var(--fk,1));color:var(--ink3);margin-top:2px;letter-spacing:.5px;}
.setrow .mini{flex:none;}
/* 第39单 · 设置行里的不透明度滑杆（顶栏/底栏）：与自选色滑杆同一套轨道与拇指 */
.setrow input[type=range]{
  width:132px;flex:none;-webkit-appearance:none;appearance:none;background:transparent;height:22px;margin:0;
}
.setrow input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:999px;background:var(--acc-s);}
.setrow input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;
  background:#fff;border:2px solid var(--acc);margin-top:-6px;box-shadow:0 1px 4px rgba(0,0,0,.12);
}
.setrow input[type=range]::-moz-range-track{height:6px;border-radius:999px;background:var(--acc-s);}
.setrow input[type=range]::-moz-range-thumb{
  width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--acc);
}
.num{
  width:56px;text-align:center;border:1px solid var(--line);background:var(--acc-f);
  border-radius:10px;padding:7px 4px;font-size:calc(13px * var(--fk,1));color:var(--ink);outline:none;font-family:inherit;
}
.num:focus{border-color:var(--acc);}
.txt{
  flex:1;min-width:0;border:1px solid var(--line);background:var(--acc-f);
  border-radius:10px;padding:8px 12px;font-size:calc(13px * var(--fk,1));color:var(--ink);outline:none;font-family:inherit;
}
.txt:focus{border-color:var(--acc);}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 16px 16px;}
.sw{border-radius:16px;padding:10px 8px;border:2px solid transparent;background:var(--acc-f);display:flex;flex-direction:column;align-items:center;gap:7px;}
.sw i{width:30px;height:30px;border-radius:50%;box-shadow:var(--sh-s);}
.sw span{font-size:calc(11px * var(--fk,1));color:var(--ink2);letter-spacing:2px;}
.sw.on{border-color:var(--acc-d);background:var(--card);}
/* 自选色（第30单）：原生取色器 + H/S/L 三条滑杆（各带数值框）+ HEX，三入口联动。
   ⚠️ 拖动时只改变量与回写控件，**绝不 renderSettings()**（与 .bubslider 同一条铁律：
   重绘会把手正按着的滑杆换掉，拖动直接断掉）。
   轨道渐变由 JS 写成 --trk-s / --trk-l，不在 hsl() 里套 var —— 老 WebView 更稳。
   （变量名不带 --acc 前缀：预设态只留这两个内联，别跟"预设态无 --acc* 内联"混一起。） */
.accbox{border-top:1px solid var(--acc-f);padding:0 16px 16px;}
.accbox__hd{display:flex;align-items:baseline;gap:8px;padding:12px 0 10px;flex-wrap:wrap;}
.accbox__hd b{font-size:calc(12.5px * var(--fk,1));font-weight:600;color:var(--ink);letter-spacing:1px;}
.accbox__hd i{font-style:normal;font-size:calc(10.5px * var(--fk,1));color:var(--ink3);}
.accbox__top{display:flex;align-items:center;gap:12px;}
.accwell{position:relative;width:62px;height:62px;flex:none;border-radius:18px;overflow:hidden;
  background:var(--acc);border:1px solid var(--line);box-shadow:var(--sh-s);}
.accwell input[type=color]{position:absolute;left:-8px;top:-8px;width:78px;height:78px;padding:0;border:none;background:none;cursor:pointer;}
.accbox__col{flex:1;min-width:0;}
.accrow{display:flex;align-items:center;gap:8px;padding:3px 0;}
.accrow__k{width:12px;flex:none;font-size:calc(10.5px * var(--fk,1));letter-spacing:1px;color:var(--ink2);}
.accrow input[type=range]{
  -webkit-appearance:none;appearance:none;flex:1;min-width:0;height:20px;
  background:transparent;outline:none;display:block;cursor:pointer;
}
.accrow input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:999px;background:var(--acc-s);}
.accrow--h input[type=range]::-webkit-slider-runnable-track{
  background:linear-gradient(90deg,#ff5d5d,#ffd45d,#7ee87e,#5dd9ff,#6f8cff,#c86fff,#ff5dc8,#ff5d5d);
}
.accrow--s input[type=range]::-webkit-slider-runnable-track{background:var(--trk-s);}
.accrow--l input[type=range]::-webkit-slider-runnable-track{background:var(--trk-l);}
.accrow input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;margin-top:-6px;
  background:#fff;border:2px solid var(--acc);box-shadow:0 2px 7px rgba(74,61,66,.25);
}
.accrow input[type=range]::-moz-range-track{height:6px;border-radius:999px;background:var(--acc-s);}
.accrow--s input[type=range]::-moz-range-track{background:var(--trk-s);}
.accrow--l input[type=range]::-moz-range-track{background:var(--trk-l);}
.accrow input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--acc);}
.accrow .num{width:50px;padding:5px 2px;font-size:calc(12px * var(--fk,1));}
.accrow--hex{margin-top:7px;}
.accrow--hex .accrow__k{width:auto;font-size:calc(10.5px * var(--fk,1));}
.accrow--hex .txt{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:1px;}
.accwarn{margin-top:8px;font-size:calc(10.5px * var(--fk,1));line-height:1.7;color:var(--ink2);
  background:var(--acc-f);border:1px dashed var(--acc-s);border-radius:10px;padding:7px 10px;}
.accwarn[hidden]{display:none;}
.accbox .bubdemo{margin:12px 0 0;}
.avarow{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--acc-f);}
.avarow__av{width:52px;height:52px;border-radius:50%;overflow:hidden;background:var(--acc-s);border:2px solid #fff;box-shadow:var(--sh-s);
  display:flex;align-items:center;justify-content:center;color:var(--acc-d);flex:none;}
.avarow__av img{width:100%;height:100%;object-fit:cover;}
.avarow__av svg{width:30px;height:30px;}
.avarow .col{flex:1;min-width:0;}
.avarow .nm{font-size:calc(13.5px * var(--fk,1));margin-bottom:6px;}
.avarow .ops{display:flex;gap:6px;}
.tgl{
  width:46px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:background .18s;
}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15);transition:left .18s;}
.tgl.on{background:var(--acc);}
.tgl.on::after{left:23px;}
/* 气泡大小（第29单）：一条连续滑块 + 一块真·气泡预览。
   预览用的是真 `.bub`，所以它跟着 --bub-k 走 —— 拖动时所见即所得，不用另写一套样式。 */
.bubpct{flex:none;min-width:46px;text-align:right;font-size:calc(13.5px * var(--fk,1));color:var(--acc-d);letter-spacing:.5px;}
.bubslider{padding:2px 16px 12px;}
.bubslider input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;outline:none;
  display:block;cursor:pointer;
}
.bubslider input[type=range]::-webkit-slider-runnable-track{
  height:6px;border-radius:999px;background:var(--acc-s);
}
.bubslider input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;margin-top:-8px;
  background:#fff;border:2px solid var(--acc);box-shadow:0 2px 8px rgba(226,119,154,.35);
}
.bubslider input[type=range]::-moz-range-track{height:6px;border-radius:999px;background:var(--acc-s);}
.bubslider input[type=range]::-moz-range-thumb{
  width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--acc);
  box-shadow:0 2px 8px rgba(226,119,154,.35);
}
.bubslider__ends{display:flex;justify-content:space-between;font-size:calc(10.5px * var(--fk,1));color:var(--ink3);letter-spacing:1px;margin-top:2px;}
.bubdemo{
  margin:0 16px 12px;padding:12px 12px 14px;border-radius:16px;background:var(--acc-f);
  border:1px dashed var(--acc-s);display:flex;flex-direction:column;gap:9px;overflow:hidden;
}
.bubdemo__lb{font-size:calc(10px * var(--fk,1));letter-spacing:2px;color:var(--ink3);}
/* 预览里的两行只是**摆样子**，不进聊天流：所以显式关掉点击命中，免得被当消息点开菜单 */
.bubdemo .mrow{pointer-events:none;}
/* 第48单 · 自定义 CSS 的输入区与速查表。
   ⚠️ 等宽字体 + 关掉自动大写/自动纠正：手机上写 CSS 时被系统改成首字母大写会直接写出无效选择器。 */
.cssarea{
  width:100%;box-sizing:border-box;min-height:190px;resize:vertical;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:calc(12px * var(--fk,1));line-height:1.65;letter-spacing:0;color:var(--ink);
  background:var(--acc-f);border:1px dashed var(--acc-s);border-radius:14px;
  padding:11px 13px;outline:none;white-space:pre;overflow:auto;
}
.cssarea:focus{border-style:solid;border-color:var(--acc);}
.cssarea::placeholder{color:var(--ink3);}
.cssref{
  margin-top:10px;font-size:calc(11.5px * var(--fk,1));line-height:1.9;color:var(--ink2);
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;
}
.cssref b{color:var(--acc-d);font-weight:600;}
.cssref code{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:calc(11px * var(--fk,1));background:var(--acc-f);border-radius:5px;padding:1px 4px;
}
.pokelist{padding:6px 16px 14px;display:flex;flex-direction:column;gap:7px;}
.pokeit{display:flex;align-items:center;gap:8px;background:var(--acc-f);border:1px dashed var(--acc-s);border-radius:12px;padding:8px 12px;}
.pokeit span{flex:1;font-size:calc(12.5px * var(--fk,1));}
.pokeit button{color:var(--ink3);width:24px;height:24px;display:flex;align-items:center;justify-content:center;}
.pokeit svg{width:13px;height:13px;}
/* 第42单 · 设为默认的星标：默认那一条整行加实线描边 + 星标点亮，一眼能认出。 */
.pokeit.is-def{border-style:solid;border-color:var(--acc);background:var(--acc-s);}
.pokeit__st{color:var(--ink3);}
.pokeit__st.is-on{color:var(--acc-d);}
.pokeit__st svg{width:15px;height:15px;}
.pokeadd{display:flex;gap:8px;padding:0 16px 14px;}
/* 第37单 · 「我拍他」面板的网格 + 面板顺序调节页 */
.pokesub{font-size:calc(12px * var(--fk,1));color:var(--ink2);line-height:1.7;margin:0 0 14px;}
.pokegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:16px;}
/* 第43单 · 每条 = 卡片 + 右侧两个小键（星标/删除）。卡片本身仍是「点一下发出去」。
   卡片宽度让给 ops，所以 ops 用 flex:none 贴右边，不叠在文字上。 */
.pokegrid__row{display:flex;align-items:stretch;gap:5px;min-width:0;}
.pokegrid__row .pokegrid__it{flex:1;min-width:0;}
.pokegrid__row.is-def .pokegrid__it{border-color:var(--acc);background:var(--acc-s);}
.pokegrid__ops{display:flex;flex-direction:column;gap:4px;flex:none;}
.pokegrid__op{width:30px;display:flex;align-items:center;justify-content:center;
  border-radius:9px;background:var(--acc-f);border:1px solid var(--line);color:var(--ink3);}
.pokegrid__op:active{background:var(--acc-s);}
.pokegrid__op.is-on{color:var(--acc-d);border-color:var(--acc);}
.pokegrid__op svg{width:14px;height:14px;}
.pnlrows{display:flex;flex-direction:column;gap:7px;}
.pnlrow{display:flex;align-items:center;gap:8px;background:var(--acc-f);border:1px solid var(--line);
  border-radius:12px;padding:9px 10px;}
.pnlrow--off{background:var(--card);opacity:.92;}
.pnlrow__ic{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:9px;
  background:var(--card);color:var(--acc-d);flex:none;}
.pnlrow__ic svg{width:15px;height:15px;}
.pnlrow__nm{flex:1;font-size:calc(12.5px * var(--fk,1));min-width:0;}
.pnlrow__b{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--line);color:var(--ink2);flex:none;}
.pnlrow__b svg{width:13px;height:13px;}
.pnlrow__b:disabled{opacity:.35;}
.pnlrow__b--del{color:var(--ink3);}
.pnlsep{font-size:calc(10px * var(--fk,1));letter-spacing:2px;color:var(--ink3);margin:16px 0 8px;}
.about{text-align:center;color:var(--ink3);font-size:calc(10px * var(--fk,1));letter-spacing:2px;padding:22px 0 calc(26px + env(safe-area-inset-bottom));}

/* ============ 弹层 / 提示 ============ */
#sheetMask{position:absolute;inset:0;z-index:60;background:rgba(74,61,66,.32);opacity:0;pointer-events:none;transition:opacity .2s;}
#sheetMask.open{opacity:1;pointer-events:auto;}
#sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:61;background:var(--bg2);
  border-radius:26px 26px 0 0;transform:translateY(102%);transition:transform .24s ease;
  max-height:78%;display:flex;flex-direction:column;box-shadow:0 -12px 40px rgba(160,90,115,.2);
}
#sheet.open{transform:translateY(0);}
.sheet__hd{
  flex:none;display:flex;align-items:center;padding:16px 18px 8px;
  font-family:var(--serif);font-size:calc(16px * var(--fk,1));letter-spacing:2px;
}
.sheet__hd .iconbtn{width:32px;height:32px;border-radius:11px;}
.sheet__bd{flex:1;overflow-y:auto;padding:8px 18px calc(20px + env(safe-area-inset-bottom));}
.field{margin-bottom:14px;}
.field__lb{font-size:calc(11px * var(--fk,1));color:var(--ink2);letter-spacing:2px;margin-bottom:7px;display:block;}
.field textarea,.field select,.field input{
  width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;
  padding:11px 13px;font-size:calc(13.5px * var(--fk,1));color:var(--ink);outline:none;font-family:inherit;
}
.field textarea{min-height:120px;resize:vertical;line-height:1.7;}
.field select{
  appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 49%,var(--acc-d) 50%),linear-gradient(-45deg,transparent 49%,var(--acc-d) 50%);
  background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;
  background-size:6px 6px;background-repeat:no-repeat;
}
.field textarea:focus,.field select:focus,.field input:focus{border-color:var(--acc);}
.bigbtn{
  width:100%;padding:13px;border-radius:16px;font-size:calc(14px * var(--fk,1));letter-spacing:3px;
  background:var(--acc);color:var(--on-acc);box-shadow:var(--sh-s);
}
.bigbtn:active{transform:scale(.97);}
.bigbtn--ghost{background:var(--card);color:var(--acc-d);border:1px dashed var(--acc-s);box-shadow:none;}
.bigbtn--danger{background:#d96666;}
#toast{
  position:absolute;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-16px);
  z-index:80;background:rgba(74,61,66,.88);color:#fff;font-size:calc(12.5px * var(--fk,1));letter-spacing:1px;
  padding:9px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:all .25s;
  max-width:84%;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0);}
.grprow{display:flex;align-items:center;gap:9px;padding:11px 2px;border-bottom:1px dashed var(--acc-f);}
.grprow .nm{flex:1;font-size:calc(13.5px * var(--fk,1));}
.grprow .nm small{display:block;font-size:calc(10px * var(--fk,1));color:var(--ink3);margin-top:2px;letter-spacing:1px;}
/* ============ 语音通话（第10单） ============ */
#callLayer{position:absolute;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(40,29,37,.97);color:#fff;}
#callLayer.open{display:flex;}
.callav{width:98px;height:98px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.45);}
.callav.pulse{animation:callPulse 1.6s ease-out infinite;}
@keyframes callPulse{0%{box-shadow:0 0 0 0 rgba(239,156,181,.5)}70%{box-shadow:0 0 0 26px rgba(239,156,181,0)}100%{box-shadow:0 0 0 0 rgba(239,156,181,0)}}
.callnm{font-family:var(--serif);font-size:calc(22px * var(--fk,1));letter-spacing:2px;margin-top:18px;}
.callst{font-size:calc(12.5px * var(--fk,1));color:rgba(255,255,255,.6);letter-spacing:1px;margin-top:8px;}
.calltime{font-size:calc(14px * var(--fk,1));color:rgba(255,255,255,.82);letter-spacing:2px;margin-top:6px;font-variant-numeric:tabular-nums;}
.callact{display:flex;gap:32px;margin-top:42px;}
.callbtn{width:62px;height:62px;border-radius:50%;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:calc(10px * var(--fk,1));letter-spacing:1px;color:#fff;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.25);}
.callbtn--hang{background:#e0574f;}
.callbtn--ok{background:#5fbf8f;}
.callbtn--mini{background:rgba(255,255,255,.18);}
.callbtn svg{width:22px;height:22px;}
.callsub{margin-top:22px;font-size:calc(12px * var(--fk,1));color:rgba(255,255,255,.5);background:none;border:0;text-decoration:underline;cursor:pointer;}
#callMini{position:absolute;left:14px;top:74px;z-index:70;display:none;align-items:center;gap:8px;
  padding:8px 10px;border-radius:999px;background:rgba(58,42,50,.94);color:#fff;box-shadow:0 8px 22px rgba(0,0,0,.22);
  cursor:grab;touch-action:none;transition:left .18s,top .18s;}
#callMini.open{display:flex;}
#callMini.dragging{transition:none;cursor:grabbing;}
#callMini .cm__tx{font-size:calc(12px * var(--fk,1));letter-spacing:1px;font-variant-numeric:tabular-nums;}
/* 第44单：挂断键里放的是线描听筒 svg（红底白图标不变，只把 ✕ 换成图标）。
   显式让 svg 在按钮里**水平垂直都居中**（22px 圆按钮 vs 13px 图标，靠默认 baseline 会偏）。 */
#callMini .cm__x{width:22px;height:22px;border-radius:50%;border:0;background:#e0574f;color:#fff;font-size:calc(12px * var(--fk,1));line-height:1;cursor:pointer;flex:none;
  display:flex;align-items:center;justify-content:center;padding:0;}
#callMini .cm__x svg{width:13px;height:13px;display:block;}
.callhero{padding:16px 16px 4px;}
.callsbtn{width:100%;height:52px;border-radius:18px;border:0;background:var(--acc);color:var(--on-acc);
  font-family:var(--serif);font-size:calc(16px * var(--fk,1));letter-spacing:3px;box-shadow:var(--sh-s);cursor:pointer;}
.callstat{display:flex;gap:8px;margin:14px 16px;}
.callstat__i{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r-s);padding:10px 4px;text-align:center;}
.callstat__i b{display:block;font-family:var(--serif);font-size:calc(17px * var(--fk,1));}
.callstat__i span{font-size:calc(10px * var(--fk,1));color:var(--ink3);letter-spacing:1px;}
.calllog{margin:0 16px 8px;}
.callrow{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px dashed var(--acc-f);}
.callrow__ic{width:30px;height:30px;border-radius:50%;background:var(--acc-f);display:flex;align-items:center;justify-content:center;color:var(--acc-d);flex:none;}
.callrow__tx{flex:1;font-size:calc(13px * var(--fk,1));}
.callrow__tx small{display:block;font-size:calc(10px * var(--fk,1));color:var(--ink3);margin-top:2px;letter-spacing:.5px;}
.callrow__rt{font-size:calc(11px * var(--fk,1));color:var(--ink3);}
.bub--call{background:var(--card);border:1px solid var(--acc-s);display:flex;align-items:center;gap:8px;font-size:calc(calc(12.5px*var(--bub-k)) * var(--fk,1));letter-spacing:1px;}
/* ============ 信箱（第5单） ============ */
.lttabs{display:flex;gap:8px;padding:10px 16px 4px;}
.lttab{flex:1;padding:7px 0;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:calc(12.5px * var(--fk,1));color:var(--ink2);cursor:pointer;}
.lttab.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc);}
.ltlist{padding:8px 16px 4px;}
.ltit{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r-s);
  padding:12px 14px;margin-bottom:10px;cursor:pointer;box-shadow:var(--sh-s);}
.ltit__hd{display:flex;align-items:center;gap:8px;font-size:calc(13.5px * var(--fk,1));}
.ltit__hd b{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ltit__tm{font-size:calc(10.5px * var(--fk,1));color:var(--ink3);flex:none;}
.ltit__tg{font-size:calc(10px * var(--fk,1));padding:1px 6px;border-radius:999px;background:var(--acc-f);color:var(--acc-d);flex:none;}
.ltit__pv{display:block;font-size:calc(12px * var(--fk,1));color:var(--ink2);margin-top:5px;line-height:1.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ltit--un{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-f);}
.paper{background:var(--card);border:1px solid var(--line);border-radius:var(--r-s);padding:18px 16px;
  font-family:var(--serif);line-height:2.1;font-size:calc(14px * var(--fk,1));letter-spacing:.6px;box-shadow:var(--sh-s);}
.paper__t{font-size:calc(16px * var(--fk,1));letter-spacing:1px;margin-bottom:10px;}
.paper__b{white-space:pre-wrap;color:var(--ink);}
textarea.paperin{width:100%;min-height:160px;border:1px dashed var(--acc-s);border-radius:var(--r-s);padding:14px;
  font-family:var(--serif);line-height:2.1;font-size:calc(14px * var(--fk,1));background:var(--card);color:var(--ink);resize:vertical;}
.ltclear{display:flex;gap:10px;padding:4px 16px 12px;}
/* ============ 日记（第13单） ============ */
.dcal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:8px 14px 10px;}
.dcal__wd{text-align:center;font-size:calc(10px * var(--fk,1));color:var(--ink3);padding:2px 0;}
.dcal__d{position:relative;aspect-ratio:1/1;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:calc(12px * var(--fk,1));color:var(--ink);background:var(--card);border:1px solid var(--line);cursor:pointer;}
.dcal__d--em{background:transparent;border-color:transparent;cursor:default;}
.dcal__d--td{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-f);}
.dcal__dot{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;}
.dcal__moon{position:absolute;top:2px;right:4px;font-size:calc(8px * var(--fk,1));color:var(--acc-d);}
.dstat{display:flex;gap:8px;margin:2px 16px 10px;}
.dmoods{display:flex;flex-wrap:wrap;gap:6px;padding:4px 16px 8px;}
.dmo{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:calc(16px * var(--fk,1));cursor:pointer;}
.dmo.on{border-color:var(--acc);background:var(--acc-f);}
.dweas{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px;}
.dwe{padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:calc(12px * var(--fk,1));cursor:pointer;}
.dwe.on{border-color:var(--acc);background:var(--acc-f);color:var(--acc-d);}
.dnotebox{margin:10px 16px;padding:12px 14px;border-radius:var(--r-s);background:var(--acc-f);border:1px dashed var(--acc-s);
  font-size:calc(13px * var(--fk,1));line-height:1.9;font-family:var(--serif);}
.dbar{display:flex;align-items:center;gap:8px;padding:5px 16px;font-size:calc(11px * var(--fk,1));color:var(--ink3);}
.dbar i{flex:1;height:6px;border-radius:999px;background:var(--acc-f);overflow:hidden;display:block;}
.dbar i b{display:block;height:100%;background:var(--acc);}
/* ============ 礼物（第8单） ============ */
/* 送礼弹窗：分类 chips → 礼物网格 → 附言 */
.gcats{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;}
.gcat{padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:calc(12px * var(--fk,1));color:var(--ink2);letter-spacing:1px;cursor:pointer;}
.gcat.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc);}
.ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px;}
.git{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 9px;border-radius:14px;
  border:2px dashed var(--acc-s);background:var(--acc-f);color:var(--ink2);cursor:pointer;transition:transform .12s;}
.git:active{transform:scale(.95);}
.git.on{border:2px solid var(--acc);background:var(--card);color:var(--acc-d);box-shadow:var(--sh-s);}
.git__em{font-size:calc(26px * var(--fk,1));line-height:1;}
.git__nm{font-size:calc(11px * var(--fk,1));letter-spacing:.5px;text-align:center;line-height:1.3;}
.gempty{font-size:calc(12px * var(--fk,1));color:var(--ink3);text-align:center;padding:18px 0;letter-spacing:1px;}
/* 送礼弹窗底部的「看记录」回口 */
.gslink{margin-top:14px;text-align:center;}
.gslink button{font-size:calc(11.5px * var(--fk,1));color:var(--acc-d);letter-spacing:1px;
  text-decoration:underline;text-underline-offset:3px;text-decoration-style:dashed;}
/* 聊天流礼物卡片：我送 / TA 送 同一张卡，靠小标签区分（特异性要压过 .mrow--self .bub 的渐变底） */
.mrow--ta .bub--gift,.mrow--self .bub--gift{
  background:var(--card);border:1px solid var(--acc-s);color:var(--ink);
  display:block;padding:calc(11px*var(--bub-k)) calc(12px*var(--bub-k));font-family:var(--sans);letter-spacing:0;white-space:normal;min-width:calc(158px*var(--bub-k));
}
.gcard{display:flex;align-items:center;gap:10px;}
.gcard__em{width:42px;height:42px;border-radius:14px;background:var(--acc-f);display:flex;align-items:center;justify-content:center;font-size:calc(22px * var(--fk,1));flex:none;}
.gcard__tx{min-width:0;}
.gcard__nm{display:block;font-family:var(--serif);font-size:calc(13.5px * var(--fk,1));letter-spacing:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gcard__ds{display:block;font-size:calc(10px * var(--fk,1));color:var(--ink3);margin-top:3px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gcard__nt{margin-top:9px;font-size:calc(12px * var(--fk,1));line-height:1.75;color:var(--ink2);font-family:var(--serif);
  border-left:2px solid var(--acc-s);padding-left:8px;white-space:pre-wrap;word-break:break-word;}
.gcard__op{margin-top:10px;display:flex;align-items:center;gap:8px;}
.gcard__btn{font-size:calc(11.5px * var(--fk,1));padding:5px 15px;border-radius:999px;letter-spacing:1px;
  background:var(--acc);color:var(--on-acc);}
.gcard__btn:active{transform:scale(.95);}
.gcard__done{font-size:calc(10.5px * var(--fk,1));color:var(--ink3);letter-spacing:1px;}
/* 礼物盒页 */
.gftlist{padding:8px 16px 4px;}
.gftrow{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-s);padding:11px 12px;margin-bottom:9px;box-shadow:var(--sh-s);}
.gftrow--un{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-f);}
.gftrow__em{width:42px;height:42px;border-radius:14px;background:var(--acc-f);display:flex;align-items:center;justify-content:center;font-size:calc(21px * var(--fk,1));flex:none;}
.gftrow__tx{flex:1;min-width:0;}
.gftrow__hd{display:flex;align-items:center;gap:7px;font-size:calc(13.5px * var(--fk,1));}
.gftrow__hd b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gftrow__tg{font-size:calc(9.5px * var(--fk,1));padding:1px 6px;border-radius:999px;flex:none;letter-spacing:.5px;}
.gftrow__tg--out{background:var(--acc-f);color:var(--acc-d);}
.gftrow__tg--in{background:rgba(127,195,158,.2);color:#4f8f6f;}
.gftrow__nt{margin-top:4px;font-size:calc(12px * var(--fk,1));color:var(--ink2);line-height:1.6;font-family:var(--serif);
  border-left:2px solid var(--acc-s);padding-left:7px;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.gftrow__mt{margin-top:4px;font-size:calc(10px * var(--fk,1));color:var(--ink3);letter-spacing:.5px;}
.gftrow__ops{display:flex;flex-direction:column;gap:5px;flex:none;align-items:center;}
.gftrow__ops button{border-radius:999px;}
.gftrow__claim{font-size:calc(10.5px * var(--fk,1));padding:4px 10px;letter-spacing:1px;color:var(--on-acc);background:var(--acc);}
.gftrow__del{width:26px;height:26px;padding:0;display:flex;align-items:center;justify-content:center;
  color:var(--ink3);border:1px solid var(--line);background:var(--card);}
.gftrow__ops svg{width:13px;height:13px;}
/* 礼物库管理弹窗 */
.glibrow{display:flex;align-items:center;gap:9px;padding:10px 2px;border-bottom:1px dashed var(--acc-f);}
.glibrow__em{width:34px;height:34px;border-radius:11px;background:var(--acc-f);display:flex;align-items:center;justify-content:center;font-size:calc(17px * var(--fk,1));flex:none;}
.glibrow .col{flex:1;min-width:0;}
.glibrow .nm{font-size:calc(13.5px * var(--fk,1));}
.glibrow .nm small{display:block;font-size:calc(10px * var(--fk,1));color:var(--ink3);margin-top:2px;letter-spacing:.5px;}
.glibrow .iconbtn{width:30px;height:30px;border-radius:10px;}
/* ============ 红包（第7单） ============ */
/* 发红包弹窗：快捷金额 → 自定义 → 留言 */
.rpbal{margin-bottom:12px;font-size:calc(12px * var(--fk,1));color:var(--ink2);letter-spacing:1px;}
.rpbal b{font-family:var(--serif);font-size:calc(17px * var(--fk,1));color:var(--acc-d);letter-spacing:.5px;margin-left:4px;}
.rqks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.rqk{padding:11px 2px;border-radius:13px;border:2px dashed var(--acc-s);background:var(--acc-f);color:var(--ink2);
  font-size:calc(12.5px * var(--fk,1));letter-spacing:.5px;cursor:pointer;transition:transform .12s;}
.rqk:active{transform:scale(.95);}
.rqk.on{border:2px solid var(--acc);background:var(--card);color:var(--acc-d);box-shadow:var(--sh-s);font-weight:600;}
.rphint{font-size:calc(11.5px * var(--fk,1));color:var(--ink3);letter-spacing:.5px;margin:-4px 0 12px;line-height:1.7;}
#rpNote{min-height:72px;}   /* 红包留言只有 30 字，别沿用 120px 的大文本框 */
.rphint--bad{color:#d96666;}
/* 聊天流红包卡片：特异性要压过 .mrow--self .bub 的渐变底 */
.mrow--ta .bub--rp,.mrow--self .bub--rp{
  background:var(--card);border:1px solid var(--acc-s);color:var(--ink);
  display:block;padding:calc(11px*var(--bub-k)) calc(12px*var(--bub-k));font-family:var(--sans);letter-spacing:0;white-space:normal;min-width:calc(158px*var(--bub-k));}
.rprc{display:flex;align-items:center;gap:10px;}
.rprc__ic{width:42px;height:42px;border-radius:14px;flex:none;color:#fff;
  background:#d9675f;
  display:flex;align-items:center;justify-content:center;}
.rprc__ic svg{width:22px;height:22px;}
.rprc__tx{min-width:0;}
.rprc__nm{display:block;font-family:var(--serif);font-size:calc(13.5px * var(--fk,1));letter-spacing:1px;}
.rprc__st{display:block;font-size:calc(10.5px * var(--fk,1));color:var(--ink3);margin-top:3px;letter-spacing:.5px;}
.rprc__nt{margin-top:9px;font-size:calc(12px * var(--fk,1));line-height:1.75;color:var(--ink2);font-family:var(--serif);
  border-left:2px solid var(--acc-s);padding-left:8px;white-space:pre-wrap;word-break:break-word;}
.rprc__op{margin-top:10px;}
.rprc__btn{font-size:calc(11.5px * var(--fk,1));padding:5px 15px;border-radius:999px;letter-spacing:1px;color:#fff;
  background:#d9675f;}
.rprc__btn:active{transform:scale(.95);}
/* 拆红包 overlay：戳一下动画 */
.rpov{display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 6px 4px;}
.rpenv{position:relative;width:170px;height:212px;border-radius:18px;overflow:hidden;flex:none;cursor:pointer;
  background:#d8625c;color:#fff;box-shadow:0 12px 26px rgba(216,98,92,.28);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
.rpenv__flap{position:absolute;top:0;left:0;width:100%;height:74px;
  background:rgba(255,255,255,.13);
  border-bottom-left-radius:60% 34px;border-bottom-right-radius:60% 34px;}
.rpenv__seal{position:relative;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.92);color:#d8625c;
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:calc(20px * var(--fk,1));}
.rpenv__lb{position:relative;font-size:calc(11.5px * var(--fk,1));letter-spacing:1px;text-align:center;padding:0 14px;line-height:1.6;}
.rpenv__amt{position:relative;font-family:var(--serif);font-size:calc(30px * var(--fk,1));letter-spacing:1px;}
.rpenv.is-poked{animation:rpPoke .72s cubic-bezier(.34,1.56,.64,1);}
@keyframes rpPoke{
  0%{transform:scale(1) rotate(0)}
  28%{transform:scale(.9) rotate(-3deg)}
  58%{transform:scale(1.07) rotate(2.5deg)}
  80%{transform:scale(.98) rotate(-1deg)}
  100%{transform:scale(1) rotate(0)}
}
.rpov__t{font-size:calc(12.5px * var(--fk,1));color:var(--ink2);letter-spacing:1px;text-align:center;}
.rpov__note{font-size:calc(12px * var(--fk,1));line-height:1.8;color:var(--ink2);font-family:var(--serif);
  border-left:2px solid var(--acc-s);padding-left:9px;max-width:250px;white-space:pre-wrap;word-break:break-word;}
.rpov .bigbtn{width:100%;}
/* 红包页：双卡 + 流水（收绿支红） */
.rpduo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 16px 4px;}
.rpcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-s);padding:13px 14px;box-shadow:var(--sh-s);}
.rpcard__t{display:block;font-size:calc(11px * var(--fk,1));color:var(--ink3);letter-spacing:1px;}
.rpcard__y{display:block;font-family:var(--serif);font-size:calc(22px * var(--fk,1));letter-spacing:.5px;margin-top:6px;color:var(--acc-d);}
.rpcard__s{display:block;font-size:calc(10.5px * var(--fk,1));color:var(--ink3);margin-top:5px;letter-spacing:.5px;}
.rplist{padding:10px 16px 4px;}
.rprow{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-s);padding:11px 12px;margin-bottom:9px;box-shadow:var(--sh-s);}
.rprow--un{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-f);}
.rprow__ic{width:42px;height:42px;border-radius:14px;flex:none;color:#fff;
  background:#d9675f;
  display:flex;align-items:center;justify-content:center;}
.rprow__ic svg{width:21px;height:21px;}
.rprow__tx{flex:1;min-width:0;}
.rprow__hd{display:flex;align-items:center;gap:7px;font-size:calc(13.5px * var(--fk,1));}
.rprow__hd b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rprow__st{font-size:calc(9.5px * var(--fk,1));padding:1px 6px;border-radius:999px;flex:none;letter-spacing:.5px;
  background:var(--acc-f);color:var(--acc-d);}
.rprow__nt{margin-top:4px;font-size:calc(12px * var(--fk,1));color:var(--ink2);line-height:1.6;font-family:var(--serif);
  border-left:2px solid var(--acc-s);padding-left:7px;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.rprow__mt{margin-top:4px;font-size:calc(10px * var(--fk,1));color:var(--ink3);letter-spacing:.5px;}
.rprow__amt{font-family:var(--serif);font-size:calc(14px * var(--fk,1));letter-spacing:.5px;flex:none;}
.rprow__amt--in{color:#4f8f6f;}
.rprow__amt--out{color:#d96666;}
.rprow__go{font-size:calc(10.5px * var(--fk,1));padding:4px 11px;border-radius:999px;letter-spacing:1px;color:#fff;flex:none;
  background:#d9675f;}
/* ===== 第9单 表情包：面板 / 网格 / 管理 / 进度 / 气泡 / 信纸 ===== */
/* 表情面板比「更多」面板高：tab 行 + 网格 + 两个按钮。同权重后写赢，所以这条必须在 .panel.open 之后 */
.panel.open.panel--stk{max-height:58vh;}

.stktabs{display:flex;gap:7px;overflow-x:auto;padding:12px 14px 4px;scrollbar-width:none;}
.stktabs::-webkit-scrollbar{display:none;}
.stktab{flex:none;display:flex;align-items:center;gap:5px;font-size:calc(11.5px * var(--fk,1));letter-spacing:.8px;
  padding:6px 12px;border-radius:999px;color:var(--ink2);background:var(--card);border:1px solid var(--line);}
.stktab i{font-style:normal;font-size:calc(10px * var(--fk,1));color:var(--ink3);}
.stktab.on{color:var(--on-acc);border-color:transparent;background:var(--acc);box-shadow:var(--sh-s);}
.stktab.on i{color:rgba(255,255,255,.82);}
.stktab.hid{opacity:.55;}

.stkgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:10px 14px;}
.stkgrid--mg{padding:8px 0 4px;}
.stkgrid--pick{padding:8px 0 10px;}
.stk-tile{position:relative;aspect-ratio:1/1;border-radius:13px;background:var(--acc-f);
  border:1px solid var(--acc-s);overflow:visible;}
.stk-tile__main{width:100%;height:100%;border-radius:12px;display:flex;align-items:center;
  justify-content:center;padding:4px;overflow:hidden;}
.stk-tile__main:active{transform:scale(.93);}
/* contain 不是 cover —— 上传的图按原比例放进来，绝不裁切 */
.stk-tile__main img{width:100%;height:100%;object-fit:contain;}
.stk-tile__e{font-size:calc(22px * var(--fk,1));line-height:1;}
.stk-tile.is-hid{opacity:.42;}
.stk-tile.is-sel{border:2px solid var(--acc);background:var(--card);}
.stk-tile__del,.stk-tile__op{position:absolute;top:-6px;right:-6px;width:19px;height:19px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);
  color:var(--ink3);box-shadow:var(--sh-s);}
.stk-tile__op{color:var(--ink2);}
.stk-tile__del svg,.stk-tile__op svg{width:11px;height:11px;}
.stk-tile__chk{position:absolute;bottom:-5px;left:-5px;width:18px;height:18px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);
  color:var(--on-acc);box-shadow:var(--sh-s);}
.stk-tile__chk svg{width:11px;height:11px;}
.stk-tile.is-sel .stk-tile__chk{background:var(--acc);border-color:transparent;}
.stk-tile__main--pick{flex:none;aspect-ratio:1/1;border-radius:13px;background:var(--acc-f);
  border:1px solid var(--acc-s);display:flex;align-items:center;justify-content:center;padding:4px;overflow:hidden;}

.stkempty{padding:14px 4px;text-align:center;font-size:calc(12px * var(--fk,1));line-height:1.9;color:var(--ink3);letter-spacing:.5px;}
.stkhint{padding:6px 14px 10px;font-size:calc(10.5px * var(--fk,1));line-height:1.7;color:var(--ink3);letter-spacing:.5px;text-align:center;}

.stkimp{margin-bottom:14px;padding:11px 13px;border-radius:var(--r-s);background:var(--acc-f);border:1px dashed var(--acc-s);}
.stkimp__t{font-size:calc(12.5px * var(--fk,1));letter-spacing:1px;color:var(--acc-d);}
.stkimp__bar{height:5px;border-radius:999px;background:#fff;overflow:hidden;margin:7px 0 6px;}
.stkimp__bar i{display:block;height:100%;border-radius:999px;
  background:var(--acc);transition:width .18s ease;}
.stkimp__c{font-size:calc(10.5px * var(--fk,1));color:var(--ink3);letter-spacing:.5px;}

.stkdel{display:flex;align-items:center;justify-content:center;padding:12px 0 4px;}
.stkdel__p{max-width:120px;max-height:120px;border-radius:14px;border:1px solid var(--line);}
.stkdel__e{font-size:calc(40px * var(--fk,1));line-height:1;}
.stkdel__t{font-size:calc(13px * var(--fk,1));line-height:1.9;color:var(--ink2);margin:10px 0 16px;}

.stkart{display:block;border-radius:10px;}
.stkart--img{width:auto;height:auto;}
.stkart--e{font-size:calc(38px * var(--fk,1));line-height:1.15;border-radius:0;}
.bub--stk{padding:calc(8px*var(--bub-k));}
.bub--stk .stkart--e{font-size:calc(calc(44px*var(--bub-k)) * var(--fk,1));}
.bub--mixed .stkart{margin-top:calc(7px*var(--bub-k));}

.paper__stks{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;
  padding-top:11px;border-top:1px dashed var(--acc-s);}
.pstk{position:relative;display:flex;align-items:center;justify-content:center;padding:4px;
  border-radius:11px;background:var(--acc-f);border:1px solid var(--acc-s);}
.pstk .stkart--img{max-width:54px;max-height:54px;}
.pstk .stkart--e{font-size:calc(26px * var(--fk,1));}
.pstk__x{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);color:var(--ink3);}
.pstk__x svg{width:10px;height:10px;}
.pstkadd{display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:999px;font-size:calc(11px * var(--fk,1));
  letter-spacing:1px;color:var(--acc-d);background:var(--card);border:1px dashed var(--acc-s);}
.pstkadd svg{width:14px;height:14px;}
.pstktop{font-size:calc(10px * var(--fk,1));color:var(--ink3);letter-spacing:.5px;margin-left:auto;}


/* ===== 第19单 陪伴：发起页 / 进行态 / 过渡 / 管理 / 日记 ===== */
.cocards{display:flex;flex-direction:column;gap:9px;margin:12px 0 14px;}
.coscene{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:var(--r);
  background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-s);text-align:left;
  transition:border-color .16s ease,transform .16s ease;}
.coscene.on{border-color:var(--acc);box-shadow:0 6px 18px rgba(0,0,0,.06);}
.coscene.is-hid{opacity:.5;}
.coscene__ic{display:flex;align-items:center;justify-content:center;width:38px;height:38px;flex:none;
  border-radius:13px;background:var(--acc-f);color:var(--acc-d);}
.coscene__ic svg{width:19px;height:19px;}
.coscene__tx{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1;}
.coscene__nm{display:block;font-family:var(--serif);font-size:calc(15px * var(--fk,1));letter-spacing:1px;color:var(--ink);}
.coscene__ds{display:block;font-size:calc(11px * var(--fk,1));line-height:1.5;color:var(--ink2);}
.cotimes{display:flex;flex-wrap:wrap;gap:7px;padding:2px 2px 6px;}
.cotime{padding:7px 13px;border-radius:999px;font-size:calc(12px * var(--fk,1));letter-spacing:.6px;color:var(--ink2);
  background:var(--card);border:1px dashed var(--acc-s);}
.cotime.on{color:var(--on-acc);background:var(--acc);border-style:solid;border-color:var(--acc);}
.cohint{font-size:calc(11.5px * var(--fk,1));line-height:1.7;color:var(--ink2);letter-spacing:.4px;margin:10px 2px 0;}
.cohint2{font-size:calc(10.5px * var(--fk,1));line-height:1.7;color:var(--ink3);margin-top:6px;}
.colast{padding:11px 13px;border-radius:var(--r-s);background:var(--acc-f);border:1px solid var(--acc-s);margin:12px 0 0;}
.colast__t{display:block;font-size:calc(12px * var(--fk,1));letter-spacing:1px;color:var(--acc-d);font-family:var(--serif);}
.colast__s{display:block;font-size:calc(11.5px * var(--fk,1));line-height:1.6;color:var(--ink2);margin-top:4px;}
.coinv{padding:14px;border-radius:var(--r);background:var(--card);border:1px solid var(--acc-s);
  box-shadow:var(--sh-s);margin:12px 0 0;}
.coinv__hd{display:flex;align-items:center;gap:9px;font-size:calc(12.5px * var(--fk,1));color:var(--ink);letter-spacing:.6px;}
.coinv__tx{font-size:calc(13px * var(--fk,1));line-height:1.8;color:var(--ink);margin:10px 0 6px;font-family:var(--serif);}
.coinv__mt{font-size:calc(11px * var(--fk,1));color:var(--ink3);letter-spacing:.6px;}
.coinv__ops{display:flex;gap:9px;margin-top:12px;}
.coinv__ops .bigbtn{margin:0;flex:1;}
.costat{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:10px 0 4px;}
.costat__i{padding:11px 6px;border-radius:var(--r-s);background:var(--card);border:1px solid var(--line);text-align:center;}
.costat__i b{display:block;font-family:var(--serif);font-size:calc(15px * var(--fk,1));color:var(--acc-d);letter-spacing:.5px;}
.costat__i span{display:block;font-size:calc(10px * var(--fk,1));color:var(--ink3);margin-top:4px;letter-spacing:.4px;}
.colist{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.corow{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:var(--r-s);
  background:var(--card);border:1px solid var(--line);}
.corow__ic{display:flex;align-items:center;justify-content:center;width:32px;height:32px;flex:none;
  border-radius:11px;background:var(--acc-f);color:var(--acc-d);}
.corow__ic svg{width:16px;height:16px;}
.corow__tx{flex:1;min-width:0;font-size:calc(13px * var(--fk,1));color:var(--ink);}
.corow__tx small{display:block;margin-top:3px;font-size:calc(10.5px * var(--fk,1));color:var(--ink3);}
.corow__rt{font-size:calc(10.5px * var(--fk,1));color:var(--ink3);flex:none;letter-spacing:.4px;}
/* 过渡层：全屏渐入渐出的一句话 */
#coTrans{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  padding:32px;text-align:center;font-family:var(--serif);font-size:calc(17px * var(--fk,1));line-height:1.9;letter-spacing:2px;
  color:#fff;background:rgba(74,61,66,.86);
  opacity:0;pointer-events:none;transition:opacity .5s ease;backdrop-filter:blur(2px);}
#coTrans.open{opacity:1;pointer-events:auto;}
/* 进行态层：全屏氛围（背景图 + 计时 + 双音频） */
#coLayer{position:absolute;inset:0;z-index:55;display:none;flex-direction:column;
  align-items:center;justify-content:center;padding:28px 22px;text-align:center;
  background-color:var(--bg1);background-size:cover;background-position:center;background-repeat:no-repeat;}
#coLayer.open{display:flex;}
#coLayer.open::before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.55);}
.colive,#coLayer>.costage{position:relative;z-index:1;width:100%;max-width:320px;}
.colive__scene{font-size:calc(11.5px * var(--fk,1));letter-spacing:2px;color:var(--ink2);}
.colive__time{font-family:var(--serif);font-size:calc(44px * var(--fk,1));letter-spacing:3px;color:var(--ink);margin:12px 0 6px;}
.colive__sub{font-size:calc(11.5px * var(--fk,1));letter-spacing:1px;color:var(--ink2);}
.colive__av{display:flex;justify-content:center;margin:22px 0 18px;}
.colive__audio{display:flex;gap:10px;justify-content:center;}
.coad{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 14px;border-radius:var(--r-s);
  font-size:calc(10.5px * var(--fk,1));letter-spacing:.6px;color:var(--acc-d);background:var(--card);border:1px solid var(--acc-s);}
.coad svg{width:16px;height:16px;}
.coad.is-off{color:var(--ink3);border-color:var(--line);opacity:.6;}
/* 陪伴进行中：正在听哪一段白噪音 + 随时换（点它开切换弹层） */
.colive__nz{display:flex;justify-content:center;margin:0 0 12px;}
.conz{display:inline-flex;align-items:center;gap:7px;max-width:290px;padding:7px 12px;border-radius:999px;
  font-size:calc(11.5px * var(--fk,1));color:var(--ink2);background:var(--card);border:1px solid var(--acc-s);cursor:pointer;}
.conz svg{width:14px;height:14px;flex:none;color:var(--acc);}
