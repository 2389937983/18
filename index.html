/* ---------- 第61单 · 撤回 ----------
   撤回后的消息**不再画原气泡**，换成一行居中纯文字（视觉同拍一拍，但**没有两端短线**，用户点名）。
   我方只写「你撤回了一条消息」；对方那句按设置决定要不要把**撤回了什么**也写出来 ——
   正文一直存在档里，所以那个开关随时开都有效（对已经撤回的历史也生效）。
   ⚠️ 这行仍然带 data-id：点引用块「跳回原消息」还能滚到它、闪一下，不会变成找不到。 */
window.mrecHTML=function(m){
  var mine=(m.from==='self');
  var t=mine?'你撤回了一条消息':(TA_NAME()+'撤回了一条消息');
  var c='';
  if(!mine&&S.settings.recShow){
    var q=window.quoteOf(m);                       /* 表情/图片走占位标签，不会把 base64 写出来 */
    if(q&&q.label)c='<span class="mrec__c">'+esc(q.label)+'</span>';
  }
  /* 第117单 · 拼接过长时那行原文被 nowrap 截断（ellipsis）→ 点这一行就地展开/收起全文。
     只有"确实有原文"时才挂动作：不给纯提示行加一个点了没反应的假控件。 */
  return '<div class="mrec'+(c?' mrec--more':'')+'" data-id="'+esc(m.id)+'"'+
    (c?(' data-act="mrec-more" role="button" tabindex="0" aria-label="展开或收起撤回的内容"'):'')+'>'+
    '<span class="mrec__t">'+esc(t)+'</span>'+c+'</div>';
};
/* 第128单 · 气泡下面那一行：**时间戳 +（只有我发的才有）对钩**。
   用户说"只有一个对钩感觉有点孤独"，要求对钩左边补上消息时间；梦角那边也补时间。
   所以两边都有时间，对钩仍只属于我发的（梦角的消息没有送达/已读这回事）。
   时间只到分钟（fmtT = HH:MM），日期另有 daysep 分隔条管，不重复。
   ⚠️ 对钩仍是原来的 `.mstat` 节点（类名、aria-label、字体都没动）—— theme T12 / bubcss C12
     两条判据盯的就是它，套一层容器不影响它们的读数。 */
window.mfootHTML=function(m){
  var t=(m&&m.ts)?('<span class="mfoot__t">'+window.fmtT(m.ts)+'</span>'):'';
  var st=(m.from==='self')?('<div class="mstat '+(m.seen?'mstat--rd':'')+'" aria-label="'+(m.seen?'已读':'送达')+'">'+ico('check')+'</div>'):'';
  if(!t&&!st)return '';
  return '<div class="mfoot '+(m.from==='self'?'mfoot--self':'mfoot--ta')+'">'+t+st+'</div>';
};
/* ---------- 聊天页 ---------- */
function msgHTML(m,prev){
  /* 第61单 · 撤回行**最先拦**：不管它原本是文字、字卡、表情还是视频，撤回后一律那一行 */
  if(m.rec)return window.mrecHTML(m);
  /* 第46单：type 'sys' 有三种样子 —— 拍一拍（纯文字 + 两侧短线）、陪伴总结（实线气泡）、其余系统行（原样虚线气泡） */
  if(m.type==='sys'){
    if(m.k==='poke')return '<div class="mpoke">'+esc(m.text)+'</div>';
    return '<div class="msys'+(m.k==='co'?' msys--co':'')+'">'+esc(m.text)+'</div>';
  }
  if(m.type==='call'){
    /* 第125单 · 通话结算改成和「陪伴记录」一样的显示（用户给的对照图：那行「一起睡觉 · 5秒」）。
       原来它画成"头像 + 气泡 + 已读/送达"的整行 ✗；陪伴记录走的是 type:'sys' + k:'co' →
       `<div class="msys msys--co">文字</div>`（居中胶囊、实线描边）。这里直接复用同一套类名，
       所以两处样式**永远同源**（以后改 .msys--co 两边一起变），也不再画头像和气泡。
       data-id 保留：点这条仍能被既有机制认出来。 */
    return '<div class="msys msys--co" data-id="'+esc(m.id)+'">'+esc(m.text)+'</div>';
  }
  if(m.type==='gift'){

/* 视频气泡：**封面缩略图 + 时长角标**，点一下才开全屏播放。
   为什么不直接在气泡里挂 <video>：一条长记录能挂几十个 video 元素，手机上必卡；
   而且内联 video 会自动播放被拦（`play()` 是 Promise reject），气泡里就是一块黑。
   ⚠️ 封面走 IDB（键 `p:<id>`），渲染时先画 CSS 渐变占位、取到再贴 —— 别把封面 base64 塞消息里，
   每条二十来 KB，几十条又是一份「看不见的存档膨胀」。 */
window.vidMsgHTML=function(m,prev){
  var vTa=m.from==='other';
  var vShow=!prev||Math.abs(m.ts-prev.ts)>5*60*1000;
  var vDay=vShow?'<div class="daysep">'+fmtFull(m.ts)+'</div>':'';
  var vAv=vTa?'<span data-act="avtap" aria-label="双击拍一拍">'+avSpan('ta',40)+'</span>':avSpan('me',40);
  var vStat=window.mfootHTML(m);   /* 第128单 · 时间 +（我发的才有）对钩 */
  var v=window.vidFind?window.vidFind(m.vid):null;
  var body;
  if(!v||!v.st){
    /* 元数据没了或本体不在本机：不做成可点的空壳，直接说清楚 */
    body='<div class="vidcard is-gone">'+ico('video')+'<span>视频不在本机了</span>'+
      '<em>'+esc((v&&v.name)||m.text||'')+'</em></div>';
  }else{
    var W=208,h=Math.round(W*(v.h||9)/(v.w||16));
    h=Math.max(117,Math.min(280,h));                     /* 竖屏别顶到天上去，横屏别压成一条 */
    var mt=[];if(v.w&&v.h)mt.push(v.w+'×'+v.h);
    if(v.size)mt.push(window.nzSizeText(v.size));
    if(v.name)mt.push(v.name);
    body='<button class="vidcard" data-act="vid-open" data-id="'+esc(v.id)+'" aria-label="播放视频 '+esc(v.name||'')+'">'+
        '<span class="vidcard__ph" data-vposter="'+esc(v.id)+'" style="height:'+h+'px"></span>'+
        '<span class="vidcard__pl">'+ico('play')+'</span>'+
        (v.dur?'<span class="vidcard__du">'+window.fmtClock(v.dur)+'</span>':'')+
      '</button>'+
      (mt.length?'<div class="vidcard__mt">'+esc(mt.filter(Boolean).join(' · '))+'</div>':'');
  }
  return vDay+'<div class="mrow '+(vTa?'mrow--ta':'mrow--self')+'" data-id="'+m.id+'">'+vAv+
    '<div class="mcol"><div class="bub bub--vid">'+body+'</div>'+vStat+'</div></div>';
};
/* 渲染完聊天后统一贴封面：命中 RT.vidPoster 缓存就同步贴，否则异步取一次。
   缓存挂在 RT 上（**不能挂回 S** —— 那会被写进存档，blob: URL 下次刷新就是死链）。 */
window.vidFillPosters=function(){
  var els=document.querySelectorAll('[data-vposter]');
  if(!els.length)return;
  [].slice.call(els).forEach(function(el){
    var id=el.getAttribute('data-vposter');
    if(!id)return;
    var c=RT.vidPoster&&RT.vidPoster[id];
    if(c){el.style.backgroundImage='url('+c+')';el.classList.add('has');return;}
    if(el.getAttribute('data-vp-try'))return;      /* 试过一次没封面就别每次重绘都再捅 IDB */
    el.setAttribute('data-vp-try','1');
    window.mdGet('p:'+id,function(b){
      if(!b)return;                                 /* 没封面：保持渐变占位，功能不受影响 */
      var url=window.mdUrl(b);                      /* 字符串(dataURL)/Blob 都吃，别直接 createObjectURL */
      if(!url)return;
      RT.vidPoster=RT.vidPoster||{};RT.vidPoster[id]=url;
      el.style.backgroundImage='url('+url+')';el.classList.add('has');
    });
  });
};
/* 全屏播放层（#vidLayer 在 .app 外，重绘聊天不会把正在播的 video 元素拆掉）
   ⚠️ 打开一次才创建 video 元素、关闭时把 blob URL 全部释放 —— 不然连看十几段手机上就是几百 MB。 */
window.openVidPlay=function(id){
  var v=window.vidFind?window.vidFind(id):null;
  if(!v){toast('这段视频的记录已经不在了');return;}
  if(!v.st){toast('这段视频不在本机了');return;}
  var L=$('vidLayer');if(!L)return;
  window.closeVidPlay(true);                        /* 先清上一次，别让两段同时挂着 */
  /* 封面先垫上：video 是从 IDB 异步取回来才建的，中间那一两秒本来是空的；
     而且**在异步回调里挂 autoplay 有可能被 WebView 拦**（APK/iOS 会判成「非用户手势」）——
     真被拦了就停在第一帧，有 poster 至少是张真图，不是一块黑。 */
  var cover=(RT.vidPoster&&RT.vidPoster[id])||'';
  L.innerHTML='<div class="vidfull"><button class="vidfull__x" data-act="vid-close" aria-label="关闭">'+ico('x')+'</button>'+
    '<div class="vidfull__box" id="vidBox"><div class="vidfull__hint">正在取出视频…</div></div>'+
    '<div class="vidfull__mt">'+esc(v.name||'视频')+(v.dur?' · '+window.fmtClock(v.dur):'')+'</div></div>';
  L.classList.add('open');
  window.mdGet('v:'+id,function(b){
    var box=$('vidBox');if(!box)return;
    if(!b){box.innerHTML='<div class="vidfull__hint">视频不在本机了</div>';return;}
    var url=window.mdUrl(b);
    if(!url){box.innerHTML='<div class="vidfull__hint">这段视频读不出来了</div>';return;}
    RT.vidUrl=RT.vidUrl||{};RT.vidUrl[id]=url;
    box.innerHTML='<video class="vidfull__v" src="'+url+'"'+
      (cover?' poster="'+esc(cover)+'"':'')+' controls autoplay playsinline preload="auto"></video>';
    if(!cover){
      /* 缓存里没有（比如刚刷新还没贴过）→ 补一次。只认 dataURL 字符串：
         真拿到 Blob 就走开了，省得为一个 poster 再多一个要释放的 object URL。 */
      window.mdGet('p:'+id,function(p){
        if(typeof p!=='string')return;
        var el=box.querySelector('video');if(el)el.setAttribute('poster',p);
      });
    }
  });
};
window.closeVidPlay=function(quiet){
  var L=$('vidLayer');if(!L)return;
  var v=L.querySelector('video');
  if(v){try{v.pause();}catch(e){}}
  L.classList.remove('open');L.innerHTML='';
  /* 释放 blob URL：顺序必须是「先拆 DOM 再 revoke」，反了会报 ERR_FILE_NOT_FOUND。
     只 revoke blob: 开头的 —— dataURL 是原样透传的，拿它去 revoke 没意义。 */
  var u=RT.vidUrl||{};
  Object.keys(u).forEach(function(k){
    var s=u[k];
    if(typeof s==='string'&&s.slice(0,5)==='blob:'){try{URL.revokeObjectURL(s);}catch(e){}}
  });
  RT.vidUrl={};
  if(!quiet)closePanel();
};
window.renderThread=function(){

/* 第40单 · 聊天背景图改挂在 .screen--chat 上（整屏一张），
   而不是 .thread —— 否则顶栏/底栏调透明时透出来的是纯色，看不出变化。
   没有背景图时写 'none'，让 CSS 回落到原有底色（观感与改动前一致）。 */
function threadBgStyle(){return '';}
/* 第41单：整屏一层底。
   有照片 → 「照片在上 + 半透明主题色垫底」（第一层最上，照片不能被垫底盖住）。
   没照片 → 那条不透明渐变（与改动前观感一致），清掉变量走 CSS 里的 fallback。
   顶栏/底栏/消息区三块都透明盖在这一层上，所以滑杆一动整屏连续渐变立刻看得见。 */
window.paintChatBg=function(){
  var st=document.documentElement.style;
  var b=S.settings.chatBg;
  if(!b){st.removeProperty('--chat-bg');st.removeProperty('--chat-bg-layer');return;}
  st.setProperty('--chat-bg','url('+b+')');
  var a1=rgbaOf('var(--acc-f)',45),a2=rgbaOf('var(--bg2)',55);
  var soft=(a1&&a2)?('linear-gradient(180deg,'+a1+','+a2+')'):'linear-gradient(180deg,rgba(253,240,244,.45),rgba(255,252,253,.55))';
  st.setProperty('--chat-bg-layer','url('+b+')'+','+soft);
};
/* 第49单 · 朋友圈背景图 + 动态栏不透明度。照第41单聊天背景那条路走（整屏一层、cover），
   因为 `.screen--mom` 与 `.momcard` 是**父子**，照片垫在卡片下面、卡片半透明才看得见 ——
   把照片直接挂到 .momcard 上是看不见自己的背景的。
   ⚠️ 语义：momOp **100 = 完全透明**（与顶栏/底栏一致），所以 alpha = 1 - momOp/100。
   没照片时两个变量都不写：--mom-bg-layer 缺席 → background-image:none；--mom-fb 缺席 →
   .momcard 回落 var(--card)。所以「没加背景图」这一档与改动前逐像素一致。
   照片垫的第二层用半透明柔光（同聊天背景的手法），否则深色照片上的深色文字会糊。 */
window.paintMomBg=function(){
  var st=document.documentElement.style;
  var b=S.settings.momBg;
  /* ⚠️ 无照片这一支要摘**三个**变量（含 --mom-halo）—— 漏摘光晕的话，
     清除背景后名字还带着一圈柔光底，成了「没照片却有光晕」的第四种状态
     （实测夹具 F10 抓到的就是这条）。 */
  if(!b){
    st.removeProperty('--mom-bg-layer');st.removeProperty('--mom-fb');st.removeProperty('--mom-halo');
    return;
  }
  var a1=rgbaOf('var(--acc-f)',45),a2=rgbaOf('var(--bg2)',55);
  var soft=(a1&&a2)?('linear-gradient(180deg,'+a1+','+a2+')'):'linear-gradient(180deg,rgba(253,240,244,.45),rgba(255,252,253,.55))';
  st.setProperty('--mom-bg-layer','url('+b+')'+','+soft);
  var fb=rgbaOf('var(--card)',100-(S.settings.momOp||0));
  if(fb){
    st.setProperty('--mom-fb',fb);
    /* 半透明到一定程度才给文字加柔光底：卡片越透、底下照片越主导，描边越必要；
       不然 90%/100% 两档名字会被亮处吃掉。阈值取 alpha<=.7 —— 0.7 以下背景影响已经过半。
       ⚠️ 这层糊边不是装饰，是可读性兜底：实测 100% 档卡片压着亮处（月亮/高光）时，
       「梦角」和页脚「只你们两个人看得见」都会糊成一片 —— 所以光晕要覆盖 .about（页脚）
       与 .momop（操作条）这些**卡片外**的文字，它们同样贴在照片上、同样没有卡片底色护着。 */
    var al=100-(S.settings.momOp||0);
    st.setProperty('--mom-halo',(al<=70)?'0 1px 3px '+a1+',0 0 10px '+a1:'0 0 transparent');
  }else{
    st.removeProperty('--mom-fb');st.removeProperty('--mom-halo');
  }
};
/* ---------- 置顶消息（第28单） ---------- */
/* 顶部栏正下方那一条：图钉 + 「谁：摘要」 + 右侧「移除」。
   摘要走 pinBrief()（按消息类型给方括号标签），只存一个消息 id、摘要每次现算 ——
   所以存档里不会留一份会过期的文本副本。
   ⚠️ 置顶/取消时**只重绘这一条**，绝不整页重绘：整页重绘会把聊天滚动位置丢掉。 */
/* 横幅占掉一条高度，.thread 的视口就矮一截（实测 46 + 9 外边距 = 55px）。
   处理口径只有一条：**改动前如果已经在底部，改动后重新贴到底部**；否则一个像素都别动。
   ⚠️ 别写成「无脑 scrollTop += 差值」——那等于每次置顶都把正在翻历史的用户往上顶 55px；
   反过来「完全不动」又会让最底部那条被新出现的横幅切掉一截。 */
function threadAtBottom(th){
  if(!th)return false;
  return (th.scrollHeight-th.scrollTop-th.clientHeight)<10;
}
window.renderPin=function(){
  var el=$('pinBar');if(!el)return;
  var m=(S.pin&&S.pin.id)?window.pinMsg(S.pin.id):null;
  var th=$('threadEl');
  var stick=threadAtBottom(th);            /* 必须在改 DOM 之前量 */
  if(!m){el.className='pinbar';el.innerHTML='';}
  else{
    var who=window.pinWho(m);
    el.className='pinbar is-on';
    el.innerHTML=
      '<button class="pinbar__main" data-act="pin-jump" aria-label="跳到这条置顶消息">'+
        '<span class="pinbar__ic">'+ico('pin')+'</span>'+
        '<span class="pinbar__tx">'+(who?('<b>'+esc(who)+'</b>：'):'')+esc(window.pinBrief(m))+'</span>'+
      '</button>'+
      '<button class="pinbar__x" data-act="pin-off" aria-label="移除置顶">移除</button>';
  }
  if(stick)th.scrollTop=th.scrollHeight;
};
/* 按 id 找那一行。⚠️ 用**遍历比较**而不是拼 CSS 选择器 ——
   导入的备份里 id 可能是任意字符串，拼进选择器会被引号 / 反斜杠打爆（本站 uid 恰好安全，别赌）。 */
function pinRow(id){
  var all=document.querySelectorAll('#threadEl [data-id]');
  for(var i=0;i<all.length;i++){if(all[i].getAttribute('data-id')===id)return all[i];}
  return null;
}
window.pinJump=function(){
  var m=(S.pin&&S.pin.id)?window.pinMsg(S.pin.id):null;
  if(!m){window.pinSync();window.renderPin();toast('这条消息已经不在了');return;}
  var row=pinRow(m.id);
  if(!row){toast('这条消息还没渲染出来');return;}
  try{row.scrollIntoView({block:'center'});}catch(e){try{row.scrollIntoView();}catch(e2){}}
  row.classList.add('pinflash');
  setTimeout(function(){row.classList.remove('pinflash');},1400);
};
/* ---------- 第59单 · 聊天记录搜索（关键词 + 日期）----------
   ⚠️ 日期键一律走 pad2（'2026-10-07'）：本项目在定宽键上踩过「补零空串 + 数字」的坑 ——
      `(m<10?'0':'')+(m+1)` 在十月会拼出 "010"，键与别处口径对不上就会当场被当非法值丢掉。 */
function dayKey(ts){
  var d=new Date(ts);
  return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
}
window.chatDayKey=dayKey;
window.chatDaysIndex=function(){
  var idx={};
  (S.msgs||[]).forEach(function(m){var k=dayKey(m.ts);idx[k]=(idx[k]||0)+1;});
  return idx;
};
/* 命中片段：关键词两端各留 18 个字，命中那一段包 <b> 高亮。 */
function hitSnippet(txt,q){
  var i=String(txt).toLowerCase().indexOf(String(q).toLowerCase());
  if(i<0)return esc(String(txt).slice(0,60));
  var a=Math.max(0,i-18),b=Math.min(txt.length,i+q.length+18);
  return (a>0?'…':'')+esc(txt.slice(a,i))+'<b>'+esc(txt.slice(i,i+q.length))+'</b>'+
    esc(txt.slice(i+q.length,b))+(b<txt.length?'…':'');
}
/* 不区分大小写；只搜**有文字**的消息（纯贴纸/视频没有可搜的文本）。最近的排在前面，最多 200 条。 */
window.chatSearchHits=function(q){
  q=String(q==null?'':q).trim();
  if(!q)return [];
  var out=[],low=q.toLowerCase();
  (S.msgs||[]).forEach(function(m){
    var t=String(m.text==null?'':m.text);
    if(!t||t.toLowerCase().indexOf(low)<0)return;
    out.push({id:m.id,from:m.from,ts:m.ts,snippet:hitSnippet(t,q)});
  });
  return out.slice(-200).reverse();
};
window.chatHitsHTML=function(q){
  q=String(q==null?'':q).trim();
  if(!q)return '<div class="cal__sub">输入关键词搜索聊天记录（不区分大小写）。</div>';
  var hits=window.chatSearchHits(q);
  if(!hits.length)return '<div class="cal__sub">没有找到含「'+esc(q)+'」的消息。</div>';
  return '<div class="cal__sub">找到 '+hits.length+' 条 · 点一条跳过去</div>'+
    hits.map(function(h){
      return '<button class="shit" data-act="chat-hit" data-id="'+esc(h.id)+'">'+
        '<span class="shit__who">'+esc(h.from==='self'?window.MY_NAME():TA_NAME())+'</span>'+
        '<span class="shit__tx">'+h.snippet+'</span>'+
        '<span class="shit__tm">'+fmtFull(h.ts)+'</span></button>';
    }).join('');
};
/* 日历（复用经期那套 .pcal 样式，视觉一致、不另造一套）：
   聊过天的日期加 .is-has（加粗 + 颜色更深），没聊过的置灰且不可点。 */
window.chatCalHTML=function(ym){
  var now=new Date(),y,m;
  if(/^\d{4}-\d{2}$/.test(String(ym||''))){y=+ym.slice(0,4);m=+ym.slice(5,7);}
  else{y=now.getFullYear();m=now.getMonth()+1;}
  var idx=window.chatDaysIndex();
  var lead=new Date(y,m-1,1).getDay();          /* 周日开头，与 .pcal__wk 的表头一致 */
  var days=new Date(y,m,0).getDate();
  var cells='',i;
  for(i=0;i<lead;i++)cells+='<button class="pcal__d is-blank" disabled></button>';
  for(i=1;i<=days;i++){
    var k=y+'-'+p2(m)+'-'+p2(i),has=idx[k]||0;
    var cls='pcal__d'+(has?' is-has':'')+
      ((y===now.getFullYear()&&m===now.getMonth()+1&&i===now.getDate())?' is-today':'');
    cells+='<button class="'+cls+'" data-act="chat-cal-day" data-day="'+k+'"'+(has?'':' disabled')+
      ' aria-label="'+k+(has?('，'+has+' 条消息'):'，没有聊天')+'">'+i+'</button>';
  }
  return '<div class="pcal" id="chatCal">'+
    '<div class="pcal__hd">'+
      '<button class="pcal__nav" data-act="chat-cal-mv" data-d="-1" aria-label="上个月">‹</button>'+
      '<span class="pcal__ym" id="chatCalYm">'+y+' 年 '+m+' 月</span>'+
      '<button class="pcal__nav" data-act="chat-cal-mv" data-d="1" aria-label="下个月">›</button>'+
    '</div>'+
    '<div class="pcal__wk"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>'+
    '<div class="pcal__grid">'+cells+'</div>'+
    '<div class="cal__sub" style="margin:10px 0 0">加粗的日期聊过天 · 点一天跳到当天的记录</div>'+
  '</div>';
};
/* 弹层正文分两块：上半是模式切换，下半（#chatSearchBody）随模式/月份/关键词单独重画 ——
   这样打字时不会把输入框连同光标一起重建（与自定义 CSS 那条纪律一样）。 */
window.chatSearchBodyHTML=function(){
  var mode=RT.chatSmode||'kw';
  if(mode==='date')return '<div id="chatCalBox">'+window.chatCalHTML(RT.chatYm)+'</div>';
  var q=String(RT.chatQ||'');
  return '<div class="field"><span class="field__lb">搜索聊天记录</span>'+
    '<input id="chatQ" data-inp="chatQ" maxlength="40" value="'+esc(q)+'" placeholder="输入关键词…" spellcheck="false" autocapitalize="off"></div>'+
    '<div id="chatHits">'+window.chatHitsHTML(q)+'</div>';
};
window.chatSearchSheetHTML=function(){
  var mode=RT.chatSmode||'kw';
  return '<div class="chips">'+
    '<button class="chip'+(mode==='kw'?' on':'')+'" data-act="chat-mode" data-m="kw">关键词</button>'+
    '<button class="chip'+(mode==='date'?' on':'')+'" data-act="chat-mode" data-m="date">按日期</button>'+
  '</div>'+
  '<div id="chatSearchBody">'+window.chatSearchBodyHTML()+'</div>';
};
/* 跳到某条消息：滚动到视口中间 + 闪一下（复用置顶那条的 .pinflash 动效，不另造反馈）。 */
window.jumpToMsg=function(id){
  var row=pinRow(id);
  if(!row)return false;
  closeSheet();
  try{row.scrollIntoView({block:'center'});}catch(e){try{row.scrollIntoView();}catch(e2){}}
  row.classList.add('pinflash');
  setTimeout(function(){row.classList.remove('pinflash');},1400);
  return true;
};
/* 跳到某一天的第一条：日历点一天走这里。 */
window.chatDayJump=function(day){
  var list=(S.msgs||[]).filter(function(m){return dayKey(m.ts)===day;});
  if(!list.length){toast('这一天没有聊天记录');return false;}
  if(!window.jumpToMsg(list[0].id))return false;
  toast(String(day).slice(5).replace('-','/')+' 聊了 '+list.length+' 条');
  return true;
};
/* ---------- 第60单 · 消息引用 / 删除 / 多选（工单第16条 + 用户补充）----------
   ① 气泡里的**引用块**：灰底 + 左竖线 + 小字「引用{名字}的消息」+ 原文快照（在正文**上方**）；
      点它跳回被引原消息并高亮（复用第59单的 jumpToMsg）。
   ② 输入条上方的**待引用条**：显示引用对象 + 原文 + ✕；发出去就清空。
   ③ 点消息 → **在消息上方**弹一块磨砂浮窗（置顶 / 引用 / 多选 / 删除 / 复制）。
   ④ 多选模式：逐条勾选 + 底部「已选 N 条 / 删除 / 取消」。 */
window.bubQuoteHTML=function(m){
  if(!m||!m.quote)return '';
  var who=(m.qside==='self')?window.MY_NAME():TA_NAME();
  /* 第110单 · 气泡里的引用块**只留引用的文字**：去掉上方那行「引用{名字}的消息」。
     位置（正文上方）+ 点它跳回原消息 + 灰底左竖线，已经足够表达"这是引用"；
     表情/图片类引用由 quoteDisp 给占位标签，所以不会变成空块。（输入条上方那条待引用条保留标签：
     它标的是"你正要引用哪一条"，去掉会看不出引用对象。） */
  return '<span class="bub__q"'+(m.qid?(' data-act="q-jump" data-qid="'+esc(m.qid)+'" role="button" tabindex="0" aria-label="跳到原消息"') : '')+'>'+
    '<span class="bub__q-t">'+esc(window.quoteDisp(m.quote))+'</span></span>';
};
window.renderQbar=function(){
  var qb=$('qbar');if(!qb)return;
  var q=RT.quote;
  if(!q||!q.label){qb.classList.remove('open');qb.innerHTML='';return;}
  var who=(q.side==='self')?window.MY_NAME():TA_NAME();
  qb.innerHTML='<span class="qbar__l">引用'+esc(who)+'的消息</span>'+
    '<span class="qbar__t">'+esc(window.quoteDisp(q.label))+'</span>'+
    '<button class="qbar__x" data-act="q-cancel" aria-label="取消引用">'+ico('x')+'</button>';
  qb.classList.add('open');
};
/* 点消息气泡能弹菜单的只有「真消息」：sys 灰条没有正文可复制，打字条根本不是消息 */
window.bubMenuEligible=function(el){
  var row=(el&&el.closest)?el.closest('.mrow[data-id],.msys[data-id]'):null;
  if(!row)return null;
  var th=$('threadEl');
  if(!th||!th.contains(row))return null;
  var m=window.pinMsg(row.getAttribute('data-id'));
  if(!m||m.from==='sys')return null;
  return {row:row,m:m};
};
/* 在**消息上方**弹磨砂浮窗；上面放不下（贴顶了）就翻到下方 —— 和样板 openBubMenu 同一套算法 */
window.openBubMenu=function(el){
  var r=window.bubMenuEligible(el);if(!r)return false;
  var menu=$('bubMenu');if(!menu)return false;
  var m=r.m,on=!!(S.pin&&S.pin.id===m.id);
  var canCopy=!!String(m.text||'').trim();
  /* 菜单项跟着这条消息的实际情况走：已置顶就显示「取消置顶」，没正文就不给「复制」 */
  menu.innerHTML=
    '<button class="bmm__it" data-act="'+(on?'msg-unpin':'msg-pin')+'" data-id="'+esc(m.id)+'">'+
      '<span class="bmm__ic">'+ico('pin')+'</span><span class="bmm__lb">'+(on?'取消置顶':'置顶')+'</span></button>'+
    '<button class="bmm__it" data-act="msg-quote" data-id="'+esc(m.id)+'">'+
      '<span class="bmm__ic">'+ico('quote')+'</span><span class="bmm__lb">引用</span></button>'+
    '<button class="bmm__it" data-act="msg-sel" data-id="'+esc(m.id)+'">'+
      '<span class="bmm__ic">'+ico('selall')+'</span><span class="bmm__lb">多选</span></button>'+
    '<button class="bmm__it bmm__it--danger" data-act="msg-del" data-id="'+esc(m.id)+'">'+
      '<span class="bmm__ic">'+ico('trash')+'</span><span class="bmm__lb">删除</span></button>'+
    /* 第61单 · 撤回只给**自己发的**那一条（对方的得等 TA 自己撤回，这也正是"双方各撤各的"） */
    (m.from==='self'?'<button class="bmm__it" data-act="msg-recall" data-id="'+esc(m.id)+'">'+
      '<span class="bmm__ic">'+ico('undo')+'</span><span class="bmm__lb">撤回</span></button>':'')+
    '<button class="bmm__it'+(canCopy?'':' is-dim')+'" data-act="msg-copy" data-id="'+esc(m.id)+'"'+(canCopy?'':' disabled')+'>'+
      '<span class="bmm__ic">'+ico('copy')+'</span><span class="bmm__lb">复制</span></button>';
  RT.bubMenu=m.id;
  menu.classList.add('open');
  /* ⚠️ 必须先 open 再量尺寸：隐藏时 offsetWidth/Height 都是 0，位置会算成贴左边 */
  var rc=r.row.getBoundingClientRect(),box=$('phone').getBoundingClientRect();
  var mw=menu.offsetWidth||200,mh=menu.offsetHeight||64;
  var x=rc.left+rc.width/2-mw/2;
  x=Math.max(box.left+8,Math.min(x,box.right-mw-8));
  var y=rc.top-mh-9;
  if(y<box.top+8)y=Math.min(rc.bottom+9,box.bottom-mh-8);
  menu.style.left=Math.round(x-box.left)+'px';
  menu.style.top=Math.round(Math.max(box.top+8,y)-box.top)+'px';
  return true;
};
window.closeBubMenu=function(){
  RT.bubMenu=null;
  var menu=$('bubMenu');
  if(menu){menu.classList.remove('open');menu.innerHTML='';}
};
/* 多选模式：整块消息流加 .selmode，选中的行加 .sel（勾号由 CSS 画） */
window.renderSelBar=function(){
  var bar=$('selBar');if(!bar)return;
  var n=(RT.sel||[]).length;
  bar.classList[RT.selMode?'add':'remove']('open');
  var cnt=$('selCnt');
  if(cnt)cnt.textContent='已选 '+n+' 条';
  var del=$('selDel');
  if(del){del.disabled=!n;del.classList[n?'':'is-off'];}
  var th=$('threadEl');
  if(th)th.classList[RT.selMode?'add':'remove']('selmode');
  if(th){
    var rows=th.querySelectorAll('.mrow[data-id],.msys[data-id]');
    for(var i=0;i<rows.length;i++){
      var on=(RT.sel||[]).indexOf(rows[i].getAttribute('data-id'))>=0;
      rows[i].classList[on?'add':'remove']('sel');
    }
  }
};
window.selToggle=function(id){
  if(!RT.selMode)return false;
  RT.sel=RT.sel||[];
  var i=RT.sel.indexOf(id);
  if(i>=0)RT.sel.splice(i,1);else RT.sel.push(id);
  window.renderSelBar();
  return true;
};
window.selEnter=function(id){
  RT.selMode=true;RT.sel=id?[id]:[];
  window.closeBubMenu();
  window.renderSelBar();
  toast('点消息勾选 · 选好后按底部「删除」');
};
window.selExit=function(){
  RT.selMode=false;RT.sel=[];
  window.renderSelBar();
};
window.selDelete=function(){
  var ids=RT.sel||[];
  if(!ids.length){toast('还没选消息');return;}
  var set={};ids.forEach(function(x){set[x]=1;});
  var before=S.msgs.length;
  S.msgs=S.msgs.filter(function(m){return !set[m.id];});
  var gone=before-S.msgs.length;
  /* 置顶的那条被删了 → 置顶一起撤掉，否则横幅会指向一条不存在的消息 */
  if(S.pin&&S.pin.id&&set[S.pin.id])S.pin=null;
  save();
  window.selExit();
  if(window.renderPin)renderPin();
  renderThread();
  toast('已删除 '+gone+' 条');
};
/* 单击气泡 / 卡片后弹出的「这条消息」菜单：置顶 · 引用 · 多选 · 删除 · 复制 */
window.msgSheet=function(id){

  var on=!!(S.pin&&S.pin.id===id);

       :'<button class="bigbtn" data-act="msg-pin" data-id="'+esc(m.id)+'">'+ico('pin')+'置顶这条消息</button>')+

    '<button class="bigbtn bigbtn--danger" data-act="msg-del" data-id="'+esc(m.id)+'" style="margin-top:10px">删除这一条</button>');

/* 第38单 · 聊天顶栏：对方在左、我在右，各带头像与名字。
   名字取自 S.contact.name / S.myName（后者由设置页 Contact 区改）。
   两边留了稳定 id，改名字时 paintChatBar() 只改文本节点，不必重绘整屏（会丢滚动位置）。
   第50单 · 名字挪到头像**正上方**、删掉「双击拍一拍」那句副标题：
     两块变成「名字在上 / 头像在下」的竖排（CSS 在 .chatduo__side），
     因此副标题那一层整块去掉，chatduo__tx / chatduo__sb 两个类连同 CSS 一起退休。
     拍一拍功能一点没动：ta 那块整个仍是 data-act=avtap 入口（双击判定在 30_act.js:1063），
     只把提示语从「看得见的副标题」换成 aria-label，无障碍描述不丢。
    第52单 · 结构不动，只给每块加「磨砂名牌」外观（CSS 在 .chatduo__side）：
      顶上不再飘着，名字永远落在自己那层 ≥90% 白上 —— 顶栏默认全透明，
      名字本来是直接压背景图的（深色/花照片上会糊）。 */
/* 第55单 · 三处改动（用户要求）：
   ① **头像在上、昵称在下**（第50单是反过来的，现在换回来）；
   ② 两块外面**不再套方框**（第52单那块磨砂名牌已在 CSS 里归零）；
   ③ 点击即改：点头像 → 当场换头像；点昵称 → 当场改名（`nm-edit`）。
   ⚠️ 可点区域从"整块"收到**各自元素**上：原先左块整块都是 avtap（双击拍一拍），
      现在昵称自己要有单击行为，再让整块吃点击就会互相抢。
   ⚠️ 拍一拍一点没丢：TA 头像仍是 avtap 入口，双击照旧拍（单击改为延迟开选择器，
      见 30_act.js 的 avtap 分支），aria-label 也把两种用法都写出来了。 */
window.MY_NAME=function(){return (S.myName&&String(S.myName).trim())||'我';};
function chatSide(who,avHTML,name,act){
  var ta=(who==='ta');
  return '<span class="chatduo__side">'+
    '<span class="chatduo__av" data-act="'+act+'" data-who="'+who+'" role="button" tabindex="0"'+

/* 第37单：面板项的按钮。id → (act, go) 的分派表；meta 给名字与图标。
   新增一项只需在 PANEL_META 加一条、这里加一个 case。 */
function panelItemHTML(id){
  var m=PANEL_META[id];if(!m)return '';
  var act='',go='',extra='';
  if(id==='call'){act='go';go='calls';}
  else if(id==='gift'){act='gift-open';}
  else if(id==='redpk'){act='rp-open';}
  else if(id==='sticker'){act='panel';extra=' data-p="emoji"';}
  else if(id==='company'){act='co-open';}
  else if(id==='video'){act='vid-send';}
  else if(id==='cards'){act='go';go='cards';}
  else if(id==='pokeMe'){act='pokeMe-open';}
  else if(id==='mail'){act='go';go='letter';}
  else if(id==='tarot'){act='go';go='tarot';}
  else return '<button class="panel__it" data-act="soon" data-id="'+id+'">'+ico(m.ic)+'<span>'+esc(m.nm)+'</span></button>';

    html='<div class="panel__grid">'+S.panel.map(panelItemHTML).join('')+'</div>';
  }else{
    html=panelStkHTML();                                   /* 表情面板 = 表情包（分组 tab + 网格 + 点选即发） */
  }
  p.innerHTML=html;p.classList.add('open');p.classList.toggle('panel--stk',mode==='emoji');
  var a=$('panelBtn'),b=$('stickerBtn');

     字卡   → 本页原有的搜索 / 分组 / 增删改（自带 .cardlist 滚动容器）
     拍一拍 → 两侧动作池（TA 拍我 / 我拍他），与设置页共用同一段 markup

   动一处、两处同步：设置页与弹层都改成调用这里的 pokesBodyHTML / stkLibBodyHTML，

window.renderCardList=function(){

window.fontChipsHTML=function(cur,who){

/* 第68单 · 跳到设置页的某一段（顶栏那排快捷图标用）。

window.openSetSection=function(key){
  key=String(key||'Theme');
  RT.setOpen=RT.setOpen||{};
  RT.setOpen[key]=1;
  window.go('settings');
  LATER(function(){
    var secs=document.querySelectorAll('.body-scroll > .set-sec'),i;
    for(i=0;i<secs.length;i++){
      var t=secs[i].firstElementChild;
      if(t&&String(t.textContent||'').indexOf(key)===0){
        /* ⚠️ 只能滚 .body-scroll **自己**（直接改 scrollTop），**绝不能用 scrollIntoView** ——
           它会连祖先滚动容器一起滚：实测把 #phone 也滚了 61px，整块应用上移、
           底部露出原本藏着的 #sheet（用户看到的"底下多出来一块"就是这个）。
           这里用两个 rect 的差算目标位置，不依赖 offsetParent 是谁。 */
        var sc=secs[i].parentNode;
        if(sc&&sc.classList&&sc.classList.contains('body-scroll')){
          sc.scrollTop+=(secs[i].getBoundingClientRect().top-sc.getBoundingClientRect().top)-6;
        }
        return;

};

/* 把算好的 h/s/l 回写到六个控件（跳过用户正按着的那个，免得跟手指抢） */
window.accWriteBack=function(h,s,l,skip){
  function put(id,v){var e=$(id);if(e&&e!==skip)e.value=v;}
  put('accH',Math.round(h));put('accHNum',Math.round(h));
  put('accS',Math.round(s));put('accSNum',Math.round(s));
  put('accL',Math.round(l));put('accLNum',Math.round(l));
};
/* 取色器 / HEX / 提示条 / 色块选中态 —— 全部只改 DOM 属性，不重绘 */
window.accSync=function(hex,skip){
  var pk=$('accPick');
  if(pk&&pk!==skip)pk.value=hex;
  var hx=$('accHex');
  if(hx&&hx!==skip&&String(hx.value).toLowerCase()!==hex)hx.value=hex;
  var wn=$('accWarn');
  if(wn){if(window.accWhiteOK(hex))wn.setAttribute('hidden','');else wn.removeAttribute('hidden');}
  /* 「自选」色块的圆点跟着当前色走（只改一个 background，不重绘） */
  var cs=document.querySelector('.sw[data-act="theme"][data-id="custom"] i');
  if(cs)cs.style.background='linear-gradient(135deg,'+hex+',#fff)';
  var sws=document.querySelectorAll('.sw[data-act="theme"]');
  for(var i=0;i<sws.length;i++){
    var b=sws[i],id=b.getAttribute('data-id');
    var on=(id==='custom')?(S.settings.theme==='custom'):(S.settings.theme===id);
    if(on)b.classList.add('on');else b.classList.remove('on');
  }
};
/* 三个入口的唯一汇合点：取色器 / H,S,L 滑杆 / H,S,L 数值框 / HEX 都走这里。
   ⚠️ 不管从哪个入口进来，都要把算好的 h/s/l **回写到另外六个控件**（只跳过用户正按着的那个）——
   否则从 HEX 填色时滑杆会停在旧色上，界面自己打自己的脸。
   force=true（change 提交）时才连"正按着的那个"一起回写（数值框手输 9999 → 显示 360）。 */
window.accInput=function(kind,el,force){
  var cur=window.accHex2hsl(window.accSrcHex())||[0,0,0];
  var h=cur[0],s=cur[1],l=cur[2],hex=null;
  if(kind==='accPick'||kind==='accHex'){
    hex=window.accHex(el.value);
    if(!hex){                                   /* 半截/非法输入：一个字都不动 */
      if(force&&kind==='accHex'&&el)el.value=window.accSrcHex();
      return;
    }
    var c2=window.accHex2hsl(hex);
    h=c2[0];s=c2[1];l=c2[2];
  }else{
    var ch=el.getAttribute('data-ch'),n=Math.round(+el.value);
    if(!isFinite(n))n=0;
    if(ch==='h')h=Math.max(0,Math.min(360,n));
    else if(ch==='s')s=Math.max(0,Math.min(100,n));
    else l=Math.max(0,Math.min(100,n));
    hex=window.accHsl2hex(h,s,l);
  }
  if(!hex)return;
  window.accWriteBack(h,s,l,force?null:el);
  S.settings.theme='custom';                    /* 一动自选控件就切进自选模式（预设色原样留在 THEMES） */
  S.settings.themeCustom=hex;
  window.paintTheme();
  window.accSync(hex,el);
};

/* ================= 梦角 · 交互：委托事件 / 回复引擎 / 导入导出 ================= */
(function(){
'use strict';

/* ---------- 消息写入与回复引擎 ---------- */

/* ---------- 第106单 · 梦角的作息闸门 ----------
   inRestActive(ts)：给一个时间戳（默认现在），判断是否落在"允许主动行为"的时段内。
   时段用两个整点表示（restWake 开始 / restSleep 结束，24=零点），支持跨零点（例如 22→6）。
   ⚠️ 只管**主动**行为：主动消息 / 来信 / 日记 / 朋友圈 / 碎影 / 每日一牌 / 离线补发。
      你发消息之后它的回复不算主动，不经过这里。 */
window.inRestActive=function(ts){
  if(S.settings.restOn===false)return true;                 /* 关掉作息 = 全天不限 */
  var t=(ts==null)?Date.now():+ts;
  if(!isFinite(t))t=Date.now();
  var w=Math.max(0,Math.min(24,Math.round(+S.settings.restWake||0)));
  var sl=Math.max(0,Math.min(24,Math.round(+S.settings.restSleep||0)));
  if(w===sl)return true;                                    /* 起止相同 = 全天（避免"整天一条都不发"的坑） */
  var d=new Date(t),h=d.getHours()+d.getMinutes()/60;
  if(w<sl)return h>=w&&h<sl;                                /* 常规，例如 8→24 */
  return h>=w||h<sl;                                        /* 跨零点，例如 22→6 */
};
/* ---------- 第103单 · 三库统一查重（字卡 / 拍一拍 / 表情包）----------
   ⚠️ 原来各处的查重是"完全相等"（indexOf / ===）：多打一个空格、大小写不同就能绕过去。
      这里统一成一个归一化键：去首尾空白、内部连续空白并成一个、英文小写。
      dupHas(list, s, get)：get 负责从元素里取"要比较的文本"（不传就按元素本身比，用于字符串数组）。 */
window.dupNorm=function(s){
  return String(s==null?'':s).replace(/\s+/g,' ').trim().toLowerCase();
};
window.dupHas=function(list,s,get){
  var k=window.dupNorm(s);
  if(!k)return false;
  return (list||[]).some(function(x){return window.dupNorm(get?get(x):x)===k;});
};
window.addMsg=function(m){
  m.id=m.id||uid('m');m.ts=m.ts||Date.now();
  S.msgs.push(m);
  /* 裁切上限：默认仍是 800（老行为不变），但导入过 milk 历史后 S.msgsCap 会被抬高 ——
     ⚠️ 不这么做的话，用户导入 8685 条之后**随便再发一条**，就会把 7864 条历史一刀切掉（静默丢档）。 */
  var mcap=Math.max(window.MILK_CAP_BASE||800,Math.min(50000,Math.round(+S.msgsCap||0)||800));
  if(S.msgs.length>mcap)S.msgs=S.msgs.slice(-mcap);
  save();
  if(RT.route==='chat')renderThread();
};
function taLine(){
  /* 第101单 · 回复拼接字卡：开启且有概率时拼 2~joinMax 张；库里凑不出那么多张就退回单张，绝不发空消息。
     第116单 · 拼接**不再用换行分段**，改成用随机标点连成一句：……？！，。～
     （pickLine 只接受一个固定分隔符，所以先用 \u0001 哨兵拼起来、再逐个边界换成随机标点；
       卡片正文里不会出现 \u0001。） */
  var jm=Math.max(1,Math.round(+S.settings.joinMax||3)),jn=1;
  if(S.settings.joinOn!==false&&jm>1&&Math.random()<0.6)jn=ri(2,jm);
  if(jn>1){
    var raw=pickLine(jn,'\u0001');
    if(raw){
      var SEPS=['……','？','！','，','。','～'],parts=raw.split('\u0001');
      var joined=parts.reduce(function(a,b,i){
        return i?(a+SEPS[Math.floor(Math.random()*SEPS.length)]+b):(a+b);
      });
      if(joined)return {type:'card',text:joined};
    }
  }
  return {type:'card',text:pickCard()};
}
function taReplyNow(){
  var l=taLine();
  var m={from:'other',type:l.type,text:l.text,rd:1,seen:1};
  window.taQuoteAttach(m);                  /* 第60单：按概率引用我最近一条 */
  addMsg(m);
  window.taRecallMaybe(m);                  /* 第61单：小概率说完就撤回 */
  /* 第9单：回复我 也算「TA 发消息」，照样按 stkProb 甩一张表情 */
  if(window.maybeTaSticker)maybeTaSticker(m.id);
}
/* ---------- 第60单 · 对方按概率引用（工单第16条）----------
   概率 = 设置页「引用概率」quoteProb（默认 30，0 = 关闭）。
   两条硬规矩：① 只引**我发的**、且有内容可引的那条；② **不重复引同一句** ——
   RT.lastQid 记着上一条被引的，连续两条回复不许引同一条（否则连着三条都挂着同一个引用块，很假）。 */
window.taQuoteMe=function(){
  var raw=(S.settings&&S.settings.quoteProb==null)?30:S.settings.quoteProb;
  var prob=Math.max(0,Math.min(100,Math.round(+(raw||0))));
  if(prob<=0)return null;
  if(Math.random()*100>=prob)return null;
  /* 第121单 · 工单第16条原文：**每次抽取只取「最近 8 条 ∩ 30 分钟内我的消息」**。
     原来这里是从最新往回扫、**第一个命中就返回** —— 于是永远只引最近一条（单主一眼看出不对）。
     现在：先截出「最近 8 条消息」这个窗口，再在窗口里筛出**我发的 + 可引用 + 30 分钟内**的，
     随机抽一条（"不重复引同一句"这条老规矩保留）。 */
  var msgs=S.msgs||[],now=Date.now(),win=msgs.slice(-8),pool=[];
  for(var i=0;i<win.length;i++){
    var m=win[i];
    if(!m||m.from!=='self')continue;
    if(!m.ts||(now-m.ts)>30*60*1000)continue;          /* 30 分钟窗口 */
    var q=window.quoteOf(m);
    if(!q||!q.label)continue;
    if(m.id&&m.id===RT.lastQid)continue;               /* 不重复引同一句 */
    pool.push({q:q,id:m.id});
  }
  if(!pool.length)return null;                         /* 池里没有合适的 → 这次就不引（不退回"硬引最近一条"） */
  return pool[Math.floor(Math.random()*pool.length)];
};
/* 把引用挂到 TA 将要发出的那条消息上（没抽到就原样返回） */
window.taQuoteAttach=function(m){
  var hit=window.taQuoteMe();
  if(!hit||!m)return m;
  m.quote=hit.q.label;
  m.qid=hit.id||'';
  m.qside=(hit.q.side==='self')?'self':'other';
  RT.lastQid=hit.id||'';
  return m;
};
window.afterSelfSend=function(m){
  LATER(function(){
    m.seen=1;save();
    if(RT.route==='chat')renderThread();
    if(Math.random()*100<S.settings.snubP){
      toast(TA_NAME()+' 已读，但没有回你');
      return;
    }
    RT.typing=true;
    if(RT.route==='chat')renderThread();
    LATER(function(){
      RT.typing=false;
      taReplyNow();
    },ri(1200,2600));
  },ri(900,2200));
};
window.sendText=function(text){
  text=(text||'').trim();
  if(!text)return;
  var m={from:'self',type:'text',text:text,rd:1,seen:0};
  /* 第60单 · 引用三件套随消息落库：quote 是**快照**（原消息之后被删也不影响引用块显示），
     qid 用来"跳回原消息"，qside 决定引用块里那个名字写谁。发一条就清掉待引用条。 */
  if(RT.quote&&RT.quote.label){
    m.quote=RT.quote.label;
    m.qid=RT.quote.id||'';
    m.qside=(RT.quote.side==='self')?'self':'other';
    RT.quote=null;
    window.renderQbar();
  }
  addMsg(m);
  var inp=$('chatInput');
  if(inp){inp.value='';inp.style.height='auto';}
  closePanel();
  afterSelfSend(m);
};
/* 第37单 · 「我拍他」面板：从 me 动作池里挑一条直接发进聊天（比双击头像顺手）。
   池空了就给一句提示 + 直达设置页，不让空白面板挡路。 */
window.openPokeMe=function(){

  if(!pool.length){
    openSheet('我拍他','<p style="font-size:calc(13px * var(--fk,1));color:var(--ink2);line-height:1.8;margin-bottom:16px">动作池是空的。去设置页加几条吧。</p>'+

  }
  /* 第43单 · 每条后面跟两个线描键：星标（设为/取消默认）+ 删除，行为与设置页那套一致。
     点卡片本身 = 发出这一条；两个小键只改池子，不发送。 */
  var items=pool.map(function(p,i){
    var isDef=(S.pokeMeDef&&S.pokeMeDef===p);
    return '<div class="pokegrid__row'+(isDef?' is-def':'')+'">'+
      '<button class="pokegrid__it" data-act="pokeMe-send" data-i="'+i+'" aria-label="发出：'+esc(p)+'">'+

/* ---------- 主动消息（全局唯一心跳） ---------- */
function armPm(){
  var min=S.settings.pmMin,max=Math.max(S.settings.pmMin,S.settings.pmMax);
  RT.pmNext=Date.now()+ri(min,max)*60000;
  S.pmNextAt=RT.pmNext;save();   /* 第96单 · 落盘，进站时才知道"上一次该发是什么时候" */
}
/* 第96单 · 进站补发：把离开期间错过的 TA 主动消息按**原本的时间**补进聊天流。
   ⚠️ 必须在 armPm() 之前调用 —— armPm 会把排期重排到"现在之后"，先跑才能读到上次排定的时刻。
   窗口 12 小时（用户指定）；单次上限 8 条；正文走 taLine()，与实时发送同一条路。 */
window.catchUpMissed=function(){
  if(!S.settings.pmOn)return 0;
  var now=Date.now(),WIN=12*3600*1000,CAP=8;
  var from=now-WIN;
  var t=+S.pmNextAt||0;
  if(t>now)t=0;              /* 还没到点：pm 不补 */
  if(t>0&&t<from)t=from;     /* 只补最近 12 小时 */
  var min=Math.max(1,+S.settings.pmMin||30),max=Math.max(min,+S.settings.pmMax||min);
  var plan=[],cur=t,k=0;
  /* ⚠️ 只补"严格过去"的槽：刚好到点的那个交给正常发送逻辑，否则会和 tick 重复发一条 */
  while(cur>0&&cur<=now-60000&&k<CAP){if(window.inRestActive(cur))plan.push(cur);cur+=ri(min,max)*60000;k++;}   /* 第106单 · 作息外的槽不补 */
  plan.forEach(function(ts){
    var l=taLine();
    addMsg({from:'other',type:l.type,text:l.text,rd:1,seen:0,ts:ts});   /* ts=那一刻，按时标记 */
  });
  if(RT.route!=='chat'){S.unread=Math.min(99,(+S.unread||0)+plan.length);}
  if(plan.length){S.pmNextAt=cur;save();}
  /* ---------- 第97单 · 另外三条链 ----------
     共同做法：按各自节奏铺槽 → 用**各自原本的生成函数**造出来 → 再把它的 ts 改回那一刻 → 按时间倒序重排。
     ⚠️ 绝不自己拼对象：生成函数里的字段/联动（贴纸、心情、哈希去重…）都要走原路。 */
  function slots(nextAt,stepMin,cap){
    var t=+nextAt||0;
    if(!t||t>now)return [];
    if(t<from)t=from;
    var out=[],c=t,k2=0,range=Math.max(1,stepMin);
    while(c<=now-60000&&k2<cap){if(window.inRestActive(c))out.push(c);c+=ri(range,range)*60000;k2++;}   /* 第106单 · 作息外的槽不补 */
    return out;
  }
  function backdate(list,slot){
    var it=list&&list[0];
    if(!it)return false;
    it.ts=slot;
    list.sort(function(a,b){return (+b.ts||0)-(+a.ts||0);});
    return true;
  }
  /* 主动来信 */
  var lSlots=slots(S.letterNextAt,Math.max(1,+S.settings.autoLetterMin||600),2);
  if(S.settings.autoLetterOn!==false&&lSlots.length&&window.sendIncomingLetter){
    lSlots.slice().reverse().forEach(function(ts){   /* 从早到晚造，最后整体重排 */
      var n0=S.letters.length;try{window.__miss97=window.__miss97||{};window.__miss97.letter=window.sendIncomingLetter();}catch(e){window.__miss97.letter='THROW:'+e.message;}
      if(S.letters.length>n0)backdate(S.letters,ts);
    });
    S.letterNextAt=lSlots[lSlots.length-1]+Math.max(1,+S.settings.autoLetterMin||600)*60000;
  }
  /* 朋友圈 */
  var mSlots=slots(S.momNextAt,Math.max(1,Math.round(((+S.settings.momAutoMin||180)+(+S.settings.momAutoMax||420))/2)),3);
  if(S.settings.momOn!==false&&mSlots.length&&window.maybeTaMoment){
    mSlots.slice().reverse().forEach(function(ts){
      var n0=S.moments.length;try{window.__miss97=window.__miss97||{};RT.momNext=0;window.__miss97.mom=window.maybeTaMoment();}catch(e){window.__miss97.mom='THROW:'+e.message;}
      if(S.moments.length>n0)backdate(S.moments,ts);
    });
    RT.momNext=0;S.momNextAt=mSlots[mSlots.length-1]+180*60000;
  }
  /* 碎影 */
  var sSlots=slots(S.shadowNextAt,Math.max(1,+S.settings.shadowMin||120),2);
  if(S.settings.shadowOn!==false&&sSlots.length&&window.deliverShadowFragment){
    sSlots.slice().reverse().forEach(function(ts){
      var n0=S.shadows.length;try{window.__miss97=window.__miss97||{};RT.shNext=0;window.__miss97.shadow=window.deliverShadowFragment();}catch(e){window.__miss97.shadow='THROW:'+e.message;}
      if(S.shadows.length>n0)backdate(S.shadows,ts);
    });
    RT.shNext=0;S.shadowNextAt=sSlots[sSlots.length-1]+Math.max(1,+S.settings.shadowMin||120)*60000;
  }
  return plan.length+lSlots.length+mSlots.length+sSlots.length;
};
window.tick=function(){
  /* 第106单 · 作息闸门：不在时段内 → 这一次心跳什么都不发。
     与"隐藏时不轰炸"同样的思路，把各条排期推到「现在+1 分钟」，天亮后按各自节奏自然触发 ——
     否则一整夜攒着的几条会在起床那一刻一次全砸出来。 */
  if(!window.inRestActive()){
    RT.pmNext=Math.max(RT.pmNext||0,Date.now()+60000);
    RT.letterNext=Math.max(RT.letterNext||0,Date.now()+60000);
    RT.momNext=Math.max(RT.momNext||0,Date.now()+60000);
    RT.shNext=Math.max(RT.shNext||0,Date.now()+60000);
    return;
  }
  if(document.hidden){RT.pmNext=Math.max(RT.pmNext,Date.now()+60000);return;}   /* 隐藏时不轰炸 */
  /* TA 主动来信（第5单） */
  if(S.settings.autoLetterOn){
    if(!(RT.letterNext>0))armLetter();          /* 未排程：只排程（防加载首帧补发） */
    else if(Date.now()>=RT.letterNext){armLetter();sendIncomingLetter();}
  }
  /* TA 主动写日记（第13单）：只在每晚 21:00 之后，每天最多一篇 */
  maybeTaDiary();
  /* TA 主动来电（第10单）：与主动消息共用唯一心跳，不另起定时器 */
  if(S.settings.callOn&&S.settings.callInOn){
    if(!(RT.callInNext>0))armCallIn();          /* 未排程：只排程 */
    else if(Date.now()>=RT.callInNext){armCallIn();if(!RT.call||RT.call.phase==='idle')startCall('in');}
  }
  /* TA 自动送礼（第8单）：同样挂唯一心跳，礼物库空了就不发货 */
  if(S.settings.giftOn){
    if(!(RT.giftNext>0))armGift();              /* 未排程：只排程 */
    else if(Date.now()>=RT.giftNext){armGift();if(S.giftLib&&S.giftLib.items.length)sendTaGift();}
  }
  /* 陪伴（第19单）：TA 主动邀请挂唯一心跳；进行态计时与「中途离开」检查也在心跳里收口 */
  if(S.settings.coOn){
    /* next<=0 视为「还没排过程」：只排程，不投递（防止加载首帧立刻补发邀请） */
    if(!(RT.coInviteNext>0))armCoInvite();
    else if(Date.now()>=RT.coInviteNext){
      armCoInvite();
      if(!RT.co.live&&!RT.coInvite&&Math.random()*100<S.settings.coInviteP)taInviteCo();
    }
  }
  if(RT.co.live)coTick();
  /* 朋友圈（第4单）：TA 自动发圈挂唯一心跳，冷却与单日上限在 maybeTaMoment 里收口 */
  maybeTaMoment();
  /* 塔罗（第17单）：每日一牌挂唯一心跳，每天 ≤1 由 tarotDailyDone() 收口 */
  maybeTaTarot();
  /* 碎影（第23单）：梦角主动截一段共同记忆，挂同一心跳（不发系统通知，走站内未读） */
  maybeShadow();
  /* 生理期（第20单）：关怀定时与预测预警挂同一心跳 */
  maybePeriodCare();maybePeriodWarn();
  /* TA 主动发红包（第7单）：同样挂唯一心跳，余额／单日上限都在 sendTaRp 里收口 */
  if(S.settings.rpOn){
    if(!(RT.rpNext>0))armRp();                  /* 未排程：只排程 */
    else if(Date.now()>=RT.rpNext){armRp();sendTaRp();}
  }
  if(!S.settings.pmOn)return;
  if(Date.now()<RT.pmNext)return;
  var l=taLine();
  var pmMsg={from:'other',type:l.type,text:l.text,rd:1,seen:0};
  addMsg(pmMsg);
  if(RT.route!=='chat'){
    S.unread=Math.min(99,S.unread+1);save();
    toast(TA_NAME()+' 找我说话啦');
    if(RT.route==='more')renderMore();
    paintTab();
  }else{
    /* 正在聊天页：稍后自动标已读 */
    var last=pmMsg;
    LATER(function(){last.seen=1;save();if(RT.route==='chat')renderThread();},ri(3000,8000));
  }
  armPm();
  if(window.maybeTaSticker)maybeTaSticker(pmMsg.id);
};

/* ---------- 碎影（第23单）：抽取 / 组装 / 保存 / 投递 ----------
   触发挂唯一心跳（工单 E 节：不另起调度器）。deliver 成功后返回记录 id。 */
window.shadowReady=function(){
  /* 资格判断（工单 A.2）：只在确有可截的聊天记录时才动，不生成空卡 */
  if(!Array.isArray(S.msgs))return false;
  var n=S.msgs.filter(function(m){return m&&m.type!=='shadow'&&m.type!=='sys';}).length;
  return n>=4;
};
window.shadowArm=function(){
  /* 间隔读设置（分钟）：默认 240~720；用户可调。区间倒挂/缺字段都兜住，绝不落 NaN */
  var lo=Math.max(1,Math.round(+S.settings.shadowMin)||240);
  var hi=Math.max(1,Math.round(+S.settings.shadowMax)||720);
  if(hi<lo)hi=lo;
  RT.shNext=Date.now()+ri(lo,hi)*60000;
  S.shadowNextAt=RT.shNext;save();   /* 第97单 · 落盘 */      /* 无每日上限，工单 B 末条 */
};
/* 主流程：抽片段 → 去重 → 组装 → 落档 → 投 shadow 卡到聊天流 → 未读角标 */
window.deliverShadowFragment=function(){
  if(!window.shadowReady())return {skipped:true,reason:'no-msgs'};
  var seg=window.shadowPickSegment(S.msgs);
  if(!seg)return {skipped:true,reason:'no-segment'};
  var seen=window.shadowHashes(S.shadows);
  if(seen[seg.hash])return {skipped:true,reason:'dup'};   /* 同源不重复（工单 B） */
  var rec={
    id:uid('sh'),
    ts:Date.now(),
    hash:seg.hash,
    excerpt:seg.items,
    cards:window.shadowPickCards(),
    mood:window.SHADOW_MOODS[Math.floor(Math.random()*window.SHADOW_MOODS.length)],
    fav:true,                                  /* 默认自动收藏（工单 C.1） */
    msgId:''
  };
  var m={from:'sys',type:'shadow',text:'',sh:rec.id,ts:rec.ts};
  m.id=uid('m');rec.msgId=m.id;
  S.shadows.unshift(rec);
  S.shadows=window.normShadows(S.shadows);     /* 顺手归一并裁上限 */
  addMsg(m);                                   /* addMsg 内含 save + 聊天页重绘 */
  if(RT.route!=='chat'){
    S.unread=Math.min(99,S.unread+1);
    if(RT.route==='more'&&window.renderMore)renderMore();
    if(RT.route==='shadow'&&window.renderShadow)renderShadow();
    paintTab();
  }
  save();
  toast(TA_NAME()+' 留下一张碎影');
  return {id:rec.id,hash:rec.hash,messageId:m.id};
};
/* 心跳判定：开关 + 到点 + 有料可截（工单 E 节 check 只做资格判断，不提前写档） */
window.maybeShadow=function(){
  if(S.settings.shadowOn===false)return false;
  if(Date.now()<RT.shNext)return false;
  window.shadowArm();                          /* 无论成不成，先排下一次，避免每次都撞同一条件 */
  if(!window.shadowReady())return false;
  var r=window.deliverShadowFragment();
  if(r&&r.skipped&&r.reason==='dup')return false;   /* 全重复：跳过不报错（工单 B） */
  return !!(r&&r.id);
};
window.shadowFind=function(id){
  var hit=null;
  (S.shadows||[]).forEach(function(x){if(x.id===id)hit=x;});

window.shadowFav=function(id){

window.shadowDel=function(id){

  S.shadows=(S.shadows||[]).filter(function(x){if(x.id===id){n++;return false;}return true;});

};
window.shadowSearch=function(q){

/* ---------- 导入：milk 兼容 + 本站格式（按工单表踩坑经验） ---------- */
function parseMaybe(v){
  if(typeof v==='string'){
    try{var p=JSON.parse(v);return p;}catch(e){return v;}
  }
  return v;
}
function collectMilk(root){
  var replies=[],groups=[],pokes=[],pokeGroups=[];
  var seen=[];
  function pushUniq(arr,v){if(typeof v==='string'&&v.trim()&&arr.indexOf(v.trim())<0)arr.push(v.trim());}
  function handleKey(key,val){
    val=parseMaybe(val);
    if(/customReplyGroups$/i.test(key)){
      if(Array.isArray(val)){
        val.forEach(function(g){
          if(!g||typeof g!=='object')return;
          var items=[];
          if(Array.isArray(g.items))g.items.forEach(function(x){if(typeof x==='string'&&x.trim())items.push(x.trim());});
          groups.push({name:(typeof g.name==='string'&&g.name.trim())?g.name.trim():'未命名',
            hidden:!!g.disabled,items:items,raw:g});
        });
      }
    }else if(/customReplies$/i.test(key)){
      /* 踩坑：数组与对象两种形态都要处理，不能只处理其一 */
      if(Array.isArray(val)){val.forEach(function(x){pushUniq(replies,typeof x==='string'?x:(x&&x.text));});}
      else if(val&&typeof val==='object'){Object.keys(val).forEach(function(k){pushUniq(replies,val[k]);});}
    }else if(/customPokeGroups$/i.test(key)){
      if(Array.isArray(val)){
        val.forEach(function(g){
          if(!g||typeof g!=='object')return;
          if(Array.isArray(g.items))g.items.forEach(function(x){pushUniq(pokeGroups,typeof x==='string'?x:(x&&x.text));});
        });
      }
    }else if(/customPokes$/i.test(key)){
      if(Array.isArray(val)){val.forEach(function(x){pushUniq(pokes,typeof x==='string'?x:(x&&x.text));});}
      else if(typeof val==='string'){pushUniq(pokes,val);}
    }
  }
  function walk(node,depth){
    if(depth>8||!node||typeof node!=='object')return;
    if(seen.indexOf(node)>=0)return;seen.push(node);
    if(Array.isArray(node)){node.forEach(function(x){walk(x,depth+1);});return;}
    Object.keys(node).forEach(function(k){
      var v=node[k];
      if(/custom(Replies|ReplyGroups|Pokes|PokeGroups)/i.test(k)){handleKey(k,v);return;}
      walk(v,depth+1);
    });
  }
  walk(root,0);
  /* 踩坑：customReplies 是全量扁平表，分组 items 是其子集——按 Set 去重防双计 */
  var groupedSet={};
  groups.forEach(function(g){g.items.forEach(function(t){groupedSet[t]=1;});});
  var flatOnly=replies.filter(function(t){return !groupedSet[t];});
  return {groups:groups,flatOnly:flatOnly,pokes:pokes.concat(pokeGroups)};
}
/* ---------- milk 聊天记录导入（第31单）----------
   实测的真实导出形态（用户给的一份真档）：
     {version:'3.1', appName:'ChatApp', exportModules:['messages'], messages:[…]}
   单条：{id, sender, text, timestamp(ISO), status, favorited, note, replyTo, type}
     · sender：'user'=我；**对方昵称原文**（不是 'partner'）；'system'=系统；
       ⚠️ 实测 121 条 type='system' 的消息**根本没有 sender 字段**，判系统消息不能只看 sender。
     · type：normal 8562 / system 121 / call-event 2 / 其它
   映射规则（宁可降级也不断档）：
     user→from 'self'；系统类（sender/type 命中 system）→from 'sys' + type 'sys'（居中系统行，原文保留）；
     其余→from 'other'；normal 与未知类型→type 'text'（有字就留）；
     带 image → 正文后追「［图片］」，**绝不把 dataURL 写进档**（localStorage 只有一个键，配额很紧）；
     ISO→ms；坏时间戳沿用上一条的时间（不丢、不跳序）；空文本且无其它内容→跳过。
   幂等：消息 id 用 'mk'+milk 原 id（milk id 是唯一数字）→ 同一份文件重复导入天然零新增。
   预览确认制：先算账给出条数/跨度/新增/跳过，用户点了才写库。 */
window.MILK_ID_PREFIX='mk';
window.MILK_CAP_BASE=800;                 /* 站内原有的聊天记录上限，见 pushMsg */
window.MILK_CAP_HEADROOM=500;             /* 导入后额外留的余量：不然用户一开聊，每发一条就顶掉一条最老的导入记录 */
window.MILK_WARN_CHARS=4*1024*1024;       /* 档超过这个字符数就明确告警（localStorage 只有 ~5MB） */
window.milkChatDetect=function(obj){
  if(!obj||typeof obj!=='object')return null;
  var arr=null;
  if(Array.isArray(obj.messages))arr=obj.messages;                 /* 「仅导出消息」形态 */
  else{                                                            /* milk 完整备份（v4 JSON；或 v5 解包后的 json） */
    var lf=obj.localforage||obj.indexedDB||null;
    if(lf&&typeof lf==='object'){
      Object.keys(lf).forEach(function(k){
        if(arr)return;
        if(/chatMessages$/i.test(k)&&Array.isArray(lf[k]))arr=lf[k];
      });
    }
  }
  if(!arr||!arr.length)return null;
  var looks=false;
  for(var i=0;i<arr.length&&i<20;i++){
    var x=arr[i];
    if(x&&typeof x==='object'&&('sender' in x||'text' in x||'type' in x)){looks=true;break;}
  }
  return looks?arr:null;
};
window.milkChatPlan=function(obj){
  var arr=window.milkChatDetect(obj);
  if(!arr)return null;
  var have={},prevTs=0;
  S.msgs.forEach(function(m){have[m.id]=1;});
  var list=[],skipEmpty=0,degrade={quote:0,image:0,typeText:0,tsFixed:0},seenId={};
  for(var i=0;i<arr.length;i++){
    var m=arr[i];
    if(!m||typeof m!=='object'){skipEmpty++;continue;}
    var type=typeof m.type==='string'?m.type:'normal';
    var sys=(type==='system')||(m.sender==='system');
    var t=(typeof m.text==='string'?m.text:'').replace(/\s+$/,'').replace(/^\s+/,'');
    if(m.image){degrade.image++;t=t?(t+'［图片］'):'［图片］';}
    if(!t){skipEmpty++;continue;}                    /* 没内容就不入库 */
    if(m.replyTo)degrade.quote++;
    if(type!=='normal'&&type!=='system'&&type!=='call-event')degrade.typeText++;
    var ts=Date.parse(m.timestamp);
    if(!isFinite(ts)||ts<=0){ts=prevTs||0;degrade.tsFixed++;}
    if(ts<=0)ts=Date.now();
    prevTs=ts;
    var id=(m.id==null||m.id==='')?(window.MILK_ID_PREFIX+'x'+ts+'_'+i):(window.MILK_ID_PREFIX+m.id);
    /* ⚠️ 撞车后缀只能看**本文件内**是否重复，绝不能把"库里已有"算进来：
       否则第二次规划会把 mk1001 改写成 mk1001_，去重直接失效（实测踩过）。
       只依赖文件自身 → 同一份文件每次规划出的 id 完全一致 → 幂等才成立。 */
    while(seenId[id]){id=id+'_';}
    seenId[id]=1;
    list.push({id:id,from:(m.sender==='user')?'self':(sys?'sys':'other'),
      type:sys?'sys':'text',text:t.slice(0,2000),ts:ts,rd:1,seen:1});
  }
  list.sort(function(a,b){return a.ts-b.ts;});
  var newCount=0;
  list.forEach(function(x){if(!have[x.id])newCount++;});
  return {list:list,total:arr.length,newCount:newCount,dupCount:list.length-newCount,skipEmpty:skipEmpty,
    degrade:degrade,minTs:list.length?list[0].ts:0,maxTs:list.length?list[list.length-1].ts:0,
    estBytes:JSON.stringify(list).length};
};
/* 入库：合并 + 按时间升序 + 抬高裁切上限 + **读回验真**（save() 会静默吞掉配额异常） */
window.milkChatApply=function(plan){
  if(!plan||!plan.list||!plan.list.length)return {added:0,msgsLen:S.msgs.length,storeChars:0,storedOk:false};
  var have={},added=0;
  S.msgs.forEach(function(m){have[m.id]=1;});
  plan.list.forEach(function(m){if(!have[m.id]){S.msgs.push(m);have[m.id]=1;added++;}});
  S.msgs.sort(function(a,b){return a.ts-b.ts;});
  S.msgsCap=Math.max(window.MILK_CAP_BASE,+S.msgsCap||0,S.msgs.length+(window.MILK_CAP_HEADROOM||0));
  save();
  var raw='',storedOk=false;
  try{raw=localStorage.getItem(KEY)||'';}catch(e){}
  if(raw&&plan.list.length){
    storedOk=raw.indexOf('"'+plan.list[0].id+'"')>=0&&raw.indexOf('"'+plan.list[plan.list.length-1].id+'"')>=0;
  }
  return {added:added,msgsLen:S.msgs.length,storeChars:raw.length,storedOk:storedOk};
};

/* 把 milk 收集结果入库，返回新增计数 */
function mergeMilk(res){
  var addedCards=0,addedGroups=0,addedPokes=0;
  var byName={};
  S.lib.groups.forEach(function(g){byName[g.name]=g;});
  res.groups.forEach(function(g){
    var tgt=byName[g.name];
    if(!tgt){tgt={id:uid('g'),name:g.name,scope:'public',hidden:!!g.hidden,items:[]};S.lib.groups.push(tgt);byName[g.name]=tgt;addedGroups++;}
    g.items.forEach(function(t){
      var dup=tgt.items.some(function(c){return c.text===t;});
      if(!dup){tgt.items.push({id:uid('c'),text:t});addedCards++;}
    });
  });
  var defG=byName['默认']||S.lib.groups[0];
  res.flatOnly.forEach(function(t){
    var dup=false;
    for(var i=0;i<S.lib.groups.length;i++){if(S.lib.groups[i].items.some(function(c){return c.text===t;})){dup=true;break;}}
    if(!dup){defG.items.push({id:uid('c'),text:t});addedCards++;}
  });
  res.pokes.forEach(function(p){
    if(S.pokes.indexOf(p)<0){S.pokes.push(p);addedPokes++;}
  });
  save();
  return {cards:addedCards,groups:addedGroups,pokes:addedPokes};
}

    var ns=normS(obj.S);S.contact=ns.contact;S.myName=ns.myName;S.myAv=ns.myAv;
    S.msgs=ns.msgs;S.msgsCap=ns.msgsCap;S.vids=ns.vids;S.pin=ns.pin;S.lib=ns.lib;S.pokes=ns.pokes;S.pokesMe=ns.pokesMe;S.pokeMeDef=ns.pokeMeDef;S.panel=ns.panel;S.moreOrder=ns.moreOrder;S.unread=ns.unread;S.anniv=ns.anniv;
    S.calls=ns.calls;S.letters=ns.letters;S.diary=ns.diary;S.gifts=ns.gifts;S.giftLib=ns.giftLib;S.stkLib=ns.stkLib;S.rps=ns.rps;S.wallet=ns.wallet;
    S.coScenes=ns.coScenes;S.coLines=ns.coLines;S.coSessions=ns.coSessions;S.coLog=ns.coLog;
    S.moments=ns.moments;S.momSeenLast=ns.momSeenLast;
    S.tarot=ns.tarot;S.tarotDaily=ns.tarotDaily;S.ai=ns.ai;
    S.periods=ns.periods;S.periodLog=ns.periodLog;S.periodCaredFor=ns.periodCaredFor;S.periodCareAt=ns.periodCareAt||0;S.periodWarnedFor=ns.periodWarnedFor;S.linkQuiz=ns.linkQuiz;S.shadows=ns.shadows;
    /* 第70单 · OSS 密钥是**本机凭证**，备份里没有它 —— 所以导入时不能让它被空值覆盖
       （否则"导入一份备份"会静默清掉你的 bucket 密钥，而且没有任何提示）。
       导入前先取本机现值，落完再放回去。 */
    S.settings=ns.settings;
    try{
      var keepKey=(window.__ossKeep&&window.__ossKeep.k)||'',keepSec=(window.__ossKeep&&window.__ossKeep.s)||'';
      if(keepKey)S.settings.ossKey=keepKey;
      if(keepSec)S.settings.ossSecret=keepSec;
    }catch(e){}
    paintTheme();window.paintBub();window.applyBubCss();save();
    /* 备份里带的白噪音音频（noiseAudio）：写回 IndexedDB 再对账一次，

    if(Array.isArray(obj.noiseAudio)&&obj.noiseAudio.length){

    window.vidSync(function(){ if(RT.route==='chat')renderThread(); });

  }
  if(obj.type==='qny-cards-v1'&&Array.isArray(obj.groups)){
    var added={cards:0,groups:0,pokes:0};
    var byName={};S.lib.groups.forEach(function(g){byName[g.name]=g;});

      g.items.forEach(function(c){

/* 是否跑在打包后的原生壳里：无打包器的静态站点 `Capacitor.Plugins` **恒为空**
   （native-bridge.js 只读不填）→ 只能认桥底层 `nativePromise`。 */
function inAppShell(){
  var C=window.Capacitor;
  return !!(C&&typeof C.nativePromise==='function'&&
            (typeof C.isNativePlatform!=='function'||C.isNativePlatform()));
}
window.inAppShell=inAppShell;
window.downloadJson=function(filename,data,doneMsg){
  var json=JSON.stringify(data,null,2);
  try{
    var Cap=window.Capacitor;
    /* 壳里的正路：Filesystem 写缓存目录拿 file:// URI → Share 分享出去。
       `<a download>` 会被安卓 WebView **静默忽略**（点了没反应、零报错），不能用它兜底。 */
    if(inAppShell()){
      Cap.nativePromise('Filesystem','writeFile',
          {path:filename,data:json,directory:'CACHE',encoding:'utf8',recursive:true})
        .then(function(res){
          var uri=(res&&(res.uri||res.path))||'';
          return Cap.nativePromise('Share','share',
            {title:filename,text:'数据备份',url:uri,dialogTitle:'导出数据'});
        })
        .then(function(){toast(doneMsg);})
        .catch(function(err){
          if(err&&/Abort/i.test(err.message||''))return;   /* 用户自己取消，别吵 */
          toast('导出失败：'+((err&&err.message)||'未知错误'));
        });
      return;
    }
    /* 浏览器里：优先系统分享面板（安卓 Chrome 支持带文件分享），否则走下载。 */
    var blob=new Blob([json],{type:'application/json'});
    if(window.navigator&&navigator.share&&navigator.canShare){
      var file=new File([blob],filename,{type:'application/json'});
      if(navigator.canShare({files:[file]})){
        navigator.share({title:filename,files:[file]}).then(function(){toast(doneMsg);}).catch(function(){toast(doneMsg);});
        return;
      }
    }
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download=filename;
    document.body.appendChild(a);a.click();
    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},400);
    toast(doneMsg);
  }catch(e){toast('导出失败了，请重试');}
};

/* ---------- 文件选择 ---------- */
function pickFile(accept,cb){
  var i=document.createElement('input');
  i.type='file';i.accept=accept;
  i.addEventListener('change',function(){
    var f=i.files&&i.files[0];
    if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){cb(String(rd.result),f);};
    rd.onerror=function(){toast('文件读取失败，请重试');};
    if(accept==='application/json'||/json/.test(f.type)||/\.json$/i.test(f.name))rd.readAsText(f);
    else rd.readAsDataURL(f);
  });
  document.body.appendChild(i);i.click();
  setTimeout(function(){document.body.removeChild(i);},600);
}
/* 图片压缩为方图 dataURL（drawImage 源矩形用原图坐标，工单表第 18 条） */
window.cropSquareDataUrl=function(img,maxSize,quality){
  var s=Math.min(img.width,img.height);
  var sx=Math.round((img.width-s)/2),sy=Math.round((img.height-s)/2);
  var out=Math.max(1,Math.min(maxSize||s,s));
  var cv=document.createElement('canvas');cv.width=cv.height=out;
  cv.getContext('2d').drawImage(img,sx,sy,s,s,0,0,out,out);
  return cv.toDataURL('image/jpeg',quality||0.85);
};
/* 第58单 · 挑字体文件：只要 File 本身，**不读成 dataURL** —— 字库动辄几 MB，
   读成 base64 既多占三成内存、又白费一次编解码；本体直接以 Blob 存进 IndexedDB。 */
function pickFontFile(cb){
  var i=document.createElement('input');
  i.type='file';i.accept='.ttf,.otf,.woff,.woff2,font/ttf,font/otf,font/woff,font/woff2';
  i.addEventListener('change',function(){
    var f=i.files&&i.files[0];
    if(f)cb(f);
  });
  document.body.appendChild(i);i.click();
  setTimeout(function(){document.body.removeChild(i);},600);
}
function pickImage(maxSize,cb){
  pickFile('image/*',function(dataUrl){
    var img=new Image();
    img.onload=function(){
      try{
        var local=cropSquareDataUrl(img,maxSize,0.85);
        /* 第70单 · **统一出口**：配了阿里云 OSS 就先上传，成功交给调用方的是 **URL**
           （档里只留网址，本机体积不再随图片增长）；没配或传失败 → 回落本地 base64（功能不残）。
           放在这里是因为**所有图片上传都经过 pickImage**，一处接线覆盖全部入口。 */
        if(window.storeImage)window.storeImage(local,cb);else cb(local);
      }
      catch(e){toast('图片处理失败，换一张试试');}
    };
    img.onerror=function(){toast('图片读取失败，换一张试试');};
    img.src=dataUrl;
  });
}
/* 第72单 · **背景图专用**的取图口：等比压缩、**绝不裁切**。
   ⚠️ 为什么不能复用 pickImage：它走的是 cropSquareDataUrl —— 那是给头像/表情用的**方形裁剪**。
      聊天背景与朋友圈背景都是"任意比例铺满整屏"，套方形裁剪 = 先把图裁成方的、再被
      background-size:cover 拉去铺竖屏 → 用户看到的就是「明明尺寸是对的，上传完被放大了/糊了」。
      工单第1单第15条早写死了这条：「非方形用途别套方形裁剪，背景类用 5 参 drawImage 保留比例」。
   长边封顶 2000：竖屏 1080×2400 的图不会被二次放大到糊，体积也在既有预算内（背景值上限 2MB）。 */
function pickBgImage(cb){
  pickFile('image/*',function(dataUrl){
    var img=new Image();
    img.onload=function(){
      try{
        var local=fitDataUrl(img,2000,0.85);
        if(window.storeImage)window.storeImage(local,cb);else cb(local,'');
      }catch(e){toast('图片处理失败，换一张试试');}
    };
    img.onerror=function(){toast('图片读取失败，换一张试试');};
    img.src=dataUrl;
  });
}

/* 第55单 · 点昵称**当场改名**：把那一格换成输入框，回车或点开别处落档，Esc 取消。
   ⚠️ 预填的是**显示出来的名字**（不是 S 里的原值）：用户看到「梦角」点进去却拿到空框会莫名其妙；
      S.myName 为空时显示层回落成「我」，预填「我」再原样提交也不改变观感。
   ⚠️ 规矩只有一条且与设置页那条**完全一致**：TA 清空不生效（设置页 taName 就是 if(v)），
      免得同一个名字在两个入口下的行为不一样。 */
window.inlineName=function(who){
  who=(who==='ta')?'ta':'me';
  var el=$('chatNm_'+who);
  if(!el||el.querySelector('input'))return;      /* 已经在编辑了，别叠第二个 */
  var old=el.textContent,closed=false;
  var i=document.createElement('input');
  i.className='chatduo__inp';i.type='text';i.maxLength=12;
  i.value=old;i.setAttribute('aria-label','修改昵称');
  el.textContent='';el.appendChild(i);
  function done(commit){
    if(closed)return;closed=true;                /* Enter 之后还会来一次 blur，挡掉第二次 */
    var v=i.value.replace(/^\s+|\s+$/g,'').slice(0,12);
    el.textContent=old;                          /* 先还原（输入框随之被移除） */
    if(commit){
      if(who==='ta'){if(v)S.contact.name=v;}
      else S.myName=v;
      save();                                    /* 当场落档，不走防抖：这是个"点一下就走"的动作 */
      if(RT.route==='settings'&&window.renderSettings)renderSettings();
      toast(who==='ta'?('TA 的昵称已改为「'+TA_NAME()+'」'):('我的昵称已改为「'+window.MY_NAME()+'」'));
    }
    window.paintChatBar();
  }
  i.addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();done(true);}
    else if(e.key==='Escape'){e.preventDefault();done(false);}
  });
  i.addEventListener('blur',function(){done(true);});
  i.focus();i.select();
};

    rpSpecP:100,rpPokeP:100,rpBackP:100,rpAutoMin:10080,rpDailyCap:50,
    stkProb:100,
    restWake:24,restSleep:24,                       /* 第106单 · 作息两个整点（0~24） */
    coInviteMin:10080,coInviteMax:10080,coInviteP:100,coLeaveP:100,coLeaveAfter:600,
    momAutoMin:10080,momAutoMax:10080,momDailyCap:50,momCoolMin:10080,
    momLikeP:100,momCommentP:100,momReplyP:100,
    tarotDailyHour:23,soonRemindDays:7};
  /* 碎影间隔：设置页与内部**统一「分钟」**，无需换算；只做取整 + 夹区间（1 ~ 10080 分钟 = 7 天） */
  if(k==='shadowMin'||k==='shadowMax'){
    var mine=window.shMinClamp(t.value);
    if(k==='shadowMin')S.settings.shadowMin=mine;else S.settings.shadowMax=mine;
    S.settings.shadowUnitVer=2;                            /* 用户改过 → 旧档迁移不再回头覆盖 */
    if(S.settings.shadowMax<S.settings.shadowMin)S.settings.shadowMax=S.settings.shadowMin;   /* 区间不能倒挂 */
    window.shadowArm();                                    /* 立刻按新间隔重排下一次 */
    saveDebounced();
    return;
  }
  if(callKeys[k]){
    var cn=Math.round(+t.value);
    if(cn>=0){
      S.settings[k]=Math.min(callKeys[k],cn);
      if(k==='hgSec')S.settings[k]=Math.max(5,S.settings[k]);
      if(k==='callInMin')S.settings[k]=Math.max(1,S.settings[k]);
      if(k==='giftAutoMin')S.settings[k]=Math.max(1,S.settings[k]);
      if(k==='giftBackMin')S.settings[k]=Math.max(1,S.settings[k]);
      if(k==='giftBackMax')S.settings[k]=Math.max(1,S.settings[k]);
      if(S.settings.giftBackMin>S.settings.giftBackMax){
        if(k==='giftBackMin')S.settings.giftBackMax=S.settings.giftBackMin;
        else S.settings.giftBackMin=S.settings.giftBackMax;
      }
          if(k==='rpAutoMin')S.settings[k]=Math.max(1,S.settings[k]);
      if(k==='soonRemindDays')S.settings[k]=Math.max(0,S.settings[k]);   /* 天数不许为负（normS 只在下次加载兜底） */
      if(k==='coInviteMin'||k==='coInviteMax'){
        S.settings.coInviteMin=Math.max(1,S.settings.coInviteMin);
        if(S.settings.coInviteMax<S.settings.coInviteMin)S.settings.coInviteMax=S.settings.coInviteMin;
      }
      if(k==='momAutoMin'||k==='momAutoMax'){   /* 区间不能倒挂，改一头拉另一头 */
        S.settings.momAutoMin=Math.max(1,S.settings.momAutoMin);
        if(S.settings.momAutoMax<S.settings.momAutoMin)S.settings.momAutoMax=S.settings.momAutoMin;
      }
      if(k==='rpPokeP'||k==='rpBackP'){   /* 秒拆 + 退回 之和不得超过 100，剩下的才是「不动」 */
        var rpOther=k==='rpPokeP'?'rpBackP':'rpPokeP';
        if(S.settings.rpPokeP+S.settings.rpBackP>100)S.settings[rpOther]=Math.max(0,100-S.settings[k]);
      }
      saveDebounced();
    }
    return;
  }
  var numKeys={delayMin:1,delayMax:1,snubP:1,pmMin:1,pmMax:1,quoteProb:1,recallProb:1};
  if(numKeys[k]){
    var n=Math.round(+t.value);
    if(n>0||t.value===''){
      if(n>0){
        if(k==='snubP'||k==='quoteProb'||k==='recallProb')n=Math.min(100,n);else n=Math.min(k==='pmMin'||k==='pmMax'?1440:600,n);
        S.settings[k]=n;
        if(S.settings.delayMin>S.settings.delayMax)S.settings.delayMax=S.settings.delayMin;
        if(S.settings.pmMin>S.settings.pmMax)S.settings.pmMax=S.settings.pmMin;
        saveDebounced();
      }
    }
  }
});
/* ---------- 改动提交委托（第30单）----------
   自选色四个控件松手/失焦时**立刻落档**：拖动途中走 input（防抖存，够快也不卡），
   这一枪保证"拖完就直接切页/关页"不会丢色 —— 防抖定时器在导航后就没了。
   force=true：把夹好的值也回写到用户刚松手的那个控件（数值框手输 9999 → 显示 360）。 */
document.addEventListener('change',function(e){
  var t=e.target,k=t.getAttribute&&t.getAttribute('data-inp');
  /* 纪念日柔光强度（第35单）与顶/底栏不透明度（第39单）：松手/失焦立刻落档，防"拖完直接切页"丢值 */

    save();

  }
  if(k==='barOp'||k==='compOp'){

    var tg2=document.getElementById(k==='barOp'?'barOpTag':'compOpTag');
    if(tg2)tg2.textContent=S.settings[k]+'%';

  }
  /* 第49单 · 动态栏不透明度失焦落档（同 barOp/compOp） */
  if(k==='joinMax'){                                    /* 第101单 · 最多拼接（提交） */
    var jm3=Math.max(2,Math.min(5,Math.round(+t.value||3)));
    S.settings.joinMax=jm3;
    var jt3=document.getElementById('joinMaxTag');
    if(jt3)jt3.textContent=jm3+' 句';

  /* 第105单 · 同上的收尾（提交时落库） */
  if(k==='nmSize'||k==='nmGap'){
    var isSize2=(k==='nmSize'),raw2=+t.value||0;
    var nv2=isSize2?Math.max(10,Math.min(18,Math.round(raw2*2)/2)):Math.max(4,Math.min(30,Math.round(raw2)));
    S.settings[k]=nv2;
    var stm2=document.documentElement.style;
    stm2.setProperty('--nm-size',(+S.settings.nmSize||14)+'px');
    stm2.setProperty('--nm-gap',(+S.settings.nmGap||10)+'px');
    var nmt2=document.getElementById('nmTag');
    if(nmt2)nmt2.value='字号 '+S.settings.nmSize+'px · 间距 '+S.settings.nmGap+'px';
    save();
    return;
  }
  if(k==='momOp'){
    S.settings.momOp=Math.max(0,Math.min(100,Math.round(+t.value||0)));
    window.paintMomBg();
    var mt3=document.getElementById('momOpTag');
    if(mt3)mt3.textContent=S.settings.momOp+'%';
    save();
    return;
  }
  /* 第48单 · 自定义 CSS 失焦立刻落档（防「写完直接切页」丢值），顺便按清洗后的结果落盘 */
  if(k==='bubCss'){
    S.settings.bubCss=window.sanitizeUserCss(t.value);
    window.applyBubCss();
    save();
    return;
  }
  if(k!=='accHSL'&&k!=='accHSLNum'&&k!=='accPick'&&k!=='accHex')return;
  window.accInput(k,t,true);
  save();
});

document.addEventListener('click',function(e){

  var act=el.getAttribute('data-act');

  if(goRoute){closePanel();go(goRoute);return;}
  if(!act)return;
  var gid=el.getAttribute('data-g'),cid=el.getAttribute('data-c'),sid=el.getAttribute('data-id');

  if(act==='soon'){

    return;
  }
  if(act==='panel'){openPanel(el.getAttribute('data-p'));return;}
  /* ---- 聊天视频（第24单） ---- */
  if(act==='vid-send'){closePanel();pickFileRaw('video/*',function(f){window.vidAdd(f);});return;}
  /* 第122单 · 从相册发一张图片：等比压缩（沿用 fitDataUrl，绝不裁切）→ storeImage（配了 OSS 就上云，
     否则本机 dataURL）→ 发一条 type:'img' 的消息（载荷 src/w/h 与表情条目同构）。
     发完走和文字消息同一条收尾（afterSelfSend：标记已读、按概率回我）。 */
  if(act==='img-send'){
    closePanel();
    pickFileRaw('image/*',function(f){
      if(!f)return;
      toast('正在处理图片…');
      var fr=new FileReader();
      fr.onload=function(){
        var im=new Image();
        im.onload=function(){
          var url=fitDataUrl(im,1280,0.82);
          if(!url){toast('这张图读不出来，换一张试试');return;}
          window.storeImage(url,function(su){
            var m={from:'self',type:'img',src:su,w:im.naturalWidth,h:im.naturalHeight,rd:0,seen:0};
            addMsg(m);
            if(RT.route==='chat')renderThread();
            LATER(function(){if(window.afterSelfSend)window.afterSelfSend(m);},400);
          });
        };
        im.onerror=function(){toast('这张图读不出来，换一张试试');};
        im.src=fr.result;
      };
      fr.onerror=function(){toast('读文件失败，换一张试试');};
      fr.readAsDataURL(f);
    });
    return;
  }
  if(act==='vid-open'){window.openVidPlay(el.getAttribute('data-id')||'');return;}
  if(act==='vid-close'){window.closeVidPlay();return;}
  if(act==='vid-manage'){window.vidMgrSheet();return;}

      '（'+window.nzSizeText(vd.size)+'）<br>聊天里那一条会变成「视频不在本机了」，<b>聊天记录本身不删</b>。</p>'+
      '<button class="bigbtn bigbtn--danger" data-act="vid-del-do" data-id="'+esc(vd.id)+'">确认删除</button>'+
      '<button class="bigbtn bigbtn--ghost" data-act="vid-manage">再想想</button>');
    return;
  }
  if(act==='vid-del-do'){
    if(window.vidDrop(sid)){window.vidMgrSheet();toast('已删掉这段视频');}
    else{toast('这段视频已经不在了');}
    if(RT.route==='chat')renderThread();

    var vn=(S.vids||[]).length;

      '（共 '+window.nzSizeText(window.vidBytes())+'）<br>聊天记录不删，那些条会变成「视频不在本机了」。</p>'+
      '<button class="bigbtn bigbtn--danger" data-act="vid-clear-do">确认清空</button>'+

function lkRunTest(){
  var lq=window.lkNorm();
  if(!lq.qs.length){toast('先加几道题吧');return;}
  var taRan=[],details=[],score=0,total=0;
  lq.qs.forEach(function(q){
    var r=Math.floor(Math.random()*q.opts.length);   /* 每次都全新随机，不看历史 */
    taRan.push(r);
    details.push({q:q.q,opts:q.opts.slice(),ans:q.ans,ta:r});   /* 快照：之后改题/删题，旧报告仍是当时的题面 */
    var w=q.opts.length;                             /* ★ 权重=该题选项数，不按题目数平均 */
    total+=w;
    if(r===q.ans)score+=w;
  });
  var pct=total?Math.round(score/total*100):0;
  lq.hist.push({ts:Date.now(),score:score,total:total,pct:pct,ta:taRan,
    link:lkLinkFromPct(pct),details:details,moods:lkPickMoods()});
  if(lq.hist.length>200)lq.hist=lq.hist.slice(-200);   /* 与 normLinkQuiz 上限一致 */
  save();
  RT.lkView='report';RT.lkRepIdx=lq.hist.length-1;     /* 算完直接进报告视图，不留在弹层 */
  renderLinkTest();
}
function lkAddQDo(){
  var qi=$('lkQ'),oi=$('lkOpts'),ai=$('lkAns');
  var q=((qi&&qi.value)||'').trim();
  if(!q){toast('写个题目吧');return;}                 /* 闸1：题干 trim 后为空 */
  var opts=((oi&&oi.value)||'').split(/\r?\n/).map(function(s){return s.trim();}).filter(function(s){return s;});
  if(opts.length<2){toast('至少两个选项');return;}    /* 闸2：有效选项不足 2 */
  if(opts.length>6)opts.length=6;                     /* 闸3：超过 6 个静默截断（不提示不报错） */
  var ans=parseInt((ai&&ai.value)||'',10)-1;          /* 闸4：★ 界面 1 基、存储 0 基，-1 别丢 */
  if(isNaN(ans)||ans<0||ans>=opts.length){toast('标准答案填 1~'+opts.length);return;}
  var lq=window.lkNorm();
  lq.qs.push({q:q.slice(0,40),opts:opts,ans:ans});
  save();closeSheet();renderLinkTest();toast('已添加题目');

/* 点面板/输入条以外区域收面板；切屏由 go() 统一收 */

/* 单击气泡 / 卡片 → 「这条消息」菜单（置顶 · 复制 · 删除）第28单。
   ⚠️ 必须自己再挡一次：气泡里本来就有点击元素（礼物「收下」/ 红包「拆」/ 视频缩略图），
   点到它们该由上面那条 data-act 委托处理，这里不能抢 ——
   判据 = 「从 target 到这一行之间有没有 data-act / data-go / data-inp」。 */
document.addEventListener('click',function(e){
  if(RT.route!=='chat')return;
  if(e.target.closest('[data-act],[data-go],[data-inp]'))return;
  if(e.target.closest('#sheet')||e.target.closest('.panel')||e.target.closest('.composer'))return;
  var row=e.target.closest('.mrow[data-id],.msys[data-id]');
  if(!row)return;
  var th=$('threadEl');
  if(!th||!th.contains(row))return;      /* 只在聊天流里生效 —— 别的页面有同名类就不该吃这一下 */
  var id=row.getAttribute('data-id');
  if(!id)return;
  /* 第60单 · 单击改成弹**消息上方的磨砂浮窗**（原来是整屏底部弹层）；
     多选模式下点一条 = 勾上 / 取消勾（同一个手势，两种模式各管一件事）。 */
  if(RT.selMode){window.selToggle(id);return;}
  /* 第66单 · 必须**真的点在气泡上**才弹浮窗：.mrow 是整行（气泡右边那一大片空白也属于它），
     只按行判定的话点背景也会弹，很容易误触。这里以 .bub 为准（气泡里的卡片/表情也都在 .bub 内）。
     ⚠️ 多选那条**不受这条约束** —— 多选是"点哪儿都能勾"的模式，目标越大越好用。 */
  if(!e.target.closest||!e.target.closest('.bub'))return;
  window.openBubMenu(row);
});
/* 浮窗的点外关闭：capture 阶段先跑，所以"点另一条消息"会先关旧的、再由上面那条处理器弹新的。
   ⚠️ 菜单自己的按钮要放行（`#bubMenu` 里的点击交给 data-act 委托，各自负责关菜单）——
      不然 capture 先把菜单关了，委托处理器就找不到 data-id 了。 */
document.addEventListener('click',function(e){
  if(!RT.bubMenu)return;
  if(e.target.closest&&e.target.closest('#bubMenu'))return;
  window.closeBubMenu();
},true);

/* TA 说话统一入口：不在聊天页就读作未读并刷新角标 */
window.taSay=function(text,type){
  var m={from:'other',type:type||'text',text:text,rd:1,seen:0};
  window.taQuoteAttach(m);                  /* 第60单：主动来找我说话时也会按概率引用 */
  addMsg(m);

  if(RT.route!=='chat'){
    S.unread=Math.min(99,S.unread+1);save();
    if(RT.route==='more')renderMore();
    paintTab();
  }else{
    LATER(function(){m.seen=1;save();if(RT.route==='chat')renderThread();},ri(2500,6000));
  }
  if(window.maybeTaSticker)maybeTaSticker(m.id);
};
/* TA 挑礼物：隐藏分类整类出局（候选池恰减该分类件数） */
window.pickTaGift=function(){
  var hid={};
  ((S.giftLib||{}).cats||[]).forEach(function(c){if(c.hidden)hid[c.id]=1;});
  var pool=((S.giftLib||{}).items||[]).filter(function(x){return !hid[x.cid];});
  if(!pool.length)return null;
  return pool[ri(0,pool.length-1)];
};
function giftRec(item,dir,note){
  return {id:uid('G'),dir:dir,emoji:item.emoji,name:item.name,desc:item.desc||'',
    note:(note||'').slice(0,120),ts:Date.now(),got:dir==='in'?0:1};
}
/* TA 送来一份礼物（自动送礼 / 回礼 共用） */
window.sendTaGift=function(){
  var it=pickTaGift();
  if(!it)return null;
  var rec=giftRec(it,'in',GIFT_TA_NOTES[ri(0,GIFT_TA_NOTES.length-1)]);
  S.gifts.unshift(rec);
  if(S.gifts.length>500)S.gifts=S.gifts.slice(0,500);
  addMsg({from:'other',type:'gift',gid:rec.id,text:rec.name,rd:1,seen:0});
  save();
  toast(TA_NAME()+' 送你一份礼物');
  if(RT.route==='gift'&&window.renderGift)renderGift();
  if(RT.route==='more'&&window.renderMore)renderMore();
  paintTab();
  return rec;
};
/* 概率致谢：带礼物名的定制感谢语 */
function giftThanks(rec){
  if(Math.random()*100>=S.settings.giftThanksP)return false;
  LATER(function(){
    RT.typing=true;
    if(RT.route==='chat')renderThread();
    LATER(function(){
      RT.typing=false;
      if(RT.route==='chat')renderThread();
      taSay('「'+rec.name+'」'+GIFT_THANKS[ri(0,GIFT_THANKS.length-1)]);
    },ri(1200,2400));
  },ri(800,1800));
  return true;
}
/* 概率延时回礼：随机礼物入库 */
function giftBack(rec){
  if(Math.random()*100>=S.settings.giftBackP)return false;
  var lo=Math.max(1,S.settings.giftBackMin),hi=Math.max(lo,S.settings.giftBackMax);
  LATER(function(){sendTaGift();},ri(lo,hi)*1000);
  return true;
}
window.giftReaction=function(rec){return {thanks:giftThanks(rec),back:giftBack(rec)};};
/* 收下：幂等——同一份礼物消息只能领一次（数据层先判 got） */
window.claimGift=function(id){

window.sendGift=function(){

/* ---------- 红包（第7单）引擎 ---------- */
/* 当日 TA 发来的红包条数：按流水统计而不是内存计数，刷新、重开都不丢 */
function rpTodayCount(){
  var k=dayKey(),n=0;
  (S.rps||[]).forEach(function(r){if(r.dir==='in'&&dayKey(r.ts)===k)n++;});
  return n;
}
window.rpTodayCount=rpTodayCount;
/* 抽金额：普通档在 TA 余额内随机（封顶 66），特殊档命中 52/520/1314/5200，两者都不超过余额 */
window.pickRpAmt=function(){
  var ta=Math.max(0,+S.wallet.ta||0);
  if(!(ta>0))return 0;
  if(Math.random()*100<S.settings.rpSpecP){
    var ok=RP_SPEC.filter(function(v){return v<=ta;});
    if(ok.length)return ok[ri(0,ok.length-1)];
  }
  var cap=Math.min(ta,66);
  var v=Math.round((1+Math.random()*Math.max(0,cap-1))*100)/100;
  return Math.min(ta,Math.max(0.01,v));
};
function rpRec(amt,dir,note,spec){
  return {id:uid('R'),dir:dir,amt:clampMoney(amt),note:(note||'').trim().slice(0,30),
    ts:Date.now(),status:'wait',spec:spec?1:0};
}
/* TA 发来一个红包（自动触发共用入口）；被单日上限或余额挡住时返回 null */
window.sendTaRp=function(){
  var cap=Math.max(0,Math.round(+S.settings.rpDailyCap||0));
  if(cap>0&&rpTodayCount()>=cap)return null;
  var amt=pickRpAmt();
  if(!(amt>0))return null;
  var rec=rpRec(amt,'in',RP_TA_NOTES[ri(0,RP_TA_NOTES.length-1)],RP_SPEC.indexOf(Math.round(amt*100)/100)>=0);
  S.rps.unshift(rec);if(S.rps.length>300)S.rps=S.rps.slice(0,300);
  S.wallet.ta=clampMoney(S.wallet.ta-amt);
  addMsg({from:'other',type:'rp',rid:rec.id,text:rec.note,rd:1,seen:0});
  save();
  toast(TA_NAME()+' 发来一个红包');
  if(RT.route==='redpk'&&window.renderRp)renderRp();
  if(RT.route==='more'&&window.renderMore)renderMore();
  paintTab();
  return rec;
};
/* 我发红包：先扣余额 → 上聊天流 → 触发 TA 的三选一反应 */
window.sendRp=function(){
  var amt=rpAmount();
  if(!(amt>0)){toast('先选一个金额，或者自己填一个');return false;}
  if(amt>S.wallet.me){toast('红包袋余额不够，先改小一点');return false;}   /* 余额校验：不足只拦截，不改动任何数 */
  var rec=rpRec(amt,'out',RT.rpNote,RP_SPEC.indexOf(amt)>=0);
  S.rps.unshift(rec);if(S.rps.length>300)S.rps=S.rps.slice(0,300);
  S.wallet.me=clampMoney(S.wallet.me-amt);   /* 发出后余额即时扣减 */
  addMsg({from:'self',type:'rp',rid:rec.id,text:rec.note,rd:1,seen:0});
  var m=S.msgs[S.msgs.length-1];
  save();closeSheet();
  RT.rpSel=null;RT.rpAmt=null;RT.rpNote='';
  if(RT.route==='redpk'&&window.renderRp)renderRp();
  if(RT.route==='chat'&&window.renderThread)renderThread();
  toast('¥'+fmtYuan(amt)+' 的红包已发出');
  LATER(function(){m.seen=1;save();if(RT.route==='chat')renderThread();},ri(1000,2200));
  rpReaction(rec);
  return true;
};
/* 反应落地：poked=秒拆（钱进 TA 的袋）/ backed=默默退回（钱回我的袋） */
window.rpApply=function(rec,kind){
  if(!rec||rec.dir!=='out'||rec.status!=='wait')return false;   /* 幂等：同一个红包只结算一次 */
  if(kind==='poked'){
    rec.status='opened';S.wallet.ta=clampMoney(S.wallet.ta+rec.amt);save();
    taSay(RP_TA_THANKS[ri(0,RP_TA_THANKS.length-1)]);
    toast(TA_NAME()+' 拆了你的红包');
  }else if(kind==='backed'){
    rec.status='backed';S.wallet.me=clampMoney(S.wallet.me+rec.amt);save();
    toast('红包被退回了，¥'+fmtYuan(rec.amt)+' 已回到你的红包袋');
  }else return false;
  if(RT.route==='chat'&&window.renderThread)renderThread();
  if(RT.route==='redpk'&&window.renderRp)renderRp();
  return true;
};
/* 三选一：秒拆 / 默默退回 / 不动（两概率之和的差额就是「不动」，红包一直挂着） */
function rpReaction(rec){
  var r=Math.random()*100,pk=Math.max(0,+S.settings.rpPokeP||0),bk=Math.max(0,+S.settings.rpBackP||0);
  var kind=r<pk?'poked':(r<pk+bk?'backed':'none');
  if(kind==='none')return {kind:'none',poked:false,backed:false};
  LATER(function(){rpApply(rec,kind);},kind==='poked'?ri(1200,2600):ri(2600,5200));
  return {kind:kind,poked:kind==='poked',backed:kind==='backed'};
}
window.rpReaction=rpReaction;
/* 戳一下拆红包：幂等 —— 已拆／已退回的再戳不入账 */
window.rpPoke=function(id){
  var r=findRp(id);
  if(!r||r.dir!=='in')return false;
  if(r.status!=='wait')return false;

/* 单张读取：等比缩到最长边 ≤240，**绝不裁切**；原始宽高一起记下来，展示层按原比例还原 */
window.readStickerFile=function(file,cb){
  if(!file){cb(null,'没有拿到文件');return;}
  if(!/^image\//.test(file.type||'')){cb(null,'不是图片');return;}
  var fr=new FileReader();
  fr.onerror=function(){cb(null,'读取失败');};
  fr.onload=function(){
    var img=new Image();
    img.onerror=function(){cb(null,'这张图片无法解析');};
    img.onload=function(){
      var w=img.naturalWidth,h=img.naturalHeight;
      if(!w||!h){cb(null,'图片尺寸异常');return;}
      var sc=Math.min(1,STK_MAX_SIDE/Math.max(w,h));
      var cw=Math.max(1,Math.round(w*sc)),ch=Math.max(1,Math.round(h*sc));
      var cv=document.createElement('canvas');
      cv.width=cw;cv.height=ch;
      var cx=cv.getContext('2d');
      cx.fillStyle='#fff';                        /* PNG 透明底铺白，免得出黑块 */
      cx.fillRect(0,0,cw,ch);
      cx.drawImage(img,0,0,cw,ch);
      var out='';
      try{out=cv.toDataURL('image/jpeg',0.72);}catch(e){out='';}
      if(!out){cb(null,'图片太大，处理不了');return;}
      cb({src:out,w:w,h:h},null);
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
};

  if(!g||!list.length)return false;

  paintStkProg();

  var stepOne=function(){
    if(i>=list.length){
      var st=RT.stkImp||{added:0,failed:0,over:0,dup:0,total:list.length,ticks:[]};
      RT.stkLastImport={added:st.added,failed:st.failed,over:st.over,dup:(st.dup||0),total:st.total,ticks:(st.ticks||[]).slice()};

      /* 第103单收口 · 提示文案要**认得查重跳过**这一种结果：
         原来只有 added / over / failed 三个分支，所以"同一张图导第二次"（added=0,failed=0,dup=1）
         会掉进最后那个分支，说成"这 0 张都没读出来" —— 用户就是这么撞见的。 */
      if(st.added)toast('成功添加 '+st.added+' 张'+(st.dup?('（'+st.dup+' 张库里已有，已跳过）'):'')+(st.failed?('（'+st.failed+' 张读不出来，已跳过）'):'')+(st.over?('（'+st.over+' 张超出容量，没放进来）'):''));
      else if(st.dup)toast('这 '+st.dup+' 张库里已经有了，没有重复添加');
      else if(st.over)toast('表情包放不下了：本地空间有限，先删几张再导');
      else toast('这 '+st.failed+' 张都没读出来，换几张试试');

    }
    readStickerFile(list[i],function(res,err){
      var st=RT.stkImp;
      if(!st)return;
      if(err||!res||!res.src)st.failed++;
      else if(res.src.length>STK_MAX_ONE||stkBytes()+res.src.length>STK_MAX_ALL)st.over++;
      else if(g.items.some(function(c){return c.src&&c.src.length===res.src.length&&c.src===res.src;})){st.dup=(st.dup||0)+1;}   /* 第103单 · 查重：同一张图已在库里就跳过（先比长度做廉价前置，再逐字比） */
      else{g.items.push({id:uid('si'),e:'',src:res.src,w:res.w,h:res.h,hidden:false});st.added++;}
      st.done++;

      if(!Array.isArray(st.ticks))st.ticks=[0];
      st.ticks.push(st.done);                     /* 进度轨迹：判据据此断言中间态真的出现过 */
      RT.stkImp=st;

    });
  };

  return true;
};

  for(var i=0;i<len;i++){
    var w=Math.random()*2-1;
    b0=0.99886*b0+w*0.0555179;
    b1=0.99332*b1+w*0.0750759;
    b2=0.96900*b2+w*0.1538520;
    b3=0.86650*b3+w*0.3104856;
    b4=0.55000*b4+w*0.5329522;
    b5=-0.7616*b5-w*0.0168980;
    d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11;
    b6=w*0.115926;
  }
  return buf;
}
window.coNoiseStart=function(){
  var ctx=coAudioCtx();if(!ctx)return false;
  try{if(ctx.state==='suspended')ctx.resume();}catch(e){}
  if(coNoiseSrc)return true;
  try{
    var src=ctx.createBufferSource();
    src.buffer=coNoiseBuffer(ctx);src.loop=true;
    var lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1400;
    var gn=ctx.createGain();gn.gain.value=0;
    src.connect(lp);lp.connect(gn);gn.connect(ctx.destination);
    src.start(0);
    /* 增益 0.08：合成噪音原始 RMS 约 0.19，过 1400Hz 低通后剩约 0.15，
       乘 0.08 得 RMS ≈ 0.012（约 -38dBFS）——够听见又不盖过语音，手机外放也听得到。
       觉得吵就把这个数调小，别动 buffer 系数。 */
    gn.gain.linearRampToValueAtTime(0.08,ctx.currentTime+1.2);   /* 淡入，别一上来就响 */
    coNoiseSrc=src;coNoiseGain=gn;
    return true;
  }catch(e){coNoiseSrc=null;coNoiseGain=null;return false;}
};
window.coNoiseStop=function(){
  var src=coNoiseSrc,gn=coNoiseGain,ctx=coCtx;
  coNoiseSrc=null;coNoiseGain=null;
  if(!src||!gn||!ctx)return;
  try{
    gn.gain.cancelScheduledValues(ctx.currentTime);
    gn.gain.setValueAtTime(gn.gain.value,ctx.currentTime);
    gn.gain.linearRampToValueAtTime(0,ctx.currentTime+0.5);      /* 淡出，别硬切 */
    setTimeout(function(){
      try{src.stop();}catch(e){}
      try{src.disconnect();}catch(e){}
      try{gn.disconnect();}catch(e){}
    },620);
  }catch(e){}
};
window.coNoiseLive=function(){return !!coNoiseSrc;};

window.coStopAudio=function(){
  ['noise','voice'].forEach(function(k){
    var a=coAud[k];if(!a)return;
    try{a.pause();}catch(e){}
    try{a.currentTime=0;}catch(e){}
  });
  coNoiseStop();
};
window.coDropAudio=function(){
