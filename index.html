/* 白噪音起播：库里选的那段（音频在 IndexedDB，取 URL 是**异步**的）
   ⚠️ 取不到音频（删了 / IDB 被清 / 降级形态下没有 src）→ 一律回落到内置合成，
   宁可听粉红噪音也别给用户一片死寂。 */
function coNoisePlay(){
  var nz=window.coNoiseCur();
  if(!nz){coNoiseStart();return;}                                /* 没选自定义 → 内置粉红噪音 */
  window.coAudioSrc(nz,function(u){
    if(!u){coNoiseStart();return;}
    try{
      if(!coAud.noise)coAud.noise=new Audio(u);
      else if(coAud.noise.src!==u)coAud.noise.src=u;
    }catch(e){coAud.noise=null;}
    if(coAud.noise){coAud.noise.loop=true;try{coAud.noise.volume=1;}catch(e){}
      coPlaySafe(coAud.noise,coPlayFail);}                       /* 被拦要提示，不能静默 */
  });

window.coNoisePlay=coNoisePlay;
/* 起播：白噪音循环（库里当前那段，没选就走内置合成）；语音只播一次（不循环，避免整场只剩语音） */
window.coPlayAudio=function(){

    if(coAud.voice){coAud.voice.loop=false;try{coAud.voice.volume=1;}catch(e){}

window.coToggleAudio=function(k){

/* 开始一次陪伴：mode + 秒数；sec=0（且场景允许）→ 正计时
   who: 'me' | 'ta'；forceSec 传的是「分钟」（睡觉场景 0 = 正计时）。
   ⚠️ times / inviteTimes / RT.coSec 全部以「分钟」为单位，而 totalSeconds 存「秒」，
   所以这里必须 ×60 —— 漏了会让「25 分钟」变成 25 秒。 */
window.coStart=function(who,forceMode,forceSec,forceRound){
  var g=forceMode?coScene(forceMode):coScene(RT.coPick);
  if(!g){toast('先选一个场景');return false;}
  var min=(forceSec!=null)?forceSec:(RT.coSec!=null?RT.coSec:((g.times||[25])[0]));
  /* 预设之外的时长只有「自定义」这一条来路，min===RT.coCust 才放行；
     否则会被打回第一个预设，用户自己填的分钟数就白填了。 */
  if(g.times&&g.times.indexOf(min)<0&&!forceMode&&min!==RT.coCust)min=g.times[0];
  var rest=(min<=0);

     轮数来源优先级：邀请里带的轮数 > 发起页选的轮数 > 场景配的满轮。
     ⚠️ 番茄态下 totalSeconds 由**轮数**推导（coPomoSeconds），不再等于 min×60。 */

  RT.co={live:true,mode:g.id,startTs:Date.now(),totalSeconds:sec,isCountdown:!rest,
    extended:0,remain:sec,phase:'',by:'',voicePlayed:0,leaveChecked:false,left:false,pomo:pomo};

/* 番茄：休息结束、回到专注（同一套轮数继续跑） */
window.coPomoWork=function(ps){

/* 番茄：按「轮」延长（不是简单加分钟）—— 轮数 +n，总时长按轮数整体重算 */

/* 心跳：刷数字 + 时间到 + 中途离开检查 */
window.coTick=function(){
  var c=RT.co;if(!c||!c.live)return;
  if(c.phase){return;}                       /* 已在时间到/延长/告别面板，不再计时 */
  if(c.isCountdown&&coRemain()<=0){coTimeUp();return;}
  /* 番茄切段：靠 coPomoState() 这个纯函数算出「现在该在专注还是休息」，

  var ps=window.coPomoState();
  if(ps&&!ps.done&&ps.phase!==c.pomo.phase){
    c.pomo.phase=ps.phase;
    if(ps.phase==='break')coPomoBreak(ps);else coPomoWork(ps);
    return;                                  /* 刚整屏重绘过，这一拍不用再刷数字 */
  }
  /* 浮层被关掉（比如切屏回来、或错过首次重绘）就补画一次，再刷数字。
     ⚠️ RT.coHide＝用户**故意**收走去聊天的，别补画 —— 那会把人从聊天里硬拽回全屏。 */
  var _L=$('coLayer');
  if(!RT.coHide&&(!_L||!_L.classList.contains('open')))coPaintLive();
  coPaintTime();

  if(!c.left&&!c.leaveChecked&&c.mode!=='sleep'){

/* 陪伴日记：抽 1~3 张字卡拼一小段；字卡库空 → 用告别池兜底 */
window.coWriteDiary=function(rec){
  if(!rec||!rec.id)return;
  /* 幂等：同一次会话只写一篇日记 */
  if(S.coLog.some(function(x){return x.sid===rec.id;}))return;
  var pool=allVisibleCards();
  var pick=[],used={};
  var n=Math.min(pool.length,ri(1,3));
  for(var i=0;i<pool.length&&pick.length<n;i++){
    var idx=ri(0,pool.length-1);
    if(used[idx])continue;
    used[idx]=1;pick.push(pool[idx]);
  }
  var text=pick.length?pick.join(' · '):coLine('farewell',rec.mode);
  rec.diary=text.slice(0,600);
  S.coLog.unshift({id:uid('cl'),sid:rec.id,mode:rec.mode,ts:Date.now(),text:rec.diary});
  if(S.coLog.length>300)S.coLog.length=300;
};
/* TA 主动邀请：分场景池 + inviteTimes 随机时长；聊天里发一句，陪伴页出邀请卡 */

/* 试听库里的一段（3 秒）：点库列表里的喇叭就能听，用来立刻分辨

var coTestEl=null,coTestT=null;

  if(!coTestEl){try{coTestEl=new Audio();}catch(e){toast('这个环境放不了音频');return;}}
  var a=coTestEl;
  /* 音频在 IndexedDB 里 → 取 URL 是异步的；先把垫底音让一让，取到再播 */
  window.coAudioSrc(x,function(u){
    if(!u){toast('这段的音频不在本机了，删掉重新传一次吧');return;}
    try{a.pause();}catch(e){}
    var pausedMain=false;
    if(coAud.noise&&!coAud.noise.paused){try{coAud.noise.pause();pausedMain=true;}catch(e){}}
    a.src=u;a.loop=false;a.currentTime=0;
    try{a.volume=1;}catch(e){}
    clearTimeout(coTestT);
    coPlaySafe(a,function(e){
      var nm=coErrName(e);
      if(nm.indexOf('NotAllowed')===0)toast('试听被系统拦了 —— 再点一次喇叭试试');
      else toast('这段播不出来（'+nm+' · '+window.noiseMimeOf(x)+'）—— 换 wav / m4a 再传一次');
    });
    toast('试听 3 秒 · '+x.name);
    coTestT=setTimeout(function(){
      try{a.pause();a.currentTime=0;}catch(e){}
      if(pausedMain&&RT.co&&RT.co.live&&coOn.noise&&coAud.noise)coPlaySafe(coAud.noise,null);
    },3000);
  });
};
/* 切换「当前在用的那段」白噪音：id 传 '' / '__builtin' → 内置合成；否则必须是库里真实存在的一段。
   正在陪伴时**立刻换播**：先把旧音频节点和内置合成都停干净，再按新的起播
   （coPlayAudio 会复用 coAud.noise，不清掉就会继续播旧的那段）。 */
window.coSwitchNoise=function(id){
  if(id==='__builtin')id='';
  if(id&&!window.noiseLibFind(S.settings.coNoiseLib,id))return false;
  S.settings.coNoiseId=id;
  if(coAud.noise){try{coAud.noise.pause();}catch(e){}}
  coAud.noise=null;
  coNoiseStop();
  if(RT.co&&RT.co.live&&coOn.noise)coPlayAudio();
  save();
  return true;
};
/* 导入一段白噪音 → 进公共库，并立刻切到它（库里可以放多段，陪伴中随时换）
   两条路：① 有 IndexedDB → 按**二进制**读进音频仓，localStorage 只留元数据（单段 40MB、库 150MB）；
   ② 没有 IndexedDB → 降级回 dataURL，沿用旧的 600KB / 2M 小闸（功能不残，只是放不长）。 */
window.coPickNoise=function(){
  var ai=document.createElement('input');
  ai.type='file';ai.accept='audio/*';
  ai.addEventListener('change',function(){
    var af=ai.files&&ai.files[0];if(!af)return;
    var idb=(window.nzMode()!=='data');
    var cap=idb?window.CO_NOISE_ONE:CO_AUDIO_MAX;
    var lib=S.settings.coNoiseLib||[];
    if(af.size>cap){toast('这段音频太大了（'+window.nzSizeText(af.size)+'），单段上限 '+window.nzSizeText(cap));return;}
    if(lib.length>=window.CO_NOISE_MAX){toast('白噪音库最多 '+window.CO_NOISE_MAX+' 段，先删掉一段再来');return;}
    if(idb&&window.noiseLibBytes(lib)+af.size>window.CO_NOISE_ALL){
      toast('白噪音库放不下了（总量上限 '+window.nzSizeText(window.CO_NOISE_ALL)+'），先删掉一段');return;
    }
    var id=window.noiseNewId();
    var name=(af.name||'音频').replace(/\.[a-z0-9]+$/i,'').slice(0,24)||'白噪音';
    var mime=(af.type&&af.type.indexOf('audio/')===0)?af.type:window.nzMimeByName(af.name);
    var done=function(meta){
      var nl=window.noiseLibAddMeta(S.settings.coNoiseLib||[],meta);
      if(!window.noiseLibFind(nl,id)){toast('白噪音库放不下了，先删掉一段再来');return;}
      S.settings.coNoiseLib=nl;
      S.settings.coNoiseStore=idb?'idb':'data';
      window.coSwitchNoise(id);              /* 导入即切到新这段 */
      if(RT.nzSheet)coNoisePickSheet();else coMgrSheet();
      if(RT.co&&RT.co.live)coPaintLive();
      toast('已导入 · 现在听「'+name+'」');
    };
    if(idb){
      var ar=new FileReader();
      ar.onload=function(){
        var blob=null;
        try{blob=new Blob([ar.result],{type:mime});}catch(e){blob=null;}
        if(!blob){toast('音频读取失败');return;}
        if(blob.size>window.CO_NOISE_ONE){toast('这段音频太大了（'+window.nzSizeText(blob.size)+'）');return;}
        /* ⚠️ 先写 IDB 再写元数据：写失败就当没导，别在列表里留一个点不响的幽灵段 */
        window.nzPut(id,blob,function(ok){
          if(!ok){
            /* IDB 写不进（配额/隐私模式）→ 退回 dataURL 塞 localStorage，能塞下就塞 */
            if(blob.size<=CO_AUDIO_MAX){
              var r2=new FileReader();
              r2.onload=function(){
                var src=String(r2.result);
                var nl=window.noiseLibAdd(S.settings.coNoiseLib||[],src,name);
                if(!nl.length||nl.length===(S.settings.coNoiseLib||[]).length){toast('本机存不下这段音频，换短一点的试试');return;}
                S.settings.coNoiseLib=nl;S.settings.coNoiseStore='data';
                window.coSwitchNoise(nl[nl.length-1].id);
                if(RT.nzSheet)coNoisePickSheet();else coMgrSheet();
                toast('已导入（本机数据库不可用，已按小容量方式存）');
              };
              r2.onerror=function(){toast('音频读取失败');};
              r2.readAsDataURL(blob);
              return;
            }
            toast('存不下这段音频（本机数据库写不进去），换短一点的试试');
            return;
          }
          coUrlSet(id,blob);                 /* 刚读出来的 Blob 直接变成可播 URL，起播不用再等 IDB */
          done({id:id,name:name,ts:Date.now(),mime:mime,size:blob.size,st:1,src:''});
        });
      };
      ar.onerror=function(){toast('音频读取失败');};
      ar.readAsArrayBuffer(af);
      return;
    }
    /* 降级形态：dataURL 塞 localStorage（老机器 / 隐私模式） */
    var ar2=new FileReader();
    ar2.onload=function(){
      var src=String(ar2.result);
      if(src.length>CO_AUDIO_MAX){toast('这段音频太大，本机存不下，请换短一点的');return;}
      var old=S.settings.coNoiseLib||[];
      var nl=window.noiseLibAdd(old,src,(af.name||'音频').slice(0,24));
      if(nl.length===old.length){
        var dup=false;old.forEach(function(x){if(x.src===src)dup=true;});
        toast(dup?'这段已经在库里了':('白噪音库放不下了（最多 '+window.CO_NOISE_MAX+' 段、总量也有限），先删掉一段再来'));
        return;
      }
      S.settings.coNoiseLib=nl;S.settings.coNoiseStore='data';
      var added=nl[nl.length-1];
      window.coSwitchNoise(added.id);
      if(RT.nzSheet)coNoisePickSheet();else coMgrSheet();
      if(RT.co&&RT.co.live)coPaintLive();
      toast('已导入 · 现在听「'+added.name+'」');
    };
    ar2.onerror=function(){toast('音频读取失败');};
    ar2.readAsDataURL(af);
  });
  document.body.appendChild(ai);ai.click();
  setTimeout(function(){try{document.body.removeChild(ai);}catch(e){}},600);
};
/* 素材上传：背景图走等比压缩（不裁切）；音频直接存 dataURL，加 600KB 闸
   ⚠️ 白噪音是**库里选的**（S.settings.coNoiseLib + coNoiseId），不挂在任何场景上 ——
   所以它不依赖 RT.coEdit，上传完重绘的是陪伴设置弹层（coMgrSheet）或切换弹层（coNoisePickSheet）。 */
window.coPickAsset=function(kind){
  if(kind==='noise'){coPickNoise();return;}
  var g=coScene(RT.coEdit);if(!g){toast('先保存场景再换素材');return;}
  if(kind==='bg'){
    var i=document.createElement('input');
    i.type='file';i.accept='image/*';
    i.addEventListener('change',function(){
      var f=i.files&&i.files[0];if(!f)return;
      var rd=new FileReader();
      rd.onload=function(){
        var img=new Image();
        img.onload=function(){
          try{
            var d=fitDataUrl(img,1280,0.82);   /* 等比缩放，不裁切 */
            g.bg=d;save();coEditSheet(RT.coEdit);toast('背景图已换上');
          }catch(e){toast('图片处理失败，换一张试试');}
        };
        img.onerror=function(){toast('图片读取失败');};
        img.src=String(rd.result);
      };
      rd.onerror=function(){toast('文件读取失败');};
      rd.readAsDataURL(f);
    });
    document.body.appendChild(i);i.click();
    setTimeout(function(){document.body.removeChild(i);},600);
    return;
  }
  /* 音频：白噪音 / 语音 */
  var ai=document.createElement('input');
  ai.type='file';ai.accept='audio/*';
  ai.addEventListener('change',function(){
    var af=ai.files&&ai.files[0];if(!af)return;
    if(af.size>CO_AUDIO_MAX){toast('这段音频太大了（'+(af.size/1024|0)+'KB），请压到 600KB 以内');return;}
    var ar=new FileReader();
    ar.onload=function(){
      var src=String(ar.result);
      if(src.length>CO_AUDIO_MAX){toast('这段音频太大，本机存不下，请换短一点的');return;}
      g[kind]={src:src,name:(af.name||'音频').slice(0,24).replace(/\.[a-z0-9]+$/i,'')};
      save();coEditSheet(RT.coEdit);toast('已换上');
    };
    ar.onerror=function(){toast('音频读取失败');};
    ar.readAsDataURL(af);
  });
  document.body.appendChild(ai);ai.click();
  setTimeout(function(){document.body.removeChild(ai);},600);
};
/* 等比缩放成 dataURL（不裁切，长边 ≤ maxSize） */
function fitDataUrl(img,maxSize,quality){
  var w=img.width,h=img.height;
  var k=Math.min(1,maxSize/Math.max(w,h));
  var cv=document.createElement('canvas');
  cv.width=Math.max(1,Math.round(w*k));cv.height=Math.max(1,Math.round(h*k));
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
  return cv.toDataURL('image/jpeg',quality||0.82);
}
/* 保存场景（新建或编辑）：改名不丢素材 */
window.coSaveScene=function(gid){
  var name=(($('coName')||{}).value||'').trim();
  var hint=(($('coHint')||{}).value||'').trim();
  var tRaw=(($('coTimes')||{}).value||'').trim();
  var iRaw=(($('coItimes')||{}).value||'').trim();
  if(!name){toast('先给场景起个名字');return;}
  function nums(s,allowZero){
    return s.split(/[,，\s]+/).map(function(x){return Math.round(+x);})
      .filter(function(x){return isFinite(x)&&(allowZero?x>=0:x>0);})
      .map(function(x){return Math.min(600,x);}).slice(0,8);
  }
  var times=nums(tRaw,true);
  if(!times.length)times=[25];
  var itimes=nums(iRaw,false);
  if(!itimes.length)itimes=[times[times.length-1]||25];
  /* 番茄参数：开关关了也**照样存数值**（下次再打开还记得用户调过的分钟数）。
     输入框可能被隐藏或为空 → 一律回落到 25/5/4 再夹取，别让空串变成 NaN 落档。 */
  function pnum(elId,def,mn,mx){
    /* ⚠️ 先判「字符串是否为空」再转数字：'' → +'' = 0，直接判 isFinite 会把空框当成 0 */
    var e=$(elId),s=(e&&e.value!=null)?String(e.value).trim():'';
    var raw=s?+s:def;
    if(!isFinite(raw))raw=def;
    return Math.max(mn,Math.min(mx,Math.round(raw)));
  }
  var pomo={on:!!RT.coPomoOn,work:pnum('coPomoW',25,1,180),brk:pnum('coPomoB',5,0,60),rounds:pnum('coPomoR',4,1,12)};
  var g=gid?coScene(gid):null;
  if(g){
    g.label=name.slice(0,12);g.hint=hint.slice(0,60);
    g.icon=RT.coIcon||g.icon;g.times=times;g.inviteTimes=itimes;g.pomo=pomo;   /* 改名/改图标不碰 bg/noise/voice */
  }else{
    S.coScenes.push({id:uid('co'),label:name.slice(0,12),icon:RT.coIcon||'heart',hint:hint.slice(0,60),
      hidden:false,builtin:false,times:times,inviteTimes:itimes,pomo:pomo,bg:'',noise:null,voice:null});
  }
  /* 番茄参数变了 → 发起页的「轮数」默认值也要跟着重算，否则还停在旧场景的轮数上 */
  if(RT.coPick===gid){
    var sg=coScene(gid);
    RT.coRound=(sg&&sg.pomo&&sg.pomo.on)?sg.pomo.rounds:0;
  }
  save();RT.coEdit=null;RT.coIcon=null;
  coMgrSheet();
  toast(g?'场景已更新':'新场景建好了');
  if(RT.route==='company')renderCompany();
};

/* ---------- 朋友圈（第4单）引擎 ----------
   文案来源铁律：TA 自动发圈 = pickLine 抽 2~5 张字卡拼接（不是固定语料）；字卡库空才回退 MOM_ME_LINES。
   贴纸随机从可见池取（隐藏分类/隐藏表情不入池，与第9单同规）。
   通知走工单 deliver B：功能图标角标（tab badge）+ toast，点角标跳该功能页。 */
window.armMom=function(){
  var min=Math.max(1,S.settings.momAutoMin),max=Math.max(min,S.settings.momAutoMax);
  RT.momNext=Date.now()+ri(min,max)*60000;
};
/* 今天 TA 已经发了几条（按数据统计，刷新/重开都不丢，也与冷却/上限一起收口） */
function momTodayCount(){
  var k=dayKey(),n=0;
  (S.moments||[]).forEach(function(m){if(m.dir==='ta'&&dayKey(m.ts)===k)n++;});
  return n;
}
window.momTodayCount=momTodayCount;
/* 最近一条 TA 动态的时间（冷却用） */
function momLastTaTs(){
  var t=0;
  (S.moments||[]).forEach(function(m){if(m.dir==='ta'&&m.ts>t)t=m.ts;});
  return t;
}
/* 造一条 TA 动态：抽卡拼文案 + 随机贴纸 + 随机位置。
   forceN 传给 pickLine 的抽卡张数（验收用确定性）；返回动态对象 */
window.taMoment=function(forceN){
  var n=forceN>0?forceN:ri(2,5);                       /* 工单验收 3：2~5 张 */
  var text=pickLine(n,'\n');                           /* 从字卡库抽卡拼接（库空时 pickLine 返回 null） */
  if(!text||!text.trim())text=MOM_TA_SEED[ri(0,MOM_TA_SEED.length-1)];   /* 空库兜底：绝不让动态只有一张贴纸 */
  var stk=null;
  if(Math.random()*100<55){                            /* 贴纸随机（不是必有） */
    var pool=stkPool(null);
    if(pool.length){var it=pool[ri(0,pool.length-1)];stk={id:it.id,e:it.e,src:it.src,w:it.w||0,h:it.h||0,gid:it.gid,gN:it.gN};}
  }
  if(!text&&!stk)text=MOM_ME_LINES[ri(0,MOM_ME_LINES.length-1)];
  var place=(Math.random()<0.6)?MOM_PLACES[ri(0,MOM_PLACES.length-1)]:'';
  var m={id:uid('M'),dir:'ta',text:(text||'').slice(0,MOM_MAX),stk:stk,place:place,
    likes:{ta:0,me:0},comments:[],seen:0,ts:Date.now()};
  S.moments.unshift(m);
  if(S.moments.length>300)S.moments=S.moments.slice(0,300);
  save();
  toast(TA_NAME()+' 发了新动态');
  if(RT.route==='moments'&&window.renderMoments)renderMoments();
  if(RT.route==='more'&&window.renderMore)renderMore();
  paintTab();
  return m;
};
/* 心跳里判定是否该发圈：开关 + 到点 + 冷却 + 单日上限 */
window.maybeTaMoment=function(){
  var st=S.settings;
  if(!st.momOn)return false;
  if(Date.now()<RT.momNext)return false;
  var cool=Math.max(0,+st.momCoolMin||0);
  if(cool>0&&Date.now()-momLastTaTs()<cool*60000){armMom();return false;}
  var cap=Math.max(0,Math.round(+st.momDailyCap||0));
  if(cap>0&&momTodayCount()>=cap){armMom();return false;}
  armMom();
  taMoment();
  return true;
};

/* 进朋友圈即清未读（工单验收 8：点进去清零） */

/* ---------- 第17单 塔罗占卜：抽牌 / 解读 / 历史 / 每日一牌 ---------- */
/* Fisher–Yates 洗牌取前 n 张 —— 同一把内不重复（验收 1）。
   用 Math.random 真洗，不做「抽完放回」那种会出重复的了色实现。 */
function tarotShuffle(pool){
  var a=pool.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}
window.tarotShuffle=tarotShuffle;
/* 抽一把：n 张 + 每张独立 50% 正逆位。返回 [{card,rev}] */
window.tarotDeal=function(n){
  var picked=tarotShuffle(TAROT).slice(0,Math.max(1,Math.min(3,n)));
  return picked.map(function(c){return {card:c,rev:Math.random()<0.5};});
};
window.tarotDeal=tarotDeal;
/* 【默认·离线】本地模板解读（验收 2）：牌名 + 方位 + 关键词串拼接。
   没有 Key 也必须能读出东西来 —— 加购项不能把默认功能变成残疾。 */
window.tarotTemplate=function(drawn,q){
  if(!drawn||!drawn.length)return '';
  var slots=tarotSlots(drawn.length);
  var qq=String(q||'').trim();
  var lines=drawn.map(function(d,i){
    return slots[i]+' · '+d.card.full+'（'+tarotOri(d)+'，'+d.card.kw+'）：'+
      tarotWords(d).slice(0,4).join('、');
  });
  var all=[];
  drawn.forEach(function(d){all=all.concat(tarotWords(d).slice(0,3));});
  return [qq?('关于「'+qq+'」，牌面这样回应：'):'牌面这样回应：']
    .concat(lines)
    .concat(['把这几个词放在一起看：'+all.join('、')+'。它更像是在提醒你留意当下的节奏，而不是替你决定。'])
    .join('\n');
};
/* AI 解读是加购项：没填 Key 就置灰，不给按钮也不假装能用（验收 3） */
window.tarotAiReady=function(){return !!(S.ai&&String(S.ai.key||'').trim());};
/* 调智谱：人设 + 塔罗专属指令拼在 system，user 只发问题 + 牌面。
   失败/超时一律中文提示，本地解读原样保留（加购挂了不能让默认功能跟着废）。 */
window.runTarotAI=function(){
  var t=RT.tarot;
  if(!tarotAiReady()){toast('还没填 API Key：设置 → AI 解读');return false;}
  if(t.aiBusy)return false;
  if(!t.drawn.length||t.dealt<t.mode)return false;
  var me=t;                                   /* 记下这一把：回来时对不上就丢掉（重抽时旧回复不贴新牌） */
  var slots=tarotSlots(me.mode);
  var face=me.drawn.map(function(d,i){
    return slots[i]+'：'+d.card.full+'（'+tarotOri(d)+'）+ 关键词['+tarotWords(d).slice(0,4).join('、')+']';
  }).join('\n');
  t.aiBusy=true;
  if(RT.route==='tarot')renderTarot();
  var ctl=(typeof AbortController!=='undefined')?new AbortController():null;
  var timer=setTimeout(function(){if(ctl)ctl.abort();},TAROT_AI_TIMEOUT);
  var sys=(S.ai.persona||DEF_AI_PERSONA)+
    '\n现在你通过塔罗牌来解释你的回答：把牌面读成你自己想对对方说的话，两三句、第一人称，不要说明书式复述牌名。';
  var usr=(me.q?('我问的是：'+me.q+'\n'):'')+'我抽到的牌：\n'+face;
  fetch('https://open.bigmodel.cn/api/paas/v4/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.ai.key},
    body:JSON.stringify({model:S.ai.model||'glm-4-flash',
      messages:[{role:'system',content:sys},{role:'user',content:usr}],temperature:0.9}),
    signal:ctl?ctl.signal:undefined
  }).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(j){
    clearTimeout(timer);
    if(RT.tarot!==me)return;                  /* 已经重抽过了：这份回复属于上一把，丢掉 */
    var txt='';
    try{txt=j.choices[0].message.content;}catch(e){txt='';}
    txt=String(txt||'').trim();
    me.aiBusy=false;
    if(!txt){toast('TA 这次没说出什么，本地牌义还在');if(RT.route==='tarot')renderTarot();return;}
    me.reading=txt;me.src='ai';
    tarotCommit(me,me.recId);                 /* AI 回来【改写同一条历史】，不新增（验收 3） */
    if(RT.route==='tarot')renderTarot();
  }).catch(function(err){
    clearTimeout(timer);
    if(RT.tarot!==me)return;
    me.aiBusy=false;
    var why=(err&&err.name==='AbortError')?'TA 看牌看太久，先不等了':('联网失败：'+((err&&err.message)||'未知错误'));
    toast(why+'，本地牌义还在');
    if(RT.route==='tarot')renderTarot();
  });
  return true;
};
/* 落一条历史：AI 回来后要改写同一条，所以按 id 找得到就覆盖 */
function tarotCommit(t,recId){
  var list=S.tarot||(S.tarot=[]);
  var rec=null;
  if(recId)list.forEach(function(x){if(x.id===recId)rec=x;});
  var cards=t.drawn.map(function(d){
    return {name:d.card.full,kw:tarotWords(d).slice(0,4).join('、'),rev:!!d.rev};
  });
  var now=new Date();
  if(rec){
    rec.cards=cards;rec.reading=t.reading;rec.src=t.src;rec.q=t.q;rec.mode=t.mode;
  }else{
    rec={id:uid('tr'),q:t.q,cards:cards,reading:t.reading,src:t.src,mode:t.mode,
      ts:Date.now(),day:todayStr(),time:p2(now.getMonth()+1)+'-'+p2(now.getDate())+' '+p2(now.getHours())+':'+p2(now.getMinutes())};
    list.push(rec);
    if(list.length>TAROT_CAP)list.splice(0,list.length-TAROT_CAP);   /* 满了从头部丢最旧（验收 4） */
  }
  t.recId=rec.id;
  save();
  return rec;
}
window.tarotCommit=tarotCommit;
/* 开始抽牌：逐张翻开（240 + i×220ms），**最后一张亮完才落解读与历史**
   —— 还在翻就记账会记到空牌上（客单13 的案底）。 */
window.tarotDraw=function(){
  var t=RT.tarot;
  if(t.drawn.length&&t.dealt<t.mode)return false;      /* 正在揭牌，别重入 */
  t.drawn=tarotDeal(t.mode);
  t.dealt=0;t.reading='';t.src='local';t.aiBusy=false;t.recId=null;
  RT.trLast=null;
  if(RT.route==='tarot')renderTarot();
  var i=0;
  (function step(){
    if(RT.tarot!==t)return;
    if(i>=t.mode){tarotSettle(t);return;}
    LATER(function(){
      if(RT.tarot!==t)return;
      t.dealt=i+1;
      if(RT.route==='tarot')renderTarot();
      i++;
      step();
    },240+i*220);
  })();
  return true;
};
/* 翻完最后一张：落本地解读 + 写历史；有 Key 就自动请 TA 解读（买家不知道要点按钮） */
function tarotSettle(t){
  if(RT.tarot!==t)return;
  t.reading=tarotTemplate(t.drawn,t.q);

/* ---------- 生理期关怀（第20单）：标记 / 闭合 / 预测 / 关怀 / 预警 ---------- */
function pPad(n){return (n<10?'0':'')+n;}
window.pdKey=function(dt){return dt.getFullYear()+'-'+pPad(dt.getMonth()+1)+'-'+pPad(dt.getDate());};
window.pdParse=function(key){var p=String(key).split('-');return new Date(+p[0],(+p[1]||1)-1,+p[2]||1);};
window.pdAddDays=function(key,n){var d=pdParse(key);d.setDate(d.getDate()+n);return pdKey(d);};
window.pdDiffDays=function(a,b){return Math.round((pdParse(b)-pdParse(a))/86400000);};
function pMonthShift(ym,delta){
  var p=String(ym||'').split('-'),y=+p[0],m=(+p[1]||1)-1+delta;
  if(!isFinite(y))return pdKey(new Date()).slice(0,7);
  y+=Math.floor(m/12);m=((m%12)+12)%12;
  return y+'-'+p2(m+1);
}
/* 进行中＝最后一条没写结束日的周期（案底：标记结束要找它，别只认开始那天） */
window.periodOngoing=function(){
  for(var i=S.periods.length-1;i>=0;i--)if(!S.periods[i].ed)return S.periods[i];
  return null;
};
window.periodCovers=function(key){
  var today=pdKey(new Date());
  for(var i=0;i<S.periods.length;i++){
    var p=S.periods[i],end=p.ed||today;
    if(end<p.sd)end=p.sd;
    if(key>=p.sd&&key<=end)return true;
  }
  return false;
};
/* 预测：平均周期=相邻开始日间隔均值；间隔波动>7 天给区间，否则单日 */
window.periodStats=function(){
  var st={n:S.periods.length,avgCycle:0,avgLen:5,next:'',lo:'',hi:'',isRange:false,dNext:0,dLo:0,dHi:0};
  if(!st.n)return st;
  var ds=S.periods.map(function(p){return p.sd;}).sort();
  var lastS='';ds.forEach(function(d){if(d>lastS)lastS=d;});
  var iv=[],i,d;
  for(i=1;i<ds.length;i++){d=pdDiffDays(ds[i-1],ds[i]);if(d>0)iv.push(d);}
  if(iv.length){
    var s=0;iv.forEach(function(x){s+=x;});
    st.avgCycle=Math.round(s/iv.length);
    var mn=Math.min.apply(null,iv),mx=Math.max.apply(null,iv);
    if(mx-mn>7){
      st.isRange=true;
      st.lo=pdAddDays(lastS,mn);st.hi=pdAddDays(lastS,mx);
      st.dLo=pdDiffDays(pdKey(new Date()),st.lo);st.dHi=pdDiffDays(pdKey(new Date()),st.hi);
    }else{
      st.next=pdAddDays(lastS,st.avgCycle);
      st.dNext=pdDiffDays(pdKey(new Date()),st.next);
    }
  }
  var closed=S.periods.filter(function(p){return p.ed;});
  if(closed.length){
    var L=0;closed.forEach(function(p){L+=Math.max(1,pdDiffDays(p.sd,p.ed)+1);});
    st.avgLen=Math.max(1,Math.round(L/closed.length));
  }
  return st;
};
window.periodPredicts=function(){
  var st=periodStats(),out=[];
  if(st.isRange){var k=st.lo;while(k<=st.hi&&out.length<60){out.push(k);k=pdAddDays(k,1);}}
  else if(st.next)out.push(st.next);
  return out;
};
/* 标记开始：自动闭合上一轮（闭到前一天），并排程 TA 关怀（20~30 分钟，每周期一次） */
window.periodStart=function(key){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(key))return;
  var today=pdKey(new Date());
  if(key>today){toast('这天还没来，不能提前标记');return;}
  var lastS='',lastP=null;
  S.periods.forEach(function(p){if(p.sd>lastS){lastS=p.sd;lastP=p;}});
  if(lastP&&key<=lastS){toast('新一轮开始要在 '+lastS+' 之后');return;}
  if(lastP&&!lastP.ed){
    lastP.ed=pdAddDays(key,-1);
    if(lastP.ed<lastP.sd)lastP.ed=lastP.sd;
  }
  S.periods.push({id:uid('pd'),sd:key,ed:''});
  S.periods.sort(function(a,b){return a.sd<b.sd?-1:1;});
  S.periodCareAt=0;
  if(S.settings.careOn&&S.periodCaredFor!==key){
    S.periodCareAt=Date.now()+(PERIOD_CARE_MIN+ri(0,PERIOD_CARE_MAX-PERIOD_CARE_MIN))*60000;
  }
  save();
};
/* 标记结束：找最后一条未闭合周期，key 不早于其开始日就闭合到 key（客单17 案底） */
window.periodEnd=function(key){
  var p=periodOngoing();
  if(!p){toast('没有进行中的经期');return;}
  var today=pdKey(new Date());
  if(key>today)key=today;
  if(key<p.sd){toast('结束日不能早于开始日');return;}
  p.ed=key;save();
};
/* 取消：开始日→删整条+清日志区间+撤关怀排程；已结束周期的结束日→重开 */
window.periodCancel=function(key){
  var idx=-1;
  S.periods.forEach(function(p,i){if(p.sd===key)idx=i;});
  if(idx>=0){
    var p=S.periods[idx],today=pdKey(new Date()),to=p.ed||today;
    if(to>today)to=today;
    for(var k=p.sd;k<=to;k=pdAddDays(k,1))delete S.periodLog[k];
    S.periods.splice(idx,1);
    if(S.periodCaredFor===key){S.periodCaredFor='';S.periodCareAt=0;}
    save();return 'del';
  }
  var reopened=false;
  S.periods.forEach(function(p){if(p.ed&&p.ed===key){p.ed='';reopened=true;}});
  if(reopened)save();
  return reopened?'reopen':'';
};
window.periodToggleSym=function(name){

window.maybePeriodWarn=function(){

/* 清单/文案池编辑弹层：行内即时生效，删空回落默认 */

/* 第111单 · 真机报告的 bug：点输入框弹键盘后**顶栏消失、中段大片空白**。
   原因是只缩了高度、没处理视觉视口的**位移**：键盘弹起时有的引擎（Android Chrome 默认、iOS）
   不改布局视口，而是把视觉视口**下移**（visualViewport.offsetTop > 0）——此时可见区域是"整页被裁掉顶部的一段"，
   于是顶栏被切掉、露出中间空白。两处一起治：
   ① viewport meta 加 interactive-widget=resizes-content（让布局视口跟着键盘缩，Chrome 108+ 起 offsetTop 恒为 0）；
   ② 这里把 offsetTop 反向抵消成 --vvt（#phone 的 margin-top），给不吃 ① 的引擎兜底。 */
function fitView(){
  var vv=window.visualViewport;
  var h=vv?Math.round(vv.height):window.innerHeight;
  var top=vv?Math.round(vv.offsetTop||0):0;
  /* 第124单 · iOS（iPhone）复报"一弹输入法就崩、聊天记录显示不出来"，截图里整个 app 都被抬出可视区。
     根因：**两种引擎的键盘行为形状不同**，第111单只治了 Android 那一种 ✗——
       · 旧 Android：视觉视口**单纯下移**（offsetTop>0，文档本身没滚）→ 用 --vvt 把 app 反向抬回去 ✔；
       · iOS Safari：**整页被网页滚动**（pageTop/scrollY > 0）→ 这时再叠加 --vvt 就是**双重补偿**，
         app 被抬到屏幕外，看着像崩掉 ✗（单主那张"只剩背景色 +键盘"的图就是这个）。
     按"文档有没有自己滚过"分流，不嗅探 UA：
       滚过 → 把文档滚回 0（app 高度已是 --vvh，正好贴住键盘上沿），--vvt 归零；
       没滚过（纯位移）→ 保留 --vvt 抵消。 */
  var scrolled=0;
  try{ scrolled=Math.max(Math.round((vv&&vv.pageTop)||0),Math.round(window.scrollY||0)); }catch(e){}
  if(scrolled>0){ try{ window.scrollTo(0,0); }catch(e){} }
  var comp=(scrolled>0)?0:top;
  document.documentElement.style.setProperty('--vvh',h+'px');
  document.documentElement.style.setProperty('--vvt',(-comp)+'px');
  if(window.alignActs)window.alignActs();     /* 第118单 · 视口变了跟着重新对齐图标排 */
}
/* ---------- 第118单 · 顶栏图标排 = 自对齐（不再依赖任何常数/公式） ----------
   为什么：第73单那个 top:calc(50% - 6px) 是按当时的字号/间距量出来的常数，单主一改就偏；
   第115单换成跟随 --nm-size/--nm-gap 的公式后，在**干净上下文**里 7 组全 0px，但夹具上下文里仍差 6px
   —— 说明凡是"预先算好的偏移"都会随上下文（头像尺寸、卡片高度、字体…）漂。
   所以改成**量一次、写绝对值**：每次运行都从"头像中心"重新算目标 top（与当前 top 无关 → 幂等），
   上下文怎么变都对齐。挂在 renderThread 开头（每次进聊天页都会跑）+ fitView（缩放/键盘）上。 */
window.alignActs=function(){
  try{
    var mid=document.querySelector('.chatduo__mid');
    var av=document.querySelector('.chatduo__av');
    var row=document.querySelector('.chatduo__acts');
    if(!mid||!av||!row)return;                 /* 桌面外壳/别的屏：没有这排就什么都不做 */
    if(row.offsetParent===null)return;         /* 没显示时 rect 全是 0，量了会写坏 top */
    var rm=mid.getBoundingClientRect(),ra=av.getBoundingClientRect(),rr=row.getBoundingClientRect();
    if(!rr.height||!rm.height)return;
    var want=(ra.top+ra.bottom)/2;             /* 目标：图标排的**中心**落在头像中线上 */
    /* ⚠️ 这一排还带着 transform:translate(-50%,-50%)：translateY(-50%) 已经把行心抬到 top 值上，
       所以 top 就**直接**等于"头像中心相对中列的偏移"，这里不能再减半高（减了就少抬一个行高 —— 实测差 15px）。 */
    var top=want-rm.top;
    row.style.top=(Math.round(top*10)/10)+'px';/* 覆盖 CSS 里那条 calc —— 两者都是初值，运行时以这里为准 */
  }catch(e){}
};

/* ---------- 聊天视频（第24单·增补） ----------
   一句话设计：**视频本体进 IndexedDB，聊天存档只留一行元数据**。
   手机上随手拍一段就是几十 MB，base64 还要再涨 33%，走 dataURL 必炸 localStorage；
   而 localStorage 一炸，**全站所有功能的存档都写不进去**（工单里反复记过的坑）。 */

   内存翻倍还可能直接卡死 —— 视频一律拿 File 本体，直接写 IndexedDB。
   ⚠️ input **不能在定时器里提前摘掉**：手机上文件选择器常常要好几秒才返回，
   input 若已从 DOM 移除，change 事件就不会触发 —— 用户选完视频毫无反应（实测踩到）。
   正确做法：change 里再摘；上次没选成留下的那个，下次进这个函数时顺手清掉。 */
var vidInputEl=null;
function pickFileRaw(accept,cb){
  if(vidInputEl){try{document.body.removeChild(vidInputEl);}catch(e){}vidInputEl=null;}
  var i=document.createElement('input');
  i.type='file';i.accept=accept;i.style.display='none';
  i.addEventListener('change',function(){
    var f=i.files&&i.files[0];
    try{document.body.removeChild(i);}catch(e){}
    if(vidInputEl===i)vidInputEl=null;

/* 补 video/* 前缀：安卓上 File.type 常是空串或 application/octet-stream，
   留着空 MIME，<video> 会直接不认这个 Blob（和音频那次的坑同源）。 */
window.vidMimeOf=function(name,type){
  if(type&&type.indexOf('video/')===0)return type;
  var ext=(String(name||'').match(/\.([a-z0-9]+)$/i)||[])[1];
  var map=window.VID_EXT||{};
  return (ext&&map[ext.toLowerCase()])||'video/mp4';

/* 读出时长/尺寸 + 抓一张封面（dataURL）。全程用 object URL，不碰 base64。
   ⚠️ 封面必须**先 seek 到 0.1 秒再抓** —— 第 0 帧在多数编码里是黑场或纯色，抓到就是一张黑图。
   ⚠️ 抓不到封面不算失败（部分机型 canvas 取不了视频帧）：没封面就退化成渐变占位块，功能照用。 */
window.vidProbe=function(file,cb){
  var url=URL.createObjectURL(file),v=document.createElement('video'),done=false;
  var timer=setTimeout(function(){fail('读这段视频超时了，换一段小一点的试试');},15000);
  function cleanup(){clearTimeout(timer);try{v.removeAttribute('src');v.load();}catch(e){}}
  function fail(msg){if(done)return;done=true;cleanup();try{URL.revokeObjectURL(url);}catch(e){}cb({err:msg});}
  v.preload='metadata';v.muted=true;v.playsInline=true;
  v.onerror=function(){fail('这个视频格式浏览器放不了');};
  v.onloadedmetadata=function(){
    var dur=isFinite(v.duration)?v.duration:0;
    if(dur&&dur<window.VID_MIN_DUR)return fail('这段视频太短了，或者只有声音没有画面');
    var w=v.videoWidth||0,h=v.videoHeight||0;
    if(!w||!h)return fail('读不出画面尺寸，这段视频可能只有声音轨');
    var at=(dur>0.25)?Math.min(window.VID_SEED,dur/2):0;
    v.onseeked=function(){
      if(done)return;
      var pw=Math.min(window.VID_POST_W,w),ph=Math.max(1,Math.round(pw*h/w));
      var post='';
      try{
        var cv=document.createElement('canvas');cv.width=pw;cv.height=ph;
        cv.getContext('2d').drawImage(v,0,0,pw,ph);
        post=cv.toDataURL('image/jpeg',0.72);
      }catch(e){post='';}
      done=true;cleanup();
      cb({dur:Math.round(dur*10)/10,w:w,h:h,post:post});
    };
    try{v.currentTime=at;}catch(e){v.onseeked();}
  };
  v.src=url;
};

window.vidAdd=function(file){
  if(!file)return;

  if(file.size>window.VID_ONE){toast('这段视频 '+window.nzSizeText(file.size)+'，超过单段上限 '+window.nzSizeText(window.VID_ONE));return;}
  if((S.vids||[]).length>=window.VID_MAX){toast('聊天视频最多存 '+window.VID_MAX+' 段，先去「设置 → 聊天视频」删掉一些');return;}
  if(window.vidBytes()+file.size>window.VID_ALL){toast('视频总量已经到 '+window.nzSizeText(window.VID_ALL)+' 了，先去设置里清一些');return;}
  toast('正在读取视频…');
  window.vidProbe(file,function(r){
    if(r.err){toast(r.err);return;}
    var id=uid('v');
    /* type 已经对了就直接用原 File（省一次整段内存拷贝）；不对才重包一个补 MIME */
    var body=(file.type&&file.type.indexOf('video/')===0)?file:new Blob([file],{type:window.vidMimeOf(file.name,file.type)});
    window.mdPut('v:'+id,body,function(ok){
      if(!ok){toast('视频没存进去，可能空间不够');return;}
      var rec={id:id,w:r.w,h:r.h,dur:r.dur,size:body.size||file.size,
        name:(file.name||'视频').slice(0,60),ts:Date.now(),st:1};
      var after=function(){
        S.vids.push(rec);
        var m={from:'self',type:'video',text:'[视频]',vid:id,rd:1,seen:0};
        addMsg(m);
        closePanel();
        toast('发出去了 · '+window.nzSizeText(rec.size));
        if(window.afterSelfSend)afterSelfSend(m);      /* 和发文字/表情一样，TA 会回一句 */
      };
      if(r.post)window.mdPut('p:'+id,r.post,function(){after();});
      else after();
    });
  });
};

  window.renderPin();
  return true;
};
window.pinOff=function(){      /* 横幅右边那个「移除」 */
  if(window.pinClear())toast('已取消置顶');
  else toast('本来就没有置顶');
};
/* 复制：优先 Clipboard API；`file://` 打开或权限被拒时回落 execCommand。
   ⚠️ Clipboard API 失败是 **Promise reject**，try/catch 接不到 —— 必须给它 then 的第二个参数。 */
function copyPlainOld(t){
  try{
    var a=document.createElement('textarea');a.value=t;
    a.setAttribute('readonly','');a.style.cssText='position:fixed;left:-9999px;top:0;opacity:0;';
    document.body.appendChild(a);a.focus();a.select();
    try{a.setSelectionRange(0,a.value.length);}catch(e){}
    var ok=false;
    try{ok=document.execCommand('copy');}catch(e){}
    if(a.parentNode)a.parentNode.removeChild(a);
    toast(ok?'复制好了':'这台设备不让自动复制，长按文字选中吧');
  }catch(e){toast('这台设备不让自动复制，长按文字选中吧');}
}
function copyPlain(t){
  try{
    if(window.navigator&&navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){toast('复制好了');},function(){copyPlainOld(t);});
      return;
    }
  }catch(e){}
  copyPlainOld(t);
}
window.msgCopy=function(id){
  var m=window.pinMsg(id);
  if(!m){toast('这条消息已经不在了');closeSheet();return;}
  var t=String(m.text||'').trim();
  if(!t){toast('这条没有文字可复制');return;}
  closeSheet();
  copyPlain(t);
};
/* ---------- 第61单 · 撤回 ----------
   只置 rec 标记、**不删正文**：正文留着，「显示梦角撤回的内容」开关才有东西可显示；
   想彻底清掉走「删除」那条路（撤回 ≠ 删除，两件事别混）。
   ⚠️ 置顶的那条被撤回 → 置顶一起撤：横幅挂着一条已经没有内容的消息比撤回本身更让人困惑。 */
window.msgRecall=function(id){
  var m=window.pinMsg(id);
  if(!m||m.rec)return false;
  if(m.from!=='self')return false;         /* 只能撤自己的 */
  m.rec=1;
  var wasPin=!!(S.pin&&S.pin.id===id);
  if(wasPin)S.pin={id:'',ts:0};
  save();
  if(RT.route==='chat'){window.renderThread();window.renderPin();}
  return true;
};
/* TA 撤回自己刚发的那条：概率 RT.taRecallP（默认 10%），延迟 RT.taRecallD 毫秒后才撤 ——
   先把那条摆出来、再"嗖"地收回去，这才像真的撤回（立刻消失会像是没发出去）。
   两个 RT 变量是留给夹具的旋钮（设 P=1 就必撤、D 调小就不用等）。 */
window.taRecallMaybe=function(m){
  if(!m||m.from!=='other'||m.rec)return false;
  if(S.pin&&S.pin.id===m.id)return false;                 /* 置顶的不撤 */
  /* 第65单 · 概率改成设置项（默认 10）；撤回延迟固定 5 秒 ——
     先把那条摆出来、整整 5 秒后才"嗖"地收回去，太快会像是没发出去。
     ⚠️ RT.taRecallP / RT.taRecallD 是**只给夹具用的**覆盖旋钮：设了就优先，
        不设时一律走用户设置（真人看到的永远是设置页那个值）。 */
  var p=RT.taRecallP;
  if(p==null){
    var rp=(S.settings&&S.settings.recallProb==null)?10:S.settings.recallProb;
    p=Math.max(0,Math.min(100,Math.round(+(rp||0))))/100;
  }
  if(Math.random()>=p)return false;
  var d=(RT.taRecallD==null?5000:RT.taRecallD);
  LATER(function(){
    if(m.rec)return;
    if(S.pin&&S.pin.id===m.id)return;
    m.rec=1;save();
    if(RT.route==='chat')window.renderThread();
  },d);
  return true;
};
/* 删除单条：**只删聊天里这一条**。卡片背后的记录/本体一律不动 ——
   删一条聊天记录顺手把用户几十 MB 的视频或礼物流水清掉，比留着一条打不开的卡片严重得多。 */
window.msgDelSheet=function(id){
  var m=window.pinMsg(id);
  if(!m){toast('这条消息已经不在了');closeSheet();return;}
  var who=window.pinWho(m);
  var isPin=!!(S.pin&&S.pin.id===id);
  var card='';
  if(m.type==='video')card='这张卡片背后的视频本体仍在本机（「设置 → 聊天视频」里还能管理 / 删除）。';
  else if(m.type==='gift')card='这次送礼的记录仍留在「礼物盒」里。';
  else if(m.type==='rp')card='这个红包的流水仍留在「红包」里。';
  openSheet('删除这一条',
    '<div class="msgpv">'+(who?('<span class="msgpv__nm">'+esc(who)+'</span>'):'')+
      '<span class="msgpv__tx">'+esc(window.pinBrief(m))+'</span></div>'+
    '<p style="font-size:calc(13px * var(--fk,1));line-height:1.8;color:var(--ink2);margin-bottom:16px">'+
      '只删聊天里的这一条，别的地方不受影响。'+(card?('<br>'+card):'')+
      (isPin?'<br>这一条正在<b>置顶</b>，删掉后顶部那一条也会一起消失。':'')+
      '<br>删掉就找不回来了。</p>'+
    '<button class="bigbtn bigbtn--danger" data-act="msg-del-do" data-id="'+esc(m.id)+'">确认删除</button>'+
    '<button class="bigbtn bigbtn--ghost" data-act="msg-menu" data-id="'+esc(m.id)+'" style="margin-top:10px">再想想</button>');
};
window.msgDelDo=function(id){
  var i=-1;(S.msgs||[]).forEach(function(x,j){if(x.id===id)i=j;});
  if(i<0){toast('这条消息已经不在了');closeSheet();return;}
  S.msgs.splice(i,1);
  var wasPin=!!(S.pin&&S.pin.id===id);
  if(wasPin)S.pin={id:'',ts:0};
  save();
  closeSheet();
  if(RT.route==='chat'){window.renderThread();window.renderPin();}
  toast(wasPin?'删掉了，置顶也一起取消':'删掉了这一条');
};

/* ---------- 安卓返回键（打包成 App 之后才有，浏览器里整段是空转） ---------- */
/* 为什么必须自己接管：
   ⚠️ **Capacitor 8 的核心完全不处理返回键** —— `BridgeActivity.java` 里既没有 `onBackPressed`、
      也没有 `OnBackPressedCallback`，更不看 `WebView.canGoBack()`。不接管的话，按一下返回键
      就是框架兜底 `finish()` = **直接退出 App**，哪怕当时正开着弹层。
   ⚠️ 本站是**无打包器的静态站**，`Capacitor.Plugins` **恒为空** → 不能用 `Plugins.App.addListener`。
      要走桥底层的**通用通路** `Capacitor.addListener(插件名, 事件名, 回调)`
      （native-bridge 里定义，内部就是 `nativeCallback(插件,'addListener',{eventName})`，不需要打包器）。
   ⚠️ Cordova 的老写法 `document.addEventListener('backbutton', …)` 在这里**静默失效**：
      native-bridge 里那段被 `cap.Plugins.App` 挡着，Plugins 为空 → 只 warn、不注册。别用，也别混用。
   ⚠️ 装了插件但 **JS 不注册监听** 的话，返回键会「有历史才回退、没历史什么都不发生」——
      既失灵又退不出去，比不装更糟。「装了插件」≠「配好了」。 */
/* 返回键的「上一层」映射：多数子页的站内返回按钮本来就是回「更多」，
   这里跟站内口径保持一致，别自作主张一律回聊天（写信写到一半会被吞）。 */
var BACKPARENT={cards:'more',moments:'more',tarot:'more',linktest:'more',shadow:'more',
  calls:'more',gift:'more',redpk:'more',diary:'more',settings:'more',company:'more',
  letter:'more',letterRead:'letter',letterNew:'letter',period:'settings'};
function shellBack(){                      /* 关掉最上面一层；返回 true = 已消费（不要退出 App） */
  var L;
  /* 层序必须按 z-index 走（vidLayer 70 > callLayer 60 > coLayer 55），
     否则「陪伴中来了电话」时返回键会先关掉下面那层，上面那层还杵着。 */
  L=$('vidLayer');  if(L&&L.classList.contains('open')){if(window.closeVidPlay)window.closeVidPlay();return true;}
  L=$('callLayer'); if(L&&L.classList.contains('open')){
    /* 逐态对齐站内按钮：active 抄 call-mini、ring 抄 call-reject、dial 抄 call-hang */
    var c=RT.call;
    if(c&&c.phase==='active'){L.classList.remove('open');if(window.paintMini)paintMini();toast('已收起，点小窗可回到通话');}
    else if(c&&c.phase==='ring'){window.callEnd('reject',0,'in');toast('已拒接');}
    else if(c&&c.phase==='dial'){callCancel();}   /* ⚠️ 它是本分片内的 function 声明、**没挂到 window** → 只能裸调 */
    return true;
  }
  L=$('coLayer');   if(L&&L.classList.contains('open')){window.coFinish('quit');return true;}
  /* 陪伴还在继续、但浮层被收走了（人正在聊天）→ 返回键先带回陪伴，别在这时候退 App */
  if(RT.co&&RT.co.live&&RT.coHide){window.coShowLive();return true;}
  if($('sheet')&&$('sheet').classList.contains('open')){closeSheet();return true;}
  if(RT.panel){closePanel();return true;}
  if(RT.route!=='chat'){go(BACKPARENT[RT.route]||'chat');return true;}
  return false;                            /* 已经在首页：交给 App 真退出 */
}
window.shellBack=shellBack;
/* native-bridge 可能晚于本脚本注入 → 探到 Capacitor 再挂；用 setTimeout 链重试（不加第二处 setInterval）。 */
(function armBack(n){
  var C=window.Capacitor;
  if(C&&typeof C.addListener==='function'){
    C.addListener('App','backButton',function(){
      if(shellBack())return;               /* 关掉了一层 → 不退 */
      C.nativePromise('App','exitApp');     /* 已经在首页 → 真退出（exitApp 内部就是 finish()） */
    });
    return;
  }
  if(n<20)setTimeout(function(){armBack(n+1);},300);
})(0);

/* ---------- 启动 ---------- */
load();
/* 白噪音音频仓对账：**旧档的内联音频搬进 IndexedDB** + 清掉元数据/音频互为孤儿的残档。
   异步跑，不挡首屏；音频本来就在（内联 src 也还能播），搬不搬得动都不影响这一秒的播放。 */
window.nzSync(function(moved){
  if(window.RT&&RT.co&&RT.co.live)coPaintLive();
  window.coNoiseWarm();               /* 把当前这段预先读出来，起播就不用等 IDB */
});
/* 聊天视频对账：① st 与 IDB 实际内容对齐 ② 清媒体仓孤儿键 ③ 没有消息再引用的视频一并回收。
   ⚠️ 导入别人的备份会带来一堆「st=1 但本机没有本体」的元数据，这一步把它们打回 st=0。 */
window.vidSync(function(){ if(RT.route==='chat')renderThread(); });
/* 置顶对账（第28单）：指着一条已经不存在的消息 → 清掉。
   放在 go('chat') 之前，所以首屏那次 renderChat 画出来的横幅已经是「对过账」的那一条。 */
window.pinSync();
window.coNoiseWarm();
paintTheme();
window.paintBub();          /* 气泡大小（第29单）：把档里的值刷成 CSS 变量，首屏就是用户调过的样子 */
window.applyBubCss();       /* 自定义气泡 CSS（第48单）：首屏就把用户写的那段挂上，别等进设置页 */
window.paintFont();         /* 第58单：字体六项也首屏就上（变量缺席 = 原样，所以默认档无变化） */
window.stkWireDrag&&window.stkWireDrag();   /* 第81单：document 级拖拽只装一次，任何网格都生效 */
armPm();
armCallIn();
armLetter();
armGift();
armTarot();
armRp();
armMom();
armCoInvite();      /* 陪伴（第19单）：漏了这句 → coInviteNext 恒为初值 0 → 每次加载立刻补发一张邀请 */
if(S.settings.shadowOn!==false)shadowArm();   /* 碎影（第23单）：排下一次主动留影 */
go('chat');
setInterval(tick,20000);
window.addEventListener('load',function(){
  setTimeout(function(){
    var sp=$('splash');
    if(sp){sp.classList.add('bye');setTimeout(function(){if(sp&&sp.parentNode)sp.style.display='none';},800);}
  },1500);
});
})();

</script>
