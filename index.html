.conz span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;}
.conz i{flex:none;font-style:normal;font-size:calc(10px * var(--fk,1));letter-spacing:1px;color:var(--acc);}
.colive__ops{margin-top:24px;display:flex;flex-direction:column;gap:9px;}
/* 收起浮层去聊天时的左上角小窗：陪伴还在继续，点它回全屏。
   ⚠️ 位置跟 #callMini 一样是 left:14px/top:74px，但 z 比它低 —— 来电时小窗要让路。 */
#coMini{position:absolute;left:14px;top:74px;z-index:56;display:none;align-items:center;gap:7px;
  max-width:250px;padding:7px 12px;border-radius:999px;cursor:pointer;
  background:var(--card);border:1px solid var(--acc-s);box-shadow:var(--sh-s);}
#coMini.open{display:inline-flex;}
#coMini svg{width:13px;height:13px;flex:none;color:var(--acc-d);}
#coMini .cmi__t{font-size:calc(11.5px * var(--fk,1));letter-spacing:.4px;color:var(--ink2);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;}
#coMini .cmi__b{flex:none;font-size:calc(10px * var(--fk,1));letter-spacing:1px;color:var(--acc-d);}
/* 自定义时长：预设之外自己填一个（分钟） */
.cocust{display:flex;align-items:center;gap:7px;width:100%;margin-top:3px;padding-top:9px;
  border-top:1px dashed var(--line);}
.cocust__in{width:74px;padding:6px 9px;border-radius:999px;border:1px solid var(--line);
  background:var(--bg1);color:var(--ink);font-size:calc(12px * var(--fk,1));text-align:center;
  font-variant-numeric:tabular-nums;-moz-appearance:textfield;}
.cocust__in::-webkit-outer-spin-button,.cocust__in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.cocust__u{font-size:calc(11px * var(--fk,1));color:var(--ink3);letter-spacing:.5px;}
/* 记录行尾的删除键：跟 .mini 同款，hover/按下不给整行反应 */
.corow__x{flex:none;padding:4px 9px;font-size:calc(10.5px * var(--fk,1));color:var(--ink3);border-color:var(--line);}
/* ---- 聊天视频（第24单） ---- */
/* 气泡：封面缩略图 + 时长角标 + 播放三角；点一下才开全屏播放层 */
/* ⚠️ 必须写 `.mrow--ta .bub--vid,.mrow--self .bub--vid`（别只写 `.bub--vid`）：
   气泡底色是靠 `.mrow--self .bub`（0,2,0）上的，单类选择器（0,1,0）打不过 ——
   结果就是粉色渐变底照旧、`color:#fff` 照旧，缩略图外面糊一层粉、元数据那行灰字也读不清。
   礼物卡 / 红包卡同样是这个写法（见上面的 `.bub--gift` / `.bub--rp`）。 */
.mrow--ta .bub--vid,.mrow--self .bub--vid{padding:calc(6px*var(--bub-k));background:var(--card);border:1px solid var(--line);
  color:var(--ink);max-width:88%;}
.vidcard{position:relative;display:block;width:calc(208px*var(--bub-k));max-width:100%;padding:0;margin:0;
  border-radius:calc(var(--r-s) - 2px);overflow:hidden;background:transparent;cursor:pointer;}
.vidcard__ph{display:block;width:100%;border-radius:calc(var(--r-s) - 2px);
  background:var(--acc-f);
  background-size:cover;background-position:center;}
.vidcard__pl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;
  background:rgba(255,255,255,.86);color:var(--acc-d);box-shadow:0 3px 10px rgba(74,61,66,.22);pointer-events:none;}
.vidcard__pl svg{width:18px;height:18px;margin-left:2px;}
.vidcard__du{position:absolute;right:7px;bottom:7px;padding:2px 7px;border-radius:999px;
  font-size:calc(10.5px * var(--fk,1));letter-spacing:.4px;color:#fff;background:rgba(74,61,66,.62);pointer-events:none;}
.vidcard__mt{margin-top:6px;font-size:calc(10.5px * var(--fk,1));line-height:1.5;color:var(--ink3);letter-spacing:.3px;word-break:break-all;}
.vidcard.is-gone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  height:117px;color:var(--ink3);background:var(--acc-f);border:1px dashed var(--acc-s);}
.vidcard.is-gone svg{width:22px;height:22px;}
.vidcard.is-gone span{font-size:calc(12px * var(--fk,1));letter-spacing:.6px;}
.vidcard.is-gone em{font-style:normal;font-size:calc(10.5px * var(--fk,1));color:var(--ink3);opacity:.85;padding:0 10px;
  text-align:center;word-break:break-all;}
/* 全屏播放层：在 .app 之外，重绘聊天不会拆掉正在播的 video */
#vidLayer{position:absolute;inset:0;z-index:70;display:none;align-items:center;justify-content:center;
  padding:22px;background:rgba(46,36,40,.92);backdrop-filter:blur(3px);}
#vidLayer.open{display:flex;}
.vidfull{position:relative;width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;}
.vidfull__x{position:absolute;right:-6px;top:-42px;width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:#fff;background:rgba(255,255,255,.16);}
.vidfull__x svg{width:16px;height:16px;}
.vidfull__box{width:100%;border-radius:var(--r);overflow:hidden;background:#000;}
.vidfull__v{display:block;width:100%;max-height:66vh;background:#000;}
.vidfull__hint{padding:52px 16px;text-align:center;font-size:calc(12.5px * var(--fk,1));letter-spacing:1px;color:rgba(255,255,255,.82);}
.vidfull__mt{margin-top:12px;font-size:calc(11.5px * var(--fk,1));letter-spacing:.6px;color:rgba(255,255,255,.72);text-align:center;word-break:break-all;}
/* 设置页 → 聊天视频：一行一段（封面 / 名字 / 时长 / 大小 / 删除） */
.vidrow{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-s);
  background:var(--card);border:1px solid var(--line);margin-bottom:8px;}
.vidrow__ph{flex:none;width:52px;height:38px;border-radius:9px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;color:var(--acc-d);
  background:var(--acc-f);background-size:cover;background-position:center;}
.vidrow__ph svg{width:16px;height:16px;}
.vidrow__ph.has svg{display:none;}
.vidrow__tx{flex:1;min-width:0;font-size:calc(12.5px * var(--fk,1));color:var(--ink);word-break:break-all;}
.vidrow__tx small{display:block;margin-top:3px;font-size:calc(10.5px * var(--fk,1));color:var(--ink3);}
.vidrow__tx small b{color:#c2708b;font-weight:400;}
/* ---- 番茄循环（第18单规格，内嵌「一起学习」） ---- */
/* 场景卡片上的「番茄」徽标 + 发起页那行时长说明 */
.coscene__pm{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:999px;font-style:normal;
  font-size:calc(9.5px * var(--fk,1));letter-spacing:1px;vertical-align:2px;color:var(--acc-d);background:var(--acc-f);border:1px solid var(--acc-s);}
.copomo__hint{width:100%;padding:2px 2px 0;font-size:calc(10.5px * var(--fk,1));line-height:1.6;letter-spacing:.3px;color:var(--ink3);}
/* 番茄参数（编辑场景弹层里的那块） */
.copomo__box{margin-top:10px;padding:10px 12px;border-radius:var(--r-s);background:var(--acc-f);border:1px solid var(--acc-s);}
.copomo__row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.copomo__row:last-of-type{margin-bottom:6px;}
.copomo__row>span{flex:none;width:32px;font-size:calc(12px * var(--fk,1));letter-spacing:.5px;color:var(--ink);}
.copomo__row input.txt{flex:none;width:62px;padding:6px 8px;text-align:center;}
.copomo__row>i{font-style:normal;font-size:calc(10.5px * var(--fk,1));color:var(--ink3);}
.copomo__box .cohint2{margin-top:2px;}
/* 进行态：轮数进度点 + TA 那句「休息/回来」+ 休息态换成绿色调（白噪音照旧在放） */
.copomo{display:flex;gap:7px;justify-content:center;margin:12px 0 0;}
.copomo__d{width:7px;height:7px;border-radius:50%;background:transparent;border:1.5px solid var(--acc-s);}
.copomo__d.on{background:var(--acc);border-color:var(--acc);}
.copomo__d.cur{background:var(--acc);border-color:var(--acc);transform:scale(1.45);}
.copomo__d.cur.is-brk{background:var(--ok);border-color:var(--ok);}
.colive__say{margin-top:10px;font-family:var(--serif);font-size:calc(12.5px * var(--fk,1));line-height:1.7;letter-spacing:1px;color:var(--ink2);}
.colive.is-brk .colive__time{color:var(--ok);}
.colive.is-brk .copomo__d.on{background:var(--ok);border-color:var(--ok);}
/* 时间到 / 延长 / 告别 面板 */
.costage{padding:24px 18px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);}
.costage__t{font-family:var(--serif);font-size:calc(16px * var(--fk,1));line-height:1.8;letter-spacing:1px;color:var(--ink);}
.costage__s{font-size:calc(11.5px * var(--fk,1));line-height:1.7;color:var(--ink3);margin:8px 0 18px;letter-spacing:.5px;}
.coexs{display:flex;gap:8px;justify-content:center;margin-bottom:12px;}
.coex{flex:1;padding:11px 6px;border-radius:var(--r-s);font-size:calc(12px * var(--fk,1));letter-spacing:.5px;
  color:var(--acc-d);background:var(--acc-f);border:1px solid var(--acc-s);}
/* 陪伴消息气泡 */
/* 按钮里的图标必须限尺寸（SVG 默认会撑满） */
.bigbtn svg,.mini svg,.coex svg{width:15px;height:15px;vertical-align:-2px;}
.bigbtn svg{display:inline-block;}
.bub--co{display:flex;align-items:center;gap:8px;font-size:calc(calc(12.5px*var(--bub-k)) * var(--fk,1));letter-spacing:.4px;}
.bub--co svg{width:15px;height:15px;flex:none;opacity:.85;}
/* 管理 / 编辑场景 */
.coicons{display:flex;flex-wrap:wrap;gap:8px;}
.coicon{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;
  color:var(--ink2);background:var(--card);border:1px solid var(--line);}
.coicon svg{width:17px;height:17px;}
.coicon.on{color:var(--on-acc);background:var(--acc);border-color:var(--acc);}
.cosub{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:calc(12px * var(--fk,1));color:var(--ink2);}
.cosub span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* 白噪音库的一行：点整行切成「正在听」，点垃圾桶从库里删掉 */
.nzrow{display:flex;align-items:center;gap:9px;padding:10px 2px;border-bottom:1px dashed var(--acc-f);cursor:pointer;}
.nzrow .nzrow__nm{flex:1;min-width:0;font-size:calc(13px * var(--fk,1));color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nzrow .nzrow__nm small{display:block;font-size:calc(10px * var(--fk,1));color:var(--ink3);margin-top:2px;letter-spacing:1px;}
.nzrow .nzrow__tag{flex:none;font-size:calc(10px * var(--fk,1));letter-spacing:1px;color:var(--acc);}
.nzrow.on .nzrow__nm{color:var(--acc);}
.costage .bigbtn,.cosheet__hd+.bigbtn{margin-top:10px;}
.costage .bigbtn:first-of-type{margin-top:0;}
.cosheet__hd{display:flex;align-items:center;gap:11px;font-size:calc(13px * var(--fk,1));color:var(--ink);margin-bottom:12px;}
.cosheet__tx{font-size:calc(13.5px * var(--fk,1));line-height:1.9;color:var(--ink);font-family:var(--serif);margin-bottom:16px;
  padding:12px 14px;border-radius:var(--r-s);background:var(--acc-f);border:1px solid var(--acc-s);}
/* 文案池编辑 */
.colinerow{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.colinerow .txt{flex:1;min-width:0;}
.colinerow .iconbtn{flex:none;}
.colineadd{display:flex;align-items:center;gap:8px;margin-top:10px;}
.colineadd .txt{flex:1;min-width:0;}
/* 陪伴日记 */
.codiary{display:flex;flex-direction:column;gap:5px;padding:12px 13px;border-radius:var(--r-s);
  background:var(--card);border:1px solid var(--line);margin-bottom:9px;}
.codiary__t{font-size:calc(10.5px * var(--fk,1));letter-spacing:1px;color:var(--acc-d);}
.codiary__b{font-size:calc(12.5px * var(--fk,1));line-height:1.85;color:var(--ink);font-family:var(--serif);}

/* ============ 朋友圈（第4单） ============ */
.momstat{display:flex;gap:10px;padding:14px 16px 4px;}
.momstat__i{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:11px 6px;border-radius:var(--r-s);background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-s);}
.momstat__i b{font-size:calc(17px * var(--fk,1));color:var(--acc-d);font-family:var(--serif);}
.momstat__i span{font-size:calc(10.5px * var(--fk,1));color:var(--ink3);letter-spacing:1px;}
.momnew{display:flex;align-items:center;gap:8px;margin:12px 16px 0;padding:10px 14px;border-radius:999px;
  background:var(--acc-s);border:1px dashed var(--acc);color:var(--acc-d);font-size:calc(12px * var(--fk,1));letter-spacing:.5px;cursor:pointer;}
.momnew svg{width:15px;height:15px;flex:none;}
.momfeed{display:flex;flex-direction:column;gap:11px;padding:12px 16px calc(20px + env(safe-area-inset-bottom));}
.momcard{display:flex;align-items:flex-start;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 14px;box-shadow:var(--sh-s);}
/* 第49单 · 朋友圈背景图 + 动态栏不透明度。
   照片必须挂在 .screen--mom（整屏一层、cover）而不是 .momcard 上 —— 卡片是它的**子元素**，
   半透明时才透得出底下那张照片；挂卡片自己身上等于把图挡在背面，什么也看不见。
   两个变量都由 paintMomBg() 写：没加背景图时**都不写** → background-image:none、卡片回落 --card，
   所以默认档与改动前逐像素一致（`.momcard` 基础规则仍是 var(--card)）。 */
.screen--mom{background-image:var(--mom-bg-layer,none);background-size:cover;background-position:center;}
.screen--mom .momcard{background:var(--mom-fb,var(--card));}
/* ⚠️ 只有「真的加了照片」时才给文字描一圈柔光底 —— 100% 完全透明时卡片压着一张任意照片，
   亮处（月亮/高光）后面的名字和时间会糊成一片（第一版实测就是「梦角」几乎看不见）。
   所以光晕跟着 --mom-fb 一起给：没背景图 ⇒ --mom-fb 缺席 ⇒ text-shadow:0 0 transparent ⇒
   默认档与改动前**逐像素一致**，不会给没照片那档平白加一圈糊边。 */
.screen--mom .momcard__nm,
.screen--mom .momcard__tx,
.screen--mom .momcard__mt,
.screen--mom .momop,
.screen--mom .about{text-shadow:var(--mom-halo,0 0 transparent);}
/* 头像列必须 flex:none + align-self:flex-start，否则会被 align-items 拉伸成整列高（本月踩过） */
.momcard__av{flex:none;align-self:flex-start;line-height:0;}
.momcard__av .mav{flex:none;}
/* 卡片子元素必须先 display:block 定死，否则行内 span 会挤成一行（本项目踩过的坑） */
.momcard__col{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;}
.momcard__hd{display:flex;align-items:center;gap:8px;}
.momcard__nm{font-size:calc(13.5px * var(--fk,1));letter-spacing:.5px;color:var(--acc-d);}
.momcard__mt{flex:1;font-size:calc(10.5px * var(--fk,1));letter-spacing:.5px;color:var(--ink3);}
.momcard__del{flex:none;width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--ink3);}
.momcard__del:active{background:var(--acc-f);color:#d96666;}
.momcard__del svg{width:14px;height:14px;}
.momcard__tx{display:block;font-size:calc(13.5px * var(--fk,1));line-height:1.8;white-space:pre-wrap;word-break:break-word;color:var(--ink);}
.momstk{display:inline-flex;align-items:center;font-size:calc(34px * var(--fk,1));line-height:1;}
.momstk--img img{display:block;max-width:132px;max-height:132px;border-radius:14px;border:1px solid var(--line);}
.momstk--sel{font-size:calc(26px * var(--fk,1));}
.momplace{display:flex;align-items:center;gap:5px;font-size:calc(11px * var(--fk,1));letter-spacing:.5px;color:var(--acc-d);}
.momplace svg{width:13px;height:13px;flex:none;}
/* 第56单 · 朋友圈「点赞条」与「评论条」的**粉色填充框**按用户要求去掉。
   这两块原本都是"带底的圆角块"（点赞条：--acc-f 底 + --acc-s 描边；评论条：--acc-f 底），
   底一去，那圈 11px 内距就只剩"莫名缩进"，所以一并归零 —— 让它们和上面的正文左对齐，
   行距交给 .momcard__col 的 gap:8px。 */
.momlikes{display:flex;align-items:center;gap:6px;font-size:calc(11.5px * var(--fk,1));color:var(--acc-d);}
.momlikes svg{width:14px;height:14px;flex:none;}
.momlikes span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.momlikes b{font-size:calc(11px * var(--fk,1));color:var(--ink3);}
.momcmts{display:flex;flex-direction:column;gap:6px;}
/* ⚠️ `--panel` 是**评论弹层**里那张白卡片（不是动态里那条评论），它必须保住自己的底/描边/内距：
   上面刚把 .momcmts 的内距归零，这里显式补回来 —— 漏了的话弹层里的评论会直接贴到卡片边上。 */
.momcmts--panel{background:var(--card);border:1px solid var(--line);padding:9px 11px;border-radius:12px;}
.momcmt{display:flex;gap:7px;font-size:calc(12px * var(--fk,1));line-height:1.65;color:var(--ink);}
.momcmt b{flex:none;color:var(--acc-d);font-weight:500;}
.momcmt span{flex:1;min-width:0;word-break:break-word;}
.momcmt i{flex:none;font-style:normal;font-size:calc(10px * var(--fk,1));color:var(--ink3);}
.momcard__ops{display:flex;align-items:center;gap:8px;padding-top:4px;border-top:1px dashed var(--acc-f);}
.momop{display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;
  font-size:calc(11.5px * var(--fk,1));letter-spacing:.5px;color:var(--ink2);background:var(--acc-f);border:1px solid var(--line);}
.momop:active{transform:scale(.95);}
.momop svg{width:14px;height:14px;flex:none;}
.momop.on{color:var(--on-acc);background:var(--acc);border-color:transparent;}
.momop i{font-style:normal;font-size:calc(10px * var(--fk,1));color:var(--ink3);}
.momop.on i{color:rgba(255,255,255,.8);}
.momcard__ops .momop:last-child{margin-left:auto;}
.momcount{margin-top:6px;text-align:right;font-size:calc(10.5px * var(--fk,1));letter-spacing:1px;color:var(--ink3);}
.momcount--full{color:#d96666;}
.mompls{display:flex;flex-wrap:wrap;gap:7px;}
.mompl{padding:6px 12px;border-radius:999px;font-size:calc(11.5px * var(--fk,1));letter-spacing:.5px;
  color:var(--ink2);background:var(--card);border:1px solid var(--line);}
.mompl.on{color:var(--on-acc);background:var(--acc);border-color:transparent;}
.mompick{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:10px 13px;
  border-radius:var(--r-s);background:var(--acc-f);border:1px solid var(--acc-s);}
.mompick__lb{flex:1;font-size:calc(11.5px * var(--fk,1));color:var(--ink2);letter-spacing:.5px;}


/* ============ 第17单 · 占卜抽卡（塔罗） ============
   牌面全部纯 CSS 花色渲染，零图片；逆位只在文字上标注，牌面不倒转。 */
.tstage{
  position:relative;overflow:hidden;
  padding:16px 14px 16px;border-radius:var(--r);
  background:#7a5f80;
  color:#fff;box-shadow:var(--sh);
}
.tstage__eb{font-size:calc(10px * var(--fk,1));letter-spacing:3px;color:rgba(255,255,255,.72);}
.tstage__tt{font-family:var(--serif);font-size:calc(17px * var(--fk,1));letter-spacing:1px;margin-top:7px;
  line-height:1.5;word-break:break-word;}
.tstage__sb{font-size:calc(11px * var(--fk,1));letter-spacing:1px;color:rgba(255,255,255,.66);margin-top:6px;}
.tq{display:block;width:100%;margin-top:12px;padding:10px 13px;border-radius:12px;
  font-family:var(--sans);font-size:calc(12.5px * var(--fk,1));color:#fff;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);
  -webkit-appearance:none;appearance:none;}
.tq::placeholder{color:rgba(255,255,255,.52);}
.tq:focus{outline:none;background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.42);}
.dealrow{display:flex;gap:10px;margin-top:15px;}
.deal-slot{flex:1;perspective:900px;}
.card3d{
  position:relative;width:100%;aspect-ratio:5/8;
  transform-style:preserve-3d;
  transition:transform 600ms cubic-bezier(.22,.7,.3,1);
}
.deal-slot.flipped .card3d{transform:rotateY(180deg);}
.card3d .face{
  position:absolute;inset:0;border-radius:11px;overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:grid;place-items:center;
}
.card3d__back{
  background:
    repeating-linear-gradient(45deg,rgba(255,255,255,.14) 0 5px,transparent 5px 10px),
    repeating-linear-gradient(-45deg,rgba(255,255,255,.08) 0 5px,transparent 5px 10px),
    #7a5f80;
  border:1px solid rgba(255,255,255,.26);
}
.card3d__back .sigil{
  width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;
  border:1px solid rgba(255,255,255,.5);
  color:#fff;
}
.card3d__back .sigil svg{width:17px;height:17px;}
.card3d__front{
  transform:rotateY(180deg);
  background:var(--card);border:1px solid var(--line);
  grid-template-rows:1fr auto;
}
/* 牌面：花色符号大字 + 罗马数字/点数角标 + 衬线牌名 + 分隔线 */
.tface{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;width:100%;height:100%;padding:8px 4px;}
.tface__sym{font-size:calc(26px * var(--fk,1));line-height:1;color:var(--acc-d);}
.tface__no{font-size:calc(12px * var(--fk,1));font-weight:600;letter-spacing:1px;color:var(--ink2);}
.tface__nm{font-family:var(--serif);font-size:calc(13px * var(--fk,1));letter-spacing:1px;color:var(--ink);
  text-align:center;line-height:1.4;}
.tface__rule{width:22px;height:1px;background:var(--acc-s);margin-top:3px;}
.tface--violet .tface__sym{color:#937dd2;}
.tface--rose   .tface__sym{color:#e2779a;}
.tface--jade   .tface__sym{color:#5fae8f;}
.tface--sky    .tface__sym{color:#6b99d6;}
.tface--amber  .tface__sym{color:#d99356;}
/* 逆位只在文字上标注：牌面文字绝不倒转 */
.tcap{display:block;width:100%;padding:5px 3px 7px;text-align:center;
  font-size:calc(10.5px * var(--fk,1));font-weight:600;letter-spacing:1px;color:var(--ink2);
  border-top:1px solid var(--line);background:var(--card);}
.tcap.is-rev{color:#d96666;}
.bigbtn--on{background:#7a5f80;margin-top:16px;}
.bigbtn svg{width:15px;height:15px;vertical-align:-2px;margin-right:5px;}
.bigbtn--on.is-off,.bigbtn.is-off{opacity:.45;}
.bigbtn[disabled]{pointer-events:none;opacity:.45;}
/* 牌义列表 */
.meanlist{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
.mean{display:flex;align-items:flex-start;gap:9px;padding:11px 13px;
  border-radius:var(--r-s);background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-s);}
.mean__k{font-family:var(--serif);font-size:calc(13.5px * var(--fk,1));font-weight:600;color:var(--acc-d);flex:none;
  letter-spacing:1px;min-width:28px;}
.mean__v{flex:1;font-size:calc(12.5px * var(--fk,1));line-height:1.6;color:var(--ink2);word-break:break-word;}
.mean__tag{flex:none;align-self:flex-start;padding:2px 8px;border-radius:999px;
  font-size:calc(10.5px * var(--fk,1));font-weight:600;background:var(--acc-f);color:var(--acc-d);}
.mean__tag.is-rev{background:#fbe4e4;color:#d96666;}
/* ---------- 生理期关怀（第20单） ---------- */
.pcrd{margin-top:14px;padding:15px 15px 16px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-s);}
.pcrd__cap{font-size:calc(10px * var(--fk,1));letter-spacing:2px;color:var(--ink3);}
.pcrd__row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;font-size:calc(12.5px * var(--fk,1));color:var(--ink2);}
.pcrd__row+.pcrd__row{border-top:1px dashed var(--line);}
.pcrd__row b{font-size:calc(13px * var(--fk,1));font-weight:600;color:var(--ink);}
.pcrd__big{margin-top:9px;font-family:var(--serif);font-size:calc(20px * var(--fk,1));color:var(--ink);letter-spacing:1px;}
.pcrd__ds{margin-top:5px;font-size:calc(11.5px * var(--fk,1));line-height:1.7;color:var(--ink3);}
.pcrd .bigbtn{margin-top:12px;width:100%;}
.pcal{margin-top:12px;padding:13px 12px 12px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-s);}
.pcal__hd{display:flex;align-items:center;justify-content:space-between;}
.pcal__ym{font-family:var(--serif);font-size:calc(14px * var(--fk,1));letter-spacing:1px;color:var(--ink);}
.pcal__nav{width:36px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--card);
  font-size:calc(17px * var(--fk,1));line-height:1;color:var(--ink2);}
.pcal__wk{display:grid;grid-template-columns:repeat(7,1fr);margin-top:9px;}
.pcal__wk span{text-align:center;font-size:calc(10px * var(--fk,1));color:var(--ink3);letter-spacing:1px;}
.pcal__grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:4px;}
.pcal__d{position:relative;height:38px;border-radius:10px;border:1px solid transparent;background:none;
  font-size:calc(12px * var(--fk,1));color:var(--ink2);}
.pcal__d.is-blank{pointer-events:none;}
.pcal__d.is-period{background:var(--acc-f);border-color:var(--acc-s);color:var(--acc-d);font-weight:600;}
.pcal__d.is-predicted{border:1px dashed var(--acc-s);color:var(--acc-d);}
.pcal__d.is-today{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);}
.pcal__d.is-sel{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:700;}
/* 第59单 · 分割线上方那颗搜索按钮（第68单起是一排四个：搜索 / 主题 / 气泡 / 背景）。
   ⚠️ 第59单修订：按用户要求**去掉边框与白底**（连同投影一起拿掉）。
   ⚠️ 定位从单颗按钮挪到了这一排 .chatduo__acts 上（整排居中于分割线，不是某一颗居中）。 */
.chatduo__acts{
  position:absolute;left:50%;
  /* 第73单 · 图标要对齐**头像的中线**（用户指定）。不能再用 bottom:calc(100%+…) 挂在线上了 ——
     线已经删掉，而且"头像的中线"不等于"整块的中线"：名字在头像下面，所以整块中心比头像中心低
     约 13px。这里以中列为基准，把整排的中心抬到 头像中心 上。 */
    /* 第115单 · 这里原来是手调的 6px（按旧的 14px 名字 / 10px 间距量出来的常数）——单主一改字号/间距就偏。
     实测 7 组（字号×间距）：偏差 ≈ 0.486×间距 + 0.535×字号 + 1.7px，全部点落在 ±0.5px 内，据此换成
     跟随 --nm-gap / --nm-size 的 calc（这两个变量已由 paintTheme **无条件**写在 :root 上）。 */
  top:calc(50% - (var(--nm-gap,18px) * 0.486 + var(--nm-size,10px) * 0.535 + 1.7px));transform:translate(-50%,-50%);
  display:flex;align-items:center;gap:13px;
}
.chatduo__acts button{
  width:30px;height:30px;flex:none;display:flex;align-items:center;justify-content:center;
  background:none;border:0;box-shadow:none;color:var(--acc-d);
  transition:transform .12s ease;
}
.chatduo__acts button:active{transform:scale(.86);}
.chatduo__acts svg{width:18px;height:18px;}   /* 第74单：15 → 18px（用户说图标偏小） */
.cal__sub{font-size:calc(11.5px * var(--fk,1));color:var(--ink3);letter-spacing:.5px;margin:2px 0 8px;}
.pcal__d.is-has{font-weight:600;color:var(--ink);}
.pcal__d.is-has.is-sel{color:var(--on-acc);}
.shit{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;
  padding:10px 12px;border-radius:13px;background:var(--acc-f);border:1px solid transparent;margin-top:8px;}
.shit:active{border-color:var(--acc-s);}
.shit__who{flex:none;font-size:calc(12px * var(--fk,1));color:var(--acc-d);letter-spacing:.5px;padding-top:1px;}
.shit__tx{flex:1;min-width:0;font-size:calc(12.5px * var(--fk,1));line-height:1.6;color:var(--ink);word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.shit__tx b{color:var(--acc-d);font-weight:600;}
.shit__tm{flex:none;font-size:calc(10.5px * var(--fk,1));color:var(--ink3);padding-top:2px;}
/* ===== 第60单 · 消息引用 / 删除 / 多选 ===== */
/* 引用块：在气泡正文**上方**，灰底 + 左竖线 + 小字「引用 X 的消息」+ 原文（一行截断）。
   我方气泡是粉底白字，所以那块用半透明白 + 白系文字，否则在粉底上读不出来。 */
.bub__q{display:flex;flex-direction:column;gap:1px;margin-bottom:7px;padding:5px 9px 6px;
  border-left:3px solid var(--acc-s);border-radius:7px;background:rgba(120,90,105,.055);
  font-size:calc(12px * var(--fk,1));line-height:1.5;cursor:pointer;max-width:100%;}
.bub__q-l{font-size:calc(11px * var(--fk,1));letter-spacing:.3px;color:var(--acc-d);opacity:.92;}
.bub__q-t{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mrow--self .bub__q{background:rgba(255,255,255,.22);border-left-color:rgba(255,255,255,.72);}
.mrow--self .bub__q-l{color:rgba(255,255,255,.86);}
.mrow--self .bub__q-t{color:rgba(255,255,255,.94);}
/* 待引用条：夹在消息流与输入条之间（不碰输入条自身布局） */
.qbar{display:none;align-items:center;gap:8px;margin:0 10px 6px;padding:8px 11px;
  border-radius:15px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-s);}
.qbar.open{display:flex;}
.qbar__l{flex:none;font-size:calc(11px * var(--fk,1));letter-spacing:.3px;color:var(--acc-d);}
.qbar__t{flex:1;min-width:0;font-size:calc(12px * var(--fk,1));color:var(--ink2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.qbar__x{flex:none;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink3);}
.qbar__x svg{width:13px;height:13px;}
/* 点消息弹出的**磨砂浮窗**：半透明白 + 大模糊 + 亮描边（用户点名要"磨砂玻璃的感觉"）。
   ⚠️ 先 .open 再量尺寸 —— 隐藏时 offsetWidth 是 0，位置会算歪（openBubMenu 里有注释）。 */
.bubmenu{position:absolute;z-index:40;display:none;gap:2px;padding:7px 6px;border-radius:19px;
  background:rgba(255,255,255,.60);border:1px solid rgba(255,255,255,.75);
  box-shadow:0 12px 30px rgba(120,80,100,.20),inset 0 1px 0 rgba(255,255,255,.9);
  -webkit-backdrop-filter:blur(16px) saturate(1.7);backdrop-filter:blur(16px) saturate(1.7);}
.bubmenu.open{display:flex;}
.bmm__it{display:flex;flex-direction:column;align-items:center;gap:3px;width:58px;padding:7px 2px;
  border-radius:13px;font-size:calc(11px * var(--fk,1));letter-spacing:.3px;color:var(--ink);}
.bmm__it:active{background:rgba(255,255,255,.72);}
/* 键盘焦点环：浮窗是浮在内容之上的强模态件，没有可见焦点态键盘用户会不知道自己在哪 */
.bmm__it:focus-visible{outline:2px solid var(--acc);outline-offset:1px;background:rgba(255,255,255,.72);}
.bmm__ic{display:flex;}
.bmm__ic svg{width:19px;height:19px;}
.bmm__it--danger{color:#d96666;}
.bmm__it.is-dim{opacity:.38;}
/* 多选：勾号画在行尾（我方那行是 row-reverse，所以自动落到左边）；选中的气泡描一圈 --acc */
.selbar{display:none;align-items:center;gap:10px;padding:9px 14px;
  background:var(--card);border-top:1px solid var(--line);}
.selbar.open{display:flex;}
.selbar__n{flex:1;font-size:calc(13px * var(--fk,1));color:var(--ink);}
.selbar__del{border-style:solid;border-color:var(--acc);color:var(--acc-d);}
.selbar__del.is-off{opacity:.45;}
#threadEl.selmode .mrow,#threadEl.selmode .msys{cursor:pointer;}
#threadEl.selmode .mrow::after{content:'';width:20px;height:20px;flex:none;align-self:center;border-radius:50%;
  border:1.5px solid var(--acc-s);background:var(--card) no-repeat center/12px 12px;}
#threadEl.selmode .mrow.sel::after{border-color:var(--acc);background-color:var(--acc);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'><path d='m5 12.5 4.5 4.5L19 7.5'/></svg>");}
#threadEl.selmode .mrow .bub{box-shadow:0 0 0 2px var(--acc-s),var(--sh-s);}
#threadEl.selmode .mrow.sel .bub{box-shadow:0 0 0 2px var(--acc),var(--sh-s);}
.plegend{display:flex;gap:14px;margin-top:10px;}
.plegend__i{display:flex;align-items:center;gap:5px;font-size:calc(10.5px * var(--fk,1));color:var(--ink3);}
.plegend__sw{width:14px;height:14px;border-radius:5px;display:inline-block;}
.plegend__sw.is-period{background:var(--acc-f);border:1px solid var(--acc-s);}
.plegend__sw.is-predicted{border:1px dashed var(--acc-s);}
.plegend__sw.is-today{border:1px solid var(--acc);}
.pdpanel{margin-top:12px;padding:14px 15px 15px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-s);}
.pdpanel__t{font-family:var(--serif);font-size:calc(14.5px * var(--fk,1));letter-spacing:1px;color:var(--ink);}
.pdpanel__ds{font-size:calc(11.5px * var(--fk,1));line-height:1.7;color:var(--ink3);margin-top:5px;}
.pdpanel__lb{font-size:calc(10px * var(--fk,1));letter-spacing:2px;color:var(--ink3);margin:12px 0 7px;display:block;}
.pdpanel .bigbtn{margin-top:12px;width:100%;}
.psyms{display:flex;flex-wrap:wrap;gap:7px;}
.psym{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  font-size:calc(12px * var(--fk,1));color:var(--ink2);}
.psym.is-on{background:var(--acc-f);border-color:var(--acc-s);color:var(--acc-d);font-weight:600;}
.pflows{display:flex;gap:6px;}
.pflow{flex:1;padding:7px 0;border-radius:9px;border:1px solid var(--line);background:var(--card);
  font-size:calc(11px * var(--fk,1));color:var(--ink2);}
.pflow.is-on{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:600;}
.plrow{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.plrow .txt{flex:1;}
.plrow .mini{flex:none;}

/* ---------- 碎影（第23单） ---------- */
.shsearch{margin:12px 0 10px;}
.shsearch .txt{width:100%;box-sizing:border-box;}
.shlist{display:block;}
.shcard{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:10px 12px;margin-bottom:8px;cursor:pointer;}
.shcard__top{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
.shcard__tm{font-size:calc(11px * var(--fk,1));color:var(--ink3);}
.shcard__fav{font-size:calc(10.5px * var(--fk,1));color:var(--acc-d);background:var(--acc-f);border-radius:999px;padding:2px 8px;}
.shcard__pv{display:block;font-size:calc(13px * var(--fk,1));line-height:1.7;color:var(--ink);}
.shcard__mo{display:block;font-size:calc(11.5px * var(--fk,1));color:var(--ink3);margin-top:4px;}
.shempty{font-size:calc(12px * var(--fk,1));line-height:1.9;color:var(--ink3);text-align:center;padding:26px 8px;}
.shback{display:inline-flex;align-items:center;gap:4px;margin:14px 0 4px;background:none;border:none;
  font-size:calc(12.5px * var(--fk,1));color:var(--ink2);cursor:pointer;}
.shback svg{width:14px;height:14px;}
.shdt{padding:4px 0 0;}
.shdt__tm{font-size:calc(11px * var(--fk,1));color:var(--ink3);letter-spacing:1px;margin-bottom:12px;}
.shblk__t{font-size:calc(11px * var(--fk,1));color:var(--ink3);letter-spacing:2px;margin:14px 0 8px;}
.shexs{display:block;}
.shex{display:block;margin-bottom:9px;}
.shex__who{display:block;font-size:calc(11px * var(--fk,1));color:var(--ink3);margin-bottom:2px;}
.shex__tx{display:block;font-size:calc(13.5px * var(--fk,1));line-height:1.75;color:var(--ink);
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 11px;}
.shex--me .shex__tx{background:var(--acc-f);border-color:transparent;}
.shcards{display:flex;flex-wrap:wrap;gap:6px;}
.shcard__c{font-size:calc(12px * var(--fk,1));color:var(--acc-d);background:var(--acc-f);border-radius:999px;padding:4px 10px;}
.shmood{font-size:calc(13px * var(--fk,1));line-height:1.8;color:var(--ink2);}
.shacts{display:flex;gap:8px;margin:18px 0 4px;}
.shacts .bigbtn{flex:1;}
/* 聊天流里的碎影卡（系统投递，居中） */
.mrow--shadow{display:block;text-align:center;margin:12px 0;}
.shm{display:inline-block;max-width:88%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:11px 13px;cursor:pointer;box-shadow:0 1px 0 rgba(0,0,0,.02);}
.shm__hd{display:flex;align-items:center;gap:5px;font-size:calc(11px * var(--fk,1));color:var(--acc-d);letter-spacing:2px;margin-bottom:6px;}
.shm__hd svg{width:13px;height:13px;}
.shm__pv{display:block;font-size:calc(13px * var(--fk,1));line-height:1.75;color:var(--ink);white-space:pre-wrap;}
.shm__mo{display:block;font-size:calc(11.5px * var(--fk,1));color:var(--ink3);margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);}
.shm--gone{display:inline-block;font-size:calc(12px * var(--fk,1));color:var(--ink3);background:none;border:1px dashed var(--line);
  border-radius:var(--r);padding:8px 14px;}

/* ---------- 链接测试（第23单） ---------- */
.lktip{font-size:calc(12.5px * var(--fk,1));line-height:1.9;color:var(--ink2);}
.lkqlist{margin-top:10px;}
.lkq{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:10px 12px;margin-bottom:8px;cursor:pointer;}
.lkq__nm{display:block;font-size:calc(13.5px * var(--fk,1));color:var(--ink);line-height:1.6;}
.lkq__meta{display:block;font-size:calc(11px * var(--fk,1));color:var(--ink3);margin-top:3px;}
.lkh{display:grid;grid-template-columns:0.9fr 1fr 1fr;gap:8px;align-items:center;
  font-size:calc(12.5px * var(--fk,1));color:var(--ink2);margin-bottom:8px;}
.lkh--head{font-size:calc(11px * var(--fk,1));color:var(--ink3);letter-spacing:1px;margin-bottom:10px;}
button.lkh{text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:9px 11px;cursor:pointer;}
.lkback{display:inline-flex;align-items:center;gap:4px;margin-top:14px;background:none;border:none;
  font-size:calc(12.5px * var(--fk,1));color:var(--ink2);cursor:pointer;}
.lkback svg{width:14px;height:14px;}
.lklabel{font-size:calc(11px * var(--fk,1));color:var(--ink3);letter-spacing:2px;}
.lkscore{font-size:calc(clamp(54px,18vw,78px) * var(--fk,1));font-weight:800;color:var(--acc-d);line-height:1.1;}
.lkmeta{font-size:calc(13px * var(--fk,1));color:var(--ink2);margin-top:2px;}
.lkrare{font-size:calc(12px * var(--fk,1));line-height:1.8;color:var(--ink3);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);}
.lkmoods{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.lkmood{display:inline-block;font-size:calc(12px * var(--fk,1));color:var(--acc-d);background:var(--acc-f);border-radius:999px;padding:4px 10px;}
.lkd{position:relative;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;}
.lkd__q{display:block;font-size:calc(13px * var(--fk,1));color:var(--ink);line-height:1.6;margin-bottom:6px;padding-right:52px;}
.lkd__col{display:block;font-size:calc(12px * var(--fk,1));color:var(--ink3);line-height:1.7;}
.lkd__col b{font-weight:600;color:var(--ink2);margin-left:4px;}
.lkst{position:absolute;top:10px;right:12px;font-size:calc(11px * var(--fk,1));font-weight:600;border-radius:999px;padding:2px 8px;}
.lkst.ok{background:rgba(115,184,130,.18);color:#35754a;}
.lkst.no{background:rgba(226,126,145,.16);color:#a6475c;}
.lkdempty{font-size:calc(12px * var(--fk,1));line-height:1.9;color:var(--ink3);text-align:center;padding:14px 8px;
  border:1px dashed var(--line);border-radius:var(--r);}


/* 解读卡 */
.cardbox{margin-top:14px;padding:14px 14px 15px;border-radius:var(--r);
  background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-s);}
.cardbox__t{display:flex;align-items:center;gap:8px;
  font-family:var(--serif);font-size:calc(14px * var(--fk,1));letter-spacing:1.5px;color:var(--ink);margin-bottom:9px;}
.trtext{font-size:calc(13px * var(--fk,1));line-height:1.85;color:var(--ink);word-break:break-word;}
.trsrc{margin-left:auto;padding:1px 8px;border-radius:999px;font-size:calc(10.5px * var(--fk,1));font-weight:600;
  background:var(--acc-f);color:var(--ink2);letter-spacing:.5px;flex:none;}
.trsrc.is-ai{background:var(--acc-s);color:var(--acc-d);}
.hintline{margin-top:11px;font-size:calc(11px * var(--fk,1));line-height:1.7;color:var(--ink3);letter-spacing:.3px;}
.cardbox .bigbtn{margin-top:12px;}
/* 历史列表 */
.trlist{display:flex;flex-direction:column;margin-bottom:12px;}
.trrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:11px 0;border-bottom:1px solid var(--line);background:none;color:inherit;}
.trrow:last-child{border-bottom:none;}
.trrow__bd{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px;}
.trrow__t{font-size:calc(13px * var(--fk,1));color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.trrow__s{font-size:calc(10.5px * var(--fk,1));color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.trrow__tm{flex:none;font-size:calc(10.5px * var(--fk,1));color:var(--ink3);white-space:nowrap;}
.cardbox .bigbtn--ghost{margin-top:0;}
/* 聊天流里的每日一牌卡：自带底色，不跟气泡一起翻色 */
.bub--tarot{background:none;padding:0;box-shadow:none;border:none;}
.tmsg{display:flex;flex-direction:column;gap:6px;width:min(76vw,268px);
  padding:12px 14px;border-radius:var(--r-s);
  background:#7a5f80;
  color:#fff;border:1px solid rgba(255,255,255,.2);}
.tmsg__hd{display:flex;align-items:center;gap:6px;}
.tmsg__ic{display:grid;place-items:center;color:rgba(255,255,255,.85);}
.tmsg__ic svg{width:13px;height:13px;}
.tmsg__k{font-size:calc(10px * var(--fk,1));letter-spacing:2px;color:rgba(255,255,255,.78);}
.tmsg__ori{margin-left:auto;padding:1px 8px;border-radius:999px;font-size:calc(10.5px * var(--fk,1));font-weight:600;
  background:rgba(255,255,255,.22);}
.tmsg.is-rev .tmsg__ori{background:rgba(217,102,102,.75);}
.tmsg__nm{font-family:var(--serif);font-size:calc(16px * var(--fk,1));letter-spacing:1px;font-weight:600;}
.tmsg__kw{font-size:calc(10.5px * var(--fk,1));color:rgba(255,255,255,.76);letter-spacing:.5px;}
.tmsg__tx{font-size:calc(12.5px * var(--fk,1));line-height:1.72;color:rgba(255,255,255,.94);word-break:break-word;}
/* ===================== 第62单 · 全站去框线 =====================
   用户要求：**所有框框的边框线和虚线都去掉**（只留聊天输入框）。
   为什么写成一条总规则、而不是去删那 178 处 border 声明：
     ① 178 处手删必漏（新加的还会再长出来），一条规则是"永久覆盖"；
     ② ⚠️ 用 `border-color:transparent` 而**不是** `border:none` —— 宽度还在，所以
        **布局一毫米没动**（改成 none 会让每个盒子各缩 1~2px，整站跟着挪）。
   ⚠️ 行与行之间的分隔线也是线，同样被这条吃掉 —— 用户要的就是"一条线都不要"；
      卡片现在靠底色和留白分区（这也是"扁平"该有的样子）。
   白名单只留**不是"框"、而是功能记号**的那几处：勾选看不见 / 引用块没左线 /
   取色井没边界 / 主题色块分不出选中了没 —— 这些隐掉就是把功能弄坏，不是变干净。 */
#phone *,#phone *::before,#phone *::after{border-color:transparent;}
#phone .composer__input{border-color:var(--line);}                   /* 聊天输入框：用户点名保留 */
#phone .composer__input:focus{border-color:var(--acc);}
#phone .bub__q{border-left-color:var(--acc-s);}                      /* 引用块左侧那条竖线 = 引用语义 */
#phone .mrow--self .bub__q{border-left-color:rgba(255,255,255,.72);}
#phone .cwell,#phone .accwell,#phone .accwell input[type=color]{border-color:var(--line);}
#phone #threadEl.selmode .mrow::after{border-color:var(--acc-s);}    /* 多选勾选圈 */
#phone #threadEl.selmode .mrow.sel::after{border-color:var(--acc);}
#phone .sw.on{border-color:var(--acc-d);}                            /* 主题色块：选中的那一圈 */
#phone .pcal__d.is-today{border-color:var(--acc);}
#phone .pcal__d.is-sel{border-color:var(--acc);}
#phone .pcal__d.is-period{border-color:var(--acc-s);}
#phone .pcal__d.is-predicted{border-color:var(--acc-s);}
#phone .dmo.on,#phone .dwe.on{border-color:var(--acc);}
#phone .coscene.on,#phone .cotime.on,#phone .coicon.on{border-color:var(--acc);}
#phone .copomo__d.on,#phone .copomo__d.cur,#phone .copomo__d.cur.is-brk{border-color:inherit;}
#phone .ltit--un,#phone .gftrow--un,#phone .rprow--un{border-color:var(--acc);}
#phone .psym.is-on,#phone .pflow.is-on{border-color:var(--acc-s);}
#phone .pokeit.is-def,#phone .pokegrid__op.is-on{border-color:var(--acc);}
#phone .selbar__del{border-color:var(--acc);}
#phone .shit:active{border-color:var(--acc-s);}
/* 键盘可达性：输入控件的**焦点环**保留（只在聚焦时出现，不影响静态外观） */
#phone .num:focus,#phone .txt:focus,#phone .cssarea:focus,
#phone .field input:focus,#phone .field textarea:focus,#phone .field select:focus{border-color:var(--acc);}
#phone .cssarea:focus{border-style:solid;}
#phone .tq:focus{border-color:rgba(255,255,255,.42);}

/* ===== 第73单 · 顶栏（按用户给的图）=====
   ① 删掉两人之间那条分割线（连心形一起）；② 名字小一点；③ 名字与头像拉开距离；
   ④ 名字在头像下方居中；⑤ 中间那排图标对齐**头像中线**。
   ⚠️ 必须写在**文件末尾**：这几条要覆盖 .chatduo__side / .chatduo__nm 的原有声明，
      而它们在文件中部（94/161 行）——放在前面会被后者盖掉（第一版就是这么没生效的）。 */
.chatduo__mid::before{display:none;}
/* 第105单 · 顶栏名字与间距改成**可调**（与消息头像 --av-s 同一套做法）：
   设置里的两个滑轮写成 --nm-size / --nm-gap；第114单 · 回退值跟随单主定下的默认 10px / 18px。 */
.chatduo__side{gap:var(--nm-gap,18px);align-items:center;}
.chatduo__nm{font-size:calc(var(--nm-size,10px) * var(--fk,1));letter-spacing:1.2px;}
/* 第113单 · 聊天顶栏那四个图标（搜索 / 主题 / 气泡 / 背景，都在 .chatduo__acts 里）
   颜色对齐「更多」页的 .tile__ic：同样走主题色本身 --acc + opacity .92，不再用被强制压深的 --acc-d。
   同样必须写在**文件末尾**才压得住前面 .chatduo__acts 的声明（同第73单那条的理由）。 */
.chatduo__acts .csearch,.chatduo__acts .cicon{color:var(--acc);opacity:.92;}
/* 第122单 · 图片消息气泡：等比铺开（宽高由画面本身 + aspect-ratio 决定），上限 200×240，绝不裁切。
   单张图比贴图大得多，但也不占满整屏（列表里还要看得到上下文）。 */
.bub--img{padding:6px;overflow:hidden;}
.msimg{display:block;width:auto;height:auto;max-width:200px;max-height:240px;border-radius:12px;}
/* 第123单 · 朋友圈动态里的图片 / 视频：图片等比铺开（上限比聊天里大），视频卡复刻聊天那张的观感 */
.momimg{margin-top:8px;max-width:100%;border-radius:14px;overflow:hidden;}
.momimg img{display:block;width:100%;height:auto;max-height:320px;object-fit:cover;border-radius:14px;}
.momvid{margin-top:8px;display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;
  background:var(--card);border:1px solid var(--line);color:var(--ink);}
.momvid__pl{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;
  background:var(--acc);color:var(--on-acc);}
.momvid__pl svg{width:14px;height:14px;}
.momvid__du{font-size:calc(12px * var(--fk,1));color:var(--ink2);letter-spacing:.5px;}
.mompick__im{display:block;max-width:120px;max-height:120px;border-radius:10px;margin-top:4px;}
.mompick__vd{font-size:calc(12.5px * var(--fk,1));color:var(--ink2);}
/* ===== 第76单 · 朋友圈改版 =====
   封面块（微信式）：顶部一张大图，头像+名字压在下沿右侧；点封面换图。
   整页背景仍是 .screen--mom 的 --mom-bg-layer（第49单），两者互不干扰。 */
/* 第77单 · 顶栏透明并浮在封面上（**不用改标记**，靠这个更具体的选择器就够）：
   绝对定位 → 不占流，封面于是顶到屏幕最上方；底色透明 → 封面透上来。 */
.screen--mom .body-scroll{padding-top:0;}   /* 第77单：封面顶到屏幕最上沿（不然顶上留 14px 空条） */
/* 第107单 · 标题删掉后（第100单）两个键落到了左边：.bar 是 flex 且没有 justify-content，
   原来靠 .bar__title 的 flex:1 把它们顶到右侧。这里显式靠右，两个键（消息提醒 / 发布）回到右上角。 */
.screen--mom .bar{position:absolute;left:0;right:0;top:0;background:none;border-bottom:0;z-index:3;justify-content:flex-end;}
/* 第78单 · 顶栏那两个键**去掉白底框**：底色/投影/描边全拿掉，改成白色线描 + 投影直接压在封面上 */
.screen--mom .bar .iconbtn{background:none;box-shadow:none;border:0;color:#fff;filter:drop-shadow(0 1px 5px rgba(0,0,0,.5));}
.screen--mom .bar .bar__title{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5);}
.momcover{position:relative;height:240px;flex:none;background-color:var(--acc-s);background-size:cover;background-position:center;cursor:pointer;}
.momcover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.22));pointer-events:none;}
.momcover__who{position:absolute;right:14px;bottom:-26px;z-index:2;display:flex;align-items:flex-end;}
/* 第77单 · 名字挪到封面**内部**：右对齐、落在分割线上方那块背景上，离头像留 82px */
.momcover__nm{position:absolute;right:82px;bottom:14px;z-index:2;font-family:var(--serif);font-size:calc(17px * var(--fk,1));letter-spacing:1px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.45);}
.momcover__who .mav{border:2px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.22);}
.screen--mom .momstat{margin-top:34px;}
.momnotif__b{position:absolute;top:-3px;right:-3px;min-width:15px;height:15px;padding:0 3px;border-radius:999px;
  background:#e2564f;color:#fff;font-size:calc(10px * var(--fk,1));line-height:15px;font-style:normal;text-align:center;}
.mommsg{display:flex;flex-direction:column;gap:2px;}
.mommsg__it{display:flex;align-items:center;gap:9px;padding:10px 2px;text-align:left;}
.mommsg__ic{flex:none;color:var(--acc-d);}
.mommsg__ic svg{width:16px;height:16px;}
.mommsg__tx{flex:1;min-width:0;font-size:calc(12.5px * var(--fk,1));line-height:1.55;color:var(--ink);}
.mommsg__tx b{color:var(--acc-d);margin-right:4px;}
.mommsg__tm{flex:none;font-size:calc(10.5px * var(--fk,1));color:var(--ink3);}
/* ===== 第80单 · 长按拖拽排序 =====
   拖动中那一格放大一点、加投影、描一圈 --acc；容器进入 dragbox 时**禁掉滚动与文本选择**
   （不然拖到一半整页跟着滚，或者弹出系统长按菜单）。 */
.dragbox{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grabbing;}
.stk-tile.drag-on,.stktab.drag-on{opacity:.88;transform:scale(1.07);z-index:5;position:relative;
  box-shadow:0 8px 20px rgba(120,80,100,.28);outline:2px solid var(--acc);}
.stk-tile,.stktab{-webkit-touch-callout:none;}
/* ===== 第81单 · 跟手拖拽 ===== */
.stk-ph{border-radius:14px;border:2px dashed var(--acc);background:var(--acc-f);opacity:.75;box-sizing:border-box;}
.stk-ph--tab{border-radius:999px;height:34px!important;}
.stk-tile.drag-on,.stktab.drag-on{opacity:.94;transform-origin:center;box-shadow:0 12px 26px rgba(120,80,100,.32);
  outline:2px solid var(--acc);border-radius:14px;background:var(--card);}
html.dragging{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:contain;}
.stk-tile,.stktab{-webkit-touch-callout:none;}
/* ===== 第91单 · 朋友圈封面头像 = 微信式圆角方形 =====
   容器与内部 img/svg 都要给圆角：只改容器的话，里面的图片仍是圆的（.mav img 自己带 50%）。 */
.momcover__who .mav,.momcover__who .mav img,.momcover__who .mav svg{border-radius:9px;}
.momcover__who .mav{overflow:hidden;}
/* ===== 第94单 · 头像放大 + 头像与动态之间的空隙 =====
   ⚠️ 这空隙原来靠 .momstat 的 margin-top 撑（第79单），第91单把统计方框删了 → 撑的东西没了 → 头像压到动态上。
      现在挂在**列表容器的顶部内距**上：跟随内容、和头像的下沿外挂（-26px）配套。 */
/* 第95单 · 空隙改挂"封面之后第一个内容块"（原来挂在滚动容器顶部内距上，封面进来后会把封面顶下去） */
.screen--mom .body-scroll>.momfeed,.screen--mom .body-scroll>.momnew{margin-top:52px;}
.momcover__who .mav{width:72px !important;height:72px !important;}
.momcover__who .mav img,.momcover__who .mav svg{width:100%;height:100%;}
/* ===== 第95单 · 下滑收起封面，过封面后标题栏实体化 =====
   悬浮态（默认）＝透明、标题与图标白色带投影；实体态（is-solid）＝页面底色 + 下边线 + 正常配色。
   顶栏始终是 absolute 挂在屏幕顶部，所以消息提醒/发布键位置不动、永远可见。 */
.screen--mom .bar{transition:background-color .18s ease;}
.screen--mom .bar.is-solid{background:var(--bg1);border-bottom:1px solid var(--line);}
.screen--mom .bar.is-solid .bar__title{color:var(--ink);text-shadow:none;}
.screen--mom .bar.is-solid .iconbtn{color:var(--acc-d);filter:none;}
</style>
</head>
<body>

<div id="phone">
  <div id="app"></div>
  <div id="tabbar" class="tabbar"></div>
  <div id="sheetMask" data-act="sheet-close"></div>
  <div id="sheet" role="dialog" aria-modal="true"><div class="sheet__hd"><span id="sheetTitle" style="flex:1"></span><button class="iconbtn" data-act="sheet-close" aria-label="关闭弹层">✕</button></div><div class="sheet__bd" id="sheetBody"></div></div>
  <div id="splash" aria-hidden="true">
    <div class="sp-card">
      <div class="sp-orbit">
        <span class="ring r1"></span><span class="ring r2"></span>
        <span class="dot dot--a"></span><span class="dot dot--b"></span>
        <span class="halo"></span>
        <span class="mascot" id="splashMascot"></span>
      </div>
      <div class="sp-en">Loading</div>
      <div class="sp-title">梦角</div>
      <div class="sp-sub">字 卡 传 讯</div>
      <div class="sp-track"><i></i></div>
      <div class="sp-build">Building World · 构建世界</div>
    </div>
  </div>
  <div id="callLayer" aria-hidden="true"></div>
  <div id="coLayer" aria-hidden="true"></div>
  <div id="coMini" data-act="co-back" aria-hidden="true" role="button" aria-label="回到陪伴"></div>
  <div id="coTrans" aria-hidden="true"></div>
  <div id="vidLayer" aria-hidden="true"></div>
  <!-- 第44单：折叠小标。时间为 mm:ss（默认占位 00:00，ico('hangup') 在 paintMini 里填进挂断键） -->
  <div id="callMini" aria-hidden="true"><span class="cm__tx" id="cmTx">00:00</span><button class="cm__x" data-act="call-hang" aria-label="挂断通话"></button></div>
  <div id="toast" role="status"></div>
</div>

<script>
/* ================= 梦角 · 核心：工具 / 图标 / 存储 ================= */
(function(){
'use strict';

/* ---------- 短工具 ---------- */
window.$=function(id){return document.getElementById(id);};
window.$$=function(sel){return Array.prototype.slice.call(document.querySelectorAll(sel));};
window.esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
window.uid=function(p){return (p||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);};
window.ri=function(a,b){return a+Math.floor(Math.random()*(b-a+1));};
window.p2=function(n){return (n<10?'0':'')+n;};
window.fmtT=function(ts){var d=new Date(ts);return p2(d.getHours())+':'+p2(d.getMinutes());};
window.fmtD=function(ts){var d=new Date(ts);return (d.getMonth()+1)+'月'+d.getDate()+'日';};

   牌只存「名字 + 关键词 + 是否逆位」的快照 —— 以后牌库怎么改，旧记录都不跟着变。 */
function normTarotRec(raw){
  if(!raw||typeof raw!=='object')return null;
  var cards=(Array.isArray(raw.cards)?raw.cards:[]).map(function(c){
    if(!c||typeof c!=='object')return null;
    return {name:String(c.name||'').slice(0,24),kw:String(c.kw||'').slice(0,24),rev:!!c.rev};
  }).filter(Boolean).slice(0,3);
  if(!cards.length)return null;                 /* 没有牌的记录等于没记录 */
  var ts=(+raw.ts>0)?+raw.ts:Date.now();
  return {id:(typeof raw.id==='string'&&raw.id)?raw.id:uid('tr'),
    q:String(raw.q==null?'':raw.q).slice(0,TAROT_Q_MAX),
    cards:cards,
    reading:String(raw.reading==null?'':raw.reading).slice(0,4000),
    src:raw.src==='ai'?'ai':'local',
    mode:(+raw.mode===3)?3:1,
    ts:ts,day:String(raw.day||''),time:String(raw.time||'')};
}
/* 占卜史：坏档丢坏留好，上限 50（满了从头部丢最旧），最新在最后 */
function normTarot(raw){

  return raw.map(normTarotRec).filter(Boolean).slice(-TAROT_CAP);

     ③ 没配好或传失败一律**回落本地 base64**（功能不残），并 toast 把失败原因说出来。 */
window.ossRegionOf=function(ep){
  var m=/^oss-([a-z0-9-]+)\.aliyuncs\.com$/i.exec(String(ep||'').trim());
  return m?m[1]:'';
};
window.ossReady=function(){
  var s=(window.S&&S.settings)||{};
  return !!(s.ossOn&&s.ossEndpoint&&s.ossBucket&&s.ossKey&&s.ossSecret
    &&window.ossRegionOf(s.ossEndpoint)&&window.crypto&&window.crypto.subtle);
};
window.ossHost=function(){
  var s=S.settings;
  return 'https://'+s.ossBucket+'.'+s.ossEndpoint+'/';
};
function ossHex(b){var o='',i;for(i=0;i<b.length;i++)o+=('0'+b[i].toString(16)).slice(-2);return o;}
async function ossHmac(key,msg){
  var k=await crypto.subtle.importKey('raw',key,{name:'HMAC',hash:'SHA-256'},false,['sign']);
  return new Uint8Array(await crypto.subtle.sign('HMAC',k,new TextEncoder().encode(msg)));
}
/* OSS V4 签名。payload 用 UNSIGNED-PAYLOAD：省掉把整张图先哈希一遍（大图能省几百毫秒）。 */
window.ossSign=async function(method,key,contentType,date,region,ak,sk){
  var enc=new TextEncoder();
  var canon=[
    method,
    '/'+key,
    '',                                                   /* 查询串：我们不带参数 */
    'content-type:'+contentType+'\n'+
    'x-oss-content-sha256:UNSIGNED-PAYLOAD\n'+
    'x-oss-date:'+date+'\n',
    'content-type;x-oss-content-sha256;x-oss-date',       /* 参与签名的头（字典序） */
    'UNSIGNED-PAYLOAD'
  ].join('\n');
  var canonHash=ossHex(new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode(canon))));
  var scope=date.slice(0,8)+'/'+region+'/oss/aliyun_v4_request';
  var sts='OSS4-HMAC-SHA256\n'+date+'\n'+scope+'\n'+canonHash;
  var kD=await ossHmac(enc.encode('aliyun_v4'+sk),date.slice(0,8));
  var kR=await ossHmac(kD,region);
  var kS=await ossHmac(kR,'oss');
  var kK=await ossHmac(kS,'aliyun_v4_request');
  return 'OSS4-HMAC-SHA256 Credential='+ak+'/'+scope+',Signature='+ossHex(await ossHmac(kK,sts));
};
/* 把一张图 PUT 上去；cb(url, err) —— 成功给完整 URL，失败给错误文本（尽量把 OSS 的响应体带上） */
window.ossPut=function(blob,cb){
  var s=S.settings,region=window.ossRegionOf(s.ossEndpoint);
  var ext=(blob.type&&blob.type.indexOf('png')>=0)?'png':'jpg';
  var key=(s.ossPrefix||'')+Date.now().toString(36)+Math.random().toString(36).slice(2,7)+'.'+ext;
  var ct=blob.type||'image/jpeg';
  var date=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z');
  var url=window.ossHost()+key;
  window.ossSign('PUT',key,ct,date,region,s.ossKey,s.ossSecret).then(function(auth){
    return fetch(url,{method:'PUT',headers:{'Content-Type':ct,'x-oss-date':date,
      'x-oss-content-sha256':'UNSIGNED-PAYLOAD','Authorization':auth},body:blob});
  }).then(function(r){
    if(r&&r.ok){cb(url,'');return;}
    /* ⚠️ 错误正文要用**它返回的那个 Promise**（`r.text()` 是异步的）——
       第一版写成 `String(r.text())`，把 Promise 当字符串了，于是永远落到 catch、
       提示变成「String(...).then is not a function」，403 的正文一个字都拿不到。 */
    var p=(r&&r.text)?r.text():null;
    return Promise.resolve(p).then(function(t){
      var clean=String(t==null?'':t).replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,140);
      cb('','HTTP '+(r&&r.status)+' '+clean);
    },function(){cb('','HTTP '+(r&&r.status));});
  },function(e){cb('',(e&&e.message)||'签名失败');})
   ['catch'](function(e){cb('',(e&&e.message)||'网络错误');});
};
/* 统一图片出口：**所有上传都走这里** —— 配好 OSS 就先传，成了交 URL；没配/失败回落本地 base64。
   调用方拿到的可能是 dataURL 也可能是 https URL，两者在渲染层是同一条路（CSS url()/img src）。 */
window.storeImage=function(localDataUrl,cb){
  if(!window.ossReady()){cb(localDataUrl,'');return;}
  try{
    var b64=String(localDataUrl).split(',')[1]||'',bin=atob(b64),n=bin.length,
        buf=new Uint8Array(n),i;
    for(i=0;i<n;i++)buf[i]=bin.charCodeAt(i);
    var type=(/^data:([^;]+)/.exec(localDataUrl)||[])[1]||'image/jpeg';
    window.ossPut(new Blob([buf],{type:type}),function(url,err){
      if(url){toast('图片已上传到 OSS');cb(url,'');return;}
      toast('OSS 上传失败，这次存在本机：'+(err||''));
      cb(localDataUrl,err||'');        /* 失败原因**要传给调用方**，别只丢进 toast（调用方可能想重试/提示） */
    });
  }catch(e){toast('OSS 上传失败，这次存在本机');cb(localDataUrl,(e&&e.message)||'');}
};

   塞一个就爆配额，而 setItem 抛异常若被吞掉，症状会伪装成「导入成功、刷新后字体没了」。

window.ftPut=function(key,blob,cb){

/* 列出已导入字体：返回 [{id,name,size}]（按导入时间倒序）。名字藏在 Blob 上的 _dn 字段里 ——

      if(!c){out.sort(function(a,b){return (b.ts||0)-(a.ts||0);});cb(out);return;}
      var v=c.value,blob=(v&&v.blob)?v.blob:v;
      out.push({id:String(c.key),name:(v&&v.name)||'字体',
        size:(blob&&blob.size)||0,ts:(v&&v.ts)||0});

/* 颜色取值清洗：这个值会经 setProperty 写进 CSS 变量，只放行确定是颜色的写法。 */
window.safeFontColor=function(v){

/* 聊天视频元数据：本体在 IDB，这里只留「这条视频多长、多大、封面有没有」。
   ⚠️ 逐字段重建（别整块赋值）：脏档里塞进来的东西不能原样落回去。
   `st`：1 = 视频本体确认在 IndexedDB；0 = 元数据还在但本体没了（导入别人的备份 / IDB 被清）
   —— 消息**不删**，聊天里显示「视频不在本机了」，至少知道曾经发过这一段。 */
function normVids(arr){
  if(!Array.isArray(arr))return [];
  var out=[];
  for(var i=0;i<arr.length&&out.length<400;i++){
    var x=arr[i];if(!x||typeof x!=='object')continue;
    if(typeof x.id!=='string'||!x.id)continue;
    out.push({
      id:x.id.slice(0,40),
      w:Math.max(0,Math.min(8000,Math.round(+x.w||0))),
      h:Math.max(0,Math.min(8000,Math.round(+x.h||0))),
      dur:Math.max(0,Math.min(36000,Math.round((+x.dur||0)*10)/10)),
      size:Math.max(0,Math.round(+x.size||0)),
      name:(typeof x.name==='string')?x.name.slice(0,60):'',
      ts:(+x.ts>0?+x.ts:Date.now()),
      st:x.st?1:0
    });
  }
  return out;
}
window.normVids=normVids;
function vidFind(id){
  var a=S.vids||[];
  for(var i=0;i<a.length;i++){if(a[i].id===id)return a[i];}
  return null;
}
window.vidFind=vidFind;
window.vidBytes=function(){var n=0;(S.vids||[]).forEach(function(x){n+=(+x.size||0);});return n;};
window.vidTotal=function(){return (S.vids||[]).length;};
/* 秒 → 0:07 / 1:23 / 1:02:03（气泡角标与播放层都用它） */
window.fmtClock=function(sec){
  sec=Math.max(0,Math.round(+sec||0));
  var s=sec%60,m=Math.floor(sec/60)%60,h=Math.floor(sec/3600);
  return (h?(h+':'+(m<10?'0':'')+m):m)+':'+(s<10?'0':'')+s;
};

/* 启动对账（与 nzSync 同套路，但**一条聊天记录都不删**）：
   ① `st` 与 IDB 实际内容对齐 —— 元数据在、本体没了 → 标 `st=0`（聊天里显示「不在本机了」）；
   ② media 仓里的孤儿键（没有对应 S.vids 行）清掉；
   ③ 消息引用了不存在的 vid → 降级成文字，至少保留「发过这一段」的时间和方向。
   ⚠️ 导入别人的备份会带进来一堆 st=1 但本机根本没视频的元数据，这一步就是把它们打回 st=0。 */
window.vidSync=function(cb){
  var finish=function(n){if(cb)cb(n||0);};
  if(!S){finish(0);return;}
  S.vids=normVids(S.vids);
  var alive={};(S.vids||[]).forEach(function(x){alive[x.id]=1;});
  var fixed=0;
  (S.msgs||[]).forEach(function(m){
    if(m.type!=='video'||!m.vid)return;
    if(alive[m.vid])return;
    m.type='text';m.text=m.text||'[视频]';delete m.vid;fixed++;
  });
  if(!window.nzHasIdb()){
    (S.vids||[]).forEach(function(x){if(x.st!==0){x.st=0;fixed++;}});
    if(fixed)save();
    finish(fixed);return;
  }
  window.mdKeys(function(keys){
    var hasV={},hasP={};
    (keys||[]).forEach(function(k){
      k=String(k);
      var p=k.slice(0,2);
      if(p!=='v:'&&p!=='p:')return;
      var id=k.slice(2);
      if(!alive[id]){window.mdDel(k);return;}     /* 孤儿：S.vids 里没这行 → 清掉 */
      if(p==='v:')hasV[id]=1;else hasP[id]=1;
    });
    (S.vids||[]).forEach(function(x){
      var now=hasV[x.id]?1:0;
      if(x.st!==now){x.st=now;fixed++;}
    });
    if(fixed)save();
    finish(fixed);
  });
};
/* dataURL → Blob（旧档搬迁 / 备份导入 / 降级播放共用） */window.nzDataUrlToBlob=function(src){
  try{
    if(typeof src!=='string'||src.slice(0,5)!=='data:')return null;
    var mime=noiseMimeRaw({src:src},src);
    var bin=atob(src.slice(src.indexOf(',')+1));
    var u8=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    return new Blob([u8],{type:mime});
  }catch(e){return null;}
};
/* Blob → dataURL（备份导出时用：JSON 里只能放文本） */
window.nzBlobToDataUrl=function(b,cb){
  try{
    var r=new FileReader();
    r.onload=function(){cb(String(r.result));};
    r.onerror=function(){cb('');};
    r.readAsDataURL(b);
  }catch(e){cb('');}
};
/* 备份导出：把库里每段的音频读成 dataURL（超 60MB 就停手，JSON 太大手机会卡）
   cb({list:[{id,src}],skipped:bool}) */
window.nzExportList=function(cb){
  var lib=(S&&S.settings&&S.settings.coNoiseLib)?S.settings.coNoiseLib:[];
  var out=[],total=0,skipped=false,i=0;
  (function next(){
    if(i>=lib.length){cb({list:out,skipped:skipped});return;}
    var x=lib[i++];
    if(x.src){out.push({id:x.id,src:x.src});return next();}
    if(nzMode()!=='idb')return next();
    window.nzGet(x.id,function(b){
      if(!b)return next();
      if(total+(b.size||0)>CO_NOISE_EXPORT_MAX){skipped=true;return next();}
      window.nzBlobToDataUrl(b,function(src){
        if(src){out.push({id:x.id,src:src});total+=src.length;}
        next();
      });
    });
  })();
};
/* 备份导入：把带过来的音频写进 IDB；返回成功条数 */
window.nzImportList=function(list,cb){
  var arr=Array.isArray(list)?list:[];
  if(nzMode()!=='idb'){if(cb)cb(0);return;}
  var i=0,n=0;
  (function next(){
    if(i>=arr.length){if(cb)cb(n);return;}
    var it=arr[i++];
    var b=(it&&typeof it.src==='string'&&it.src)?window.nzDataUrlToBlob(it.src):null;
    if(!it||!it.id||!b)return next();
    window.nzPut(it.id,b,function(ok){if(ok)n++;next();});
  })();
};
/* 启动对账：① 旧档内联音频搬进 IDB ② 元数据/音频互为孤儿的一律清掉 ③ 定下 coNoiseStore
   ⚠️ 必须在 load() 之后跑（要读 S），且改完 S 要 save()，否则下次刷新又搬一遍。 */
window.nzSync=function(cb){
  var finish=function(n){if(cb)cb(n||0);};
  if(!S||!S.settings){finish(0);return;}
  if(nzMode()!=='idb'){                            /* 降级形态：清掉没有 src 的死链（别的机器备份带过来的元数据） */
    S.settings.coNoiseLib=normNoiseLib(S.settings.coNoiseLib,false);
    S.settings.coNoiseStore='data';
    if(!noiseLibFind(S.settings.coNoiseLib,S.settings.coNoiseId))S.settings.coNoiseId='';
    save();finish(0);return;
  }
  window.nzOpen(function(db){
    /* 打不开（隐私模式 / 配额被封）：**这次一个字节都不动**，保住元数据，下次启动再试。
       ⚠️ 千万别在这里把库按 data 形态重新归一 —— 音频已经不在 src 里了，一归一就全没了。 */
    if(!db){finish(0);return;}
    window.nzKeys(function(keys){
      var lib=S.settings.coNoiseLib||[],i=0,moved=0;
      (function next(){                            /* ① 搬旧档 */
        if(i>=lib.length)return reconcile(keys,moved);
        var x=lib[i++];
        if(!x||!x.src)return next();
        var b=window.nzDataUrlToBlob(x.src);
        if(!b)return next();
        window.nzPut(x.id,b,function(ok){

  var p=window.bubClamp(pct==null?S.settings.bubScale:pct);
  var de=document.documentElement;
  de.style.setProperty('--bub-k',String(p/100));
  /* 消息列最大宽度跟着缩放联动。上限 84%：要给头像（34px / 大屏 46px）+ 8px 间距留位置，
     不然放大后气泡会顶到屏幕边、把头像挤出去。下限 56% 免得缩太小。 */
  de.style.setProperty('--mcol-mw',Math.max(56,Math.min(84,Math.round(74*p/100)))+'%');
  return p;
};
/* ---------- 自定义气泡 CSS（第48单）----------
   把 S.settings.bubCss 挂到文档里一个 **独立的 `<style id="userCss">`** 上。
   ⚠️ 三个必须写清楚的点：
   ① 写入只走 `textContent`，**永远不拼 innerHTML** —— 浏览器对 textContent 不做 HTML 解析，
      `</style><script>` 只是无效 CSS，逃逸不成标签（第33单属性注入那类漏洞在这里结构上不存在）。
   ② 节点挂在 `document.head` **末尾**：同优先级下后写的胜出，所以用户能盖掉应用自身的气泡样式，
      这正是「自己输入 css 改变外观」的前提。空串就把节点整个摘掉（不留一个空 style 拖着重算）。
   ③ 幂等且**不重绘任何一层**：只碰这一个节点，可以放心在 textarea 每次输入时调用。 */
window.applyBubCss=function(){
  /* 第54单：先清洗（拆 HTML 外壳 / 拦网络 / 限长），再过**通用兼容层**把外面抄来的类名
     改写成站内类名，最后才写进 <style>。存的仍是用户写的那份（不含改写），
     改写只发生在"渲染这一步"—— 这样用户回弹层里看到的还是自己写的选择器。 */
  var css=window.adaptUserCss(window.sanitizeUserCss(S.settings&&S.settings.bubCss));
  var el=document.getElementById('userCss');
  if(!css){
    if(el&&el.parentNode)el.parentNode.removeChild(el);
    return '';
  }
  if(!el){el=document.createElement('style');el.id='userCss';document.head.appendChild(el);}
  if(el.textContent!==css)el.textContent=css;   /* 比对再写：相同就不触发样式重算 */
  return css;
};
/* ---------- 第58单 · 字体（全局 + 气泡各三项）----------
   两条纪律：
     ① 只写 CSS 变量，**绝不重绘任何一层** —— 滑杆拖动时每帧都会进来，重绘会把手按着的滑杆换掉
        （与 bubScale / barOp / momOp 同一条铁律）；
     ② "未设置"一律 removeProperty：变量缺席时 CSS 走兜底值，**默认档才与改动前逐像素一致**。
   六个变量：--font-user（全局字体）/ --fk（全局字号系数）/ --ink（全局字色）/
             --bub-font / --bub-fs / --bub-ink（气泡内三项）。 */
window.fontFamilyCSS=function(key){
  key=window.fontKeyOk(key);
  if(key==='serif')return '"Noto Serif SC","Songti SC","STSong","SimSun",Georgia,serif';
  if(key==='mono')return 'ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
  /* 导入的字体一律注册成**固定族名 MJFont** —— 用户看到的字库名（来自文件名）永不进 CSS，
     所以这里不可能把用户文本拼进样式表。 */
  if(/^@/.test(key))return 'MJFont,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  return '';
};
/* 把选中的字库从 IndexedDB 取出来注册成 MJFont。
   用 blob: URL 而不是 data: —— 几 MB 的 data URL 每次重算都要解码一遍，慢且吃内存；
   ⚠️ 换字体时必须 revoke 旧的，否则每切一次就漏一个几 MB 的 blob。 */
window.fontApplyFace=function(key,done){
  var el=document.getElementById('userFontFace');
  function clear(){
    if(el&&el.parentNode)el.parentNode.removeChild(el);
    el=null;
    if(window.fontFaceURL){try{URL.revokeObjectURL(window.fontFaceURL);}catch(e){}window.fontFaceURL=null;}
  }
  key=window.fontKeyOk(key);
  if(!/^@/.test(key)){clear();if(done)done('');return;}
  window.ftGet(key.slice(1),function(v){
    var blob=v?(v.blob||v):null;
    if(!blob){clear();if(done)done('');return;}      /* 本体不在本机（清过库 / 换机器 / 只导入了备份） */
    var url;
    try{url=URL.createObjectURL(blob);}catch(e){clear();if(done)done('');return;}
    clear();
    el=document.createElement('style');el.id='userFontFace';
    el.textContent='@font-face{font-family:MJFont;src:url("'+url+'");font-display:swap}';
    document.head.appendChild(el);
    window.fontFaceURL=url;
    if(done)done(url);
  });
};
window.paintFont=function(){
  var st=document.documentElement.style,s=(window.S&&S.settings)||{};
  var gf=window.fontFamilyCSS(s.fontFamily);
  if(gf)st.setProperty('--font-user',gf);else st.removeProperty('--font-user');
  var gs=window.fontScaleClamp(s.fontScale);
  if(gs!==100)st.setProperty('--fk',(gs/100).toFixed(3));else st.removeProperty('--fk');
  if(s.fontColor)st.setProperty('--ink',s.fontColor);else st.removeProperty('--ink');
  var bf=window.fontFamilyCSS(s.bubFontFamily);
  if(bf)st.setProperty('--bub-font',bf);else st.removeProperty('--bub-font');
  var bs=window.fontScaleClamp(s.bubFontScale);
  if(bs!==100)st.setProperty('--bub-fs',(bs/100).toFixed(3));else st.removeProperty('--bub-fs');
  if(s.bubFontColor)st.setProperty('--bub-ink',s.bubFontColor);else st.removeProperty('--bub-ink');
  window.fontApplyFace(s.fontFamily);
  window.fontApplyFace(s.bubFontFamily,function(url){
    if(!url&&/^@/.test(window.fontKeyOk(s.bubFontFamily))&&!window.__fontMissed){
      window.__fontMissed=1;
      toast('这个字库文件不在本机了，请重新导入');
    }
  });
};

function momWhen(ts){
  var d=new Date(ts),now=new Date();
  var sameDay=d.toDateString()===now.toDateString();
  var yd=new Date(now.getTime()-86400000).toDateString()===d.toDateString();
  if(sameDay)return p2(d.getHours())+':'+p2(d.getMinutes());
  if(yd)return '昨天 '+p2(d.getHours())+':'+p2(d.getMinutes());
  if(d.getFullYear()===now.getFullYear())return (d.getMonth()+1)+'月'+d.getDate()+'日 '+p2(d.getHours())+':'+p2(d.getMinutes());
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';
}

   只算**我发的**动态被回应；我自己的评论不算消息。新的在前，最多 80 条。 */
window.momMsgList=function(){
  var out=[];
  (S.moments||[]).forEach(function(m){
    if(m.dir!=='me')return;
    var ts=+m.ts||0;
    if(m.likes&&m.likes.ta)out.push({ts:ts,kind:'like',text:'赞了你的动态',mid:m.id});
    (m.comments||[]).forEach(function(c){
      if(c.who==='me')return;
      out.push({ts:ts+1,kind:'cmt',text:'评论了你的动态：'+String(c.text||''),mid:m.id});
    });
  });
  out.sort(function(a,b){return b.ts-a.ts;});
  return out.slice(0,80);
};

/* ---------- 生理期关怀（第20单）：记录 + 预测 + TA 关怀 ---------- */
function pLogOf(key){
  var l=(S.periodLog||{})[key];
  return l||{sy:[],flow:0};
}
function pdDateOf(key){var p=key.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function pdWeekCN(key){return '周'+'日一二三四五六'[pdDateOf(key).getDay()];}
function pdMonthLabel(ym){var p=ym.split('-');return (+p[0])+' 年 '+(+p[1])+' 月';}
function pdMonthShift(ym,delta){
  var p=ym.split('-'),y=+p[0],m=+p[1]-1+delta;
  y+=Math.floor(m/12);m=((m%12)+12)%12;
  return y+'-'+p2(m+1);
}
function pdDaysGrid(ym){
  var p=ym.split('-'),y=+p[0],m=+p[1];
  var off=(new Date(y,m-1,1).getDay()+6)%7;   /* 周一为首列 */
  var n=new Date(y,m,0).getDate();
  var cells=[],i;
  for(i=0;i<off;i++)cells.push('');
  for(i=1;i<=n;i++)cells.push(p[0]+'-'+p[1]+'-'+p2(i));
  return cells;
}

/* 月历：历史经期实底 / 预测虚线 / 今天描边 / 选中高亮 */
function pdCalHTML(){
  var ym=RT.periodYm||todayStr().slice(0,7);
  var today=todayStr(),curMonth=(ym===today.slice(0,7));
  var preds={};
  (window.periodPredicts?periodPredicts():[]).forEach(function(k){preds[k]=1;});
  var html=pdDaysGrid(ym).map(function(key){
    if(!key)return '<span class="pcal__d is-blank"></span>';
    var cls='pcal__d';
    var covered=window.periodCovers?periodCovers(key):false;
    if(covered)cls+=' is-period';
    else if(preds[key])cls+=' is-predicted';
    if(curMonth&&key===today)cls+=' is-today';
    if(key===RT.periodSel)cls+=' is-sel';
    return '<button class="'+cls+'" data-act="period-day" data-v="'+key+'" aria-label="'+key+'">'+(+key.slice(8))+'</button>';
  }).join('');

function pdPanelHTML(){

  if(!key)return '<div class="pdpanel"><div class="pdpanel__t">点上面的日期</div>'+
    '<div class="pdpanel__ds">来标记经期开始／结束，或记下当天的情况</div></div>';

  var covered=window.periodCovers?periodCovers(key):false;

    if(p.sd===key)startP=p;
    if(p.ed&&p.ed===key)endKey=true;
  });
  var body='';

    body='<div class="pdpanel__ds">这天还没来，先把今天过好</div>';
  }else if(covered){

    }).join('');
    var flows=DEF_PERIOD_FLOWS.map(function(f,i){
      var v=i+1,isOn=lg.flow===v;
      return '<button class="pflow'+(isOn?' is-on':'')+'" data-act="period-flow" data-v="'+v+'" aria-pressed="'+isOn+'">'+esc(f)+'</button>';
    }).join('');
    body='<div class="pdpanel__lb">当天的情况（可以不记）</div>'+
      '<div class="psyms">'+(syms||'<span class="pdpanel__ds">症状清单是空的</span>')+'</div>'+
      '<div class="pdpanel__lb">流量</div>'+
      '<div class="pflows">'+flows+'</div>';
    if(on&&key>=on.sd)body+='<button class="bigbtn" data-act="period-end" data-v="'+key+'">标记为经期结束</button>';
    if(startP)body+='<button class="bigbtn bigbtn--ghost" data-act="period-cancel-ask" data-v="'+key+'" style="color:#d96666;border-color:#f0c9c9">'+ico('trash')+'取消这天的开始标记</button>';

      '<button class="bigbtn bigbtn--on" data-act="period-start" data-v="'+key+'">'+ico('flower')+'标记为经期开始</button>';
  }
  return '<div class="pdpanel"><div class="pdpanel__t">'+key+' · '+pdWeekCN(key)+'</div>'+body+'</div>';

function lkRunViewHTML(lq){
  var tip='<div class="cardbox" style="margin-top:14px"><div class="cardbox__t">出题考 TA，看链接稳不稳</div>'
    +'<div class="lktip">你出题、设标准答案；TA 随机作答，答对越多说明你俩链接越稳。点右上角 + 加题。</div></div>';
  var list;
  if(lq.qs.length){
    list='<div class="cardbox" style="margin-top:12px"><div class="cardbox__t">题目（'+lq.qs.length+'）</div><div class="lkqlist">'
      +lq.qs.map(function(q,i){
        return '<button class="lkq" data-act="lk-del" data-id="'+i+'" aria-label="删除第'+(i+1)+'题">'
          +'<span class="lkq__nm">'+(i+1)+'. '+esc(q.q)+'</span>'
          +'<span class="lkq__meta">'+q.opts.length+' 选项 · 标准答案第 '+(q.ans+1)+' 行</span></button>';
      }).join('')+'</div></div>';
  }else{
    list='<div class="gempty" style="padding:28px 0">还没有题目<br>点右上角 + 加题开始</div>';
  }
  return tip+list+'<button class="bigbtn bigbtn--on" data-act="lk-run">'+ico('link')+'让 TA 做一遍</button>';
}
function lkHistViewHTML(lq){
  if(!lq.hist.length)return '<div class="gempty" style="padding:28px 0">还没有测试记录</div>';
  var rows=lq.hist.slice().reverse().map(function(r,ri){
    var idx=lq.hist.length-1-ri;   /* 原始下标：倒序展示但回填真实下标，别用倒序下标点开错记录 */
    var d=new Date(+r.ts||0);
    var when=(d.getMonth()+1)+'/'+d.getDate()+' '+fmtT(+r.ts||0);
    return '<button class="lkh" data-act="lk-report" data-id="'+idx+'" aria-label="查看这次测试">'
      +'<span>'+esc(when)+'</span>'
      +'<span>'+(+r.score||0)+'/'+(+r.total||0)+'（'+(+r.pct||0)+'）</span>'
      +'<span>'+esc(LK_LINK_CN[r.link]||LK_LINK_CN.lost)+'</span></button>';
  }).join('');
  return '<div class="cardbox" style="margin-top:14px"><div class="cardbox__t">往期结果（'+lq.hist.length+'）</div>'
    +'<div class="lkh lkh--head"><span>时间</span><span>结果</span><span>链接</span></div>'+rows+'</div>';
}
function lkReportViewHTML(lq){
  var r=lq.hist[RT.lkRepIdx];
  if(!r)return '<div class="gempty" style="padding:28px 0">这条记录已经不在了</div>';
  var pct=Math.max(0,Math.min(100,Math.round(+r.pct||0)));
  var linkCn=LK_LINK_CN[r.link]||LK_LINK_CN[lkLinkFromPct(pct)];
  var rare=window.lkScoreRarity(r.details,+r.total||0,pct);
  var rareHtml=rare
    ?'随机作答时，得到 '+pct+' 分或更高的概率为 '+lkFmtRate(rare.probability*100)+'% · 稀有度 '+lkFmtRate(rare.rarity)
    :'这次没有保存题目明细，无法计算随机作答概率。';
  var moods=(Array.isArray(r.moods)&&r.moods.length)?r.moods:lkPickMoods();   /* 旧记录没存感受就临时抽，不回写 */
  var det;
  if(Array.isArray(r.details)&&r.details.length){
    det='<div class="cardbox" style="margin-top:12px"><div class="cardbox__t">逐题明细</div>'+r.details.map(function(it,i){
      var opts=(it&&Array.isArray(it.opts))?it.opts:[];
      var ok=it&&Number(it.ans)===Number(it.ta);
      return '<div class="lkd">'
        +'<span class="lkd__q">'+(i+1)+'. '+esc((it&&it.q)||'未命名题目')+'</span>'
        +'<span class="lkd__col">正确选项<b>'+esc(opts[it.ans]||'未保存')+'</b></span>'
        +'<span class="lkd__col">TA 的选择<b>'+esc(opts[it.ta]||'未作答')+'</b></span>'
        +'<b class="lkst '+(ok?'ok':'no')+'">'+(ok?'答对了':'答错了')+'</b></div>';
    }).join('')+'</div>';
  }else{
    det='<div class="cardbox" style="margin-top:12px"><div class="lkdempty">这次没有保存逐题明细。<br>但 TA 的分数和当时的链接感受还在这里。</div></div>';
  }
  return '<button class="lkback" data-act="lk-back-hist">'+ico('back')+'返回往期结果</button>'
    +'<div class="cardbox" style="margin-top:12px">'
      +'<div class="lklabel">TA 的本次成绩</div>'
      +'<div class="lkscore">'+pct+'</div>'
      +'<div class="lkmeta">'+(+r.score||0)+' / '+(+r.total||0)+' · '+esc(linkCn)+'</div>'
      +'<div class="lkrare">'+esc(rareHtml)+'</div>'
      +'<div class="lkmoods">'+moods.map(function(m){return '<span class="lkmood">'+esc(m)+'</span>';}).join('')+'</div>'
    +'</div>'+det;
}

/* ==========================================================================
   第9单 · 表情包（面板 / 批量导入 / 梦角甩表情 / 写信插图）
   资产形状与礼物库同构：tab（分类）→ 条目；emoji 与上传图同一套池子、同权重。

window.stkGroups=function(){return (S.stkLib&&S.stkLib.groups)||[];};
window.stkFindGroup=function(gid){var r=null;stkGroups().forEach(function(g){if(g.id===gid)r=g;});return r;};
window.stkFindItem=function(iid){
  var out=null;
  stkGroups().forEach(function(g){g.items.forEach(function(it){if(it.id===iid&&!out)out={g:g,it:it};});});
  return out;
};
window.stkTotal=function(){var n=0;stkGroups().forEach(function(g){n+=g.items.length;});return n;};
/* 面板网格里能看到的那一批（隐藏的不显示，但管理页照常显示，不然没地方取消隐藏） */
window.stkVisible=function(gid){var g=stkFindGroup(gid);return g?g.items.filter(function(it){return !it.hidden;}):[];};
/* TA 抽取池：隐藏的 tab 与隐藏的表情都不入池 —— 验收4 的硬要求 */
window.stkPool=function(gid){
  var gs=gid?[stkFindGroup(gid)]:stkGroups(),out=[];
  gs.forEach(function(g){
    if(!g||g.hidden)return;
    g.items.forEach(function(it){
      if(it.hidden)return;
      out.push({gid:g.id,gN:g.name,id:it.id,e:it.e,src:it.src,w:it.w,h:it.h});
    });
  });
  return out;
};
/* 上传图占用的字符数（dataURL 会吃 localStorage，导入前要算账） */
window.stkBytes=function(){
  var n=0;
  stkGroups().forEach(function(g){g.items.forEach(function(it){if(it.src)n+=it.src.length;});});
  return n;
};
/* 一张表情的载荷（消息气泡与信件共用） */
window.stkPayload=function(it,gid,gN){
  if(!it)return null;

/* ---------- 第80单 · 长按拖拽排序（表情库用；通用，谁都能挂）----------
   ⚠️ 移动端 WebView 里 HTML5 的 draggable **在触屏上不工作**，所以自己写 pointer 手势。
   ⚠️ 四条硬要求：长按才进拖拽（手指先动 >10px 就取消 → 不影响正常滚动）；拖动期间禁滚动；
      吞掉拖完之后紧跟的那次 click（否则会误发一条表情）；只重排 DOM 里出现的 id（不丢数据）。 */
window.makeSortable=function(box,itemSel,idOf,apply){

    },400);

      if(k>i&&e.clientY>o.top+o.height/2){box.insertBefore(item,all[k].nextSibling);break;}

    box.addEventListener('click',kill,true);

/* 把"只重排这些 id"的语义抽出来：出现过的按新顺序排，没出现的留在末尾 */
function reorderBy(ids,all,keyOf){
  var map={};
  all.forEach(function(x){map[keyOf(x)]=x;});
  var rest=all.filter(function(x){return ids.indexOf(keyOf(x))<0;});
  return ids.map(function(i){return map[i];}).filter(Boolean).concat(rest);

/* 第81单 · 跟手拖拽（覆盖第80单那版"过半格就插节点"的写法）。

      旧版直接把真节点插到新位置 → 网格瞬间重排 → 手指底下的格子乱跳（用户原话"一拖窜特别远"）。

      save();if(b.closest&&b.closest('#sheet'))window.stkLibSheet();
    };
    return function(ids){
      var all=window.stkGroups(),g=null;
      all.forEach(function(x){if(!g&&x.items.some(function(it){return it.id===ids[0];}))g=x;});
      if(!g)return;

  function flip(doIt){

  /* 拖到哪儿跟到哪儿；落点＝重叠面积最大的那一格退位让开（第86单），一次只走一格 */

  document.addEventListener('pointerdown',function(e){

/* 全屏通话浮层 */
window.paintCall=function(){
  var L=$('callLayer');if(!L)return;
  var c=RT.call||{};
  if(!c.phase||c.phase==='idle'){L.classList.remove('open');L.innerHTML='';paintMini();return;}
  var pulse=(c.phase==='dial'||c.phase==='ring')?' pulse':'';
  var st=c.phase==='dial'?'正在呼叫…':(c.phase==='ring'?'邀请你语音通话':'通话中');
  var nm=c.phase==='ring'?esc(TA_NAME())+' 来电':esc(TA_NAME());
  var body='';
  /* 第130单 · 通话大屏三颗键的图标：
       挂断 / 取消 / 拒接 = 同一个「实心听筒」（与迷你条那颗键同源，第129单描出来的）；
       收起 = 换成「向下收进底杠」（ico('mini')）—— 原来与挂断并排两颗一模一样的听筒，
              用户驳回「怎么全是听筒」，分不出哪个是哪个；
       接听 = 保留线描话筒（ico('phone')）：听筒拿起 = 接听，这个形态本身就是对的。 */
  if(c.phase==='active'){
    body='<div class="calltime" id="callTime">'+fmtDur(window.callSec?callSec():0)+'</div>'+
      '<div class="callact">'+
      '<button class="callbtn callbtn--mini" data-act="call-mini" aria-label="收起通话">'+ico('mini')+'收起</button>'+
      '<button class="callbtn callbtn--hang" data-act="call-hang" aria-label="挂断通话">'+ico('hangup')+'挂断</button></div>';
  }else if(c.phase==='dial'){
    body='<div class="callact"><button class="callbtn callbtn--hang" data-act="call-hang" aria-label="取消呼叫">'+ico('hangup')+'取消</button></div>';
  }else{
    body='<div class="callact">'+
      '<button class="callbtn callbtn--hang" data-act="call-reject" aria-label="拒接">'+ico('hangup')+'拒接</button>'+
      '<button class="callbtn callbtn--ok" data-act="call-accept" aria-label="接听">'+ico('phone')+'接听</button></div>';
  }
  L.innerHTML='<div class="callav'+pulse+'">'+avSpan('ta',92)+'</div><div class="callnm">'+nm+'</div><div class="callst">'+st+'</div>'+body;
  L.classList.add('open');
  paintMini();
};

/* 已进行秒数（运行期推算，不靠自起定时器） */
window.coElapsed=function(){

};

window.coRemain=function(){
  var c=RT.co;if(!c||!c.live)return 0;
  if(!c.isCountdown)return -1;

/* 番茄当前段：纯函数（只吃「已进行秒数」），不靠累加 —— 后台被节流/切屏回来也不会跳段。
   ⚠️ 运行期 c.pomo 里的 workMin/brkMin 是**分钟**，这里统一换成秒再算。 */
window.coPomoState=function(){
  var c=RT.co;if(!c||!c.live)return null;
  var p=c.pomo;if(!p||!p.on)return null;
  var el=coElapsed(),w=Math.max(1,p.workMin)*60,b=Math.max(0,p.brkMin)*60;
  var per=w+b,idx=Math.floor(el/per);
  if(idx>=p.of)return {round:p.of,of:p.of,phase:'work',remain:0,done:1};
  var off=el-idx*per;
  if(b<=0)return {round:idx+1,of:p.of,phase:'work',remain:Math.max(0,w-off)};   /* brk=0 → 连着学，不分段 */
  if(off<w)return {round:idx+1,of:p.of,phase:'work',remain:Math.max(0,w-off),seg:w};
  return {round:idx+1,of:p.of,phase:'break',remain:Math.max(0,b-(off-w)),seg:b};
};
/* 这次跑完了几轮专注（时间到面板 / 历史 / 告别文案要用）：
   在休息段 = 本轮刚做完；在专注段 = 只做完了前面几轮 */
window.coPomoDoneRounds=function(){
  var ps=window.coPomoState();if(!ps)return 0;
  if(ps.done)return ps.of;
  return Math.max(0,(ps.phase==='break')?ps.round:(ps.round-1));
};
/* 番茄点上那排小圆点：跑完=实心，当前=放大，未跑=空心 */
function coPomoDots(round,of,brk){
  var s='';
  for(var i=1;i<=of;i++){
    var cl=(i<round)?' on':((i===round)?(brk?' cur is-brk':' cur'):'');
    s+='<i class="copomo__d'+cl+'"></i>';
  }
  return s;
}
window.coSessions=function(){return S.coSessions||[];};
window.coStats=function(){
  var all=coSessions(),n=0,sec=0,ext=0,left=0;
  all.forEach(function(x){
    n++;sec+=x.totalSeconds;ext+=x.extended;
    if(x.end==='left')left++;
  });
  return {n:n,sec:sec,ext:ext,left:left,diary:(S.coLog||[]).length};
};
/* 场景卡片 + 时长选择。

    }).join('');
    /* 自定义时长：预设之外自己定一个（分钟；填 0 = 好好休息 = 正计时）。

/* 进行态：全屏氛围层（背景图 + 计时 + 双音频控制器） */

window.coStageHTML=function(){

window.coPaintLive=function(){

/* 左上角小窗：全屏层收起时的那条「陪伴还在继续」。
   ⚠️ 文案里报的是**当前该显示的那一段**（番茄态报本段剩余，不是总剩余），
   跟 coPaintTime 口径一致；时间到了就改成「时间到啦」，提醒用户点回去处理。 */
window.coPaintMini=function(){
  var m=$('coMini');if(!m)return;
  var c=RT.co;
  /* ⚠️ 只有「故意收着」（RT.coHide）才亮小窗 —— 全屏层开着的时候也亮的话，

     判据用 RT.coHide 而不是「层开没开」：层开着也可能正在关（收工那一瞬）。 */
  if(!c||!c.live||!RT.coHide){m.classList.remove('open');m.innerHTML='';return;}

  else if(c.phase==='extend')tx=(c.by==='me')?'你想再待一会儿':(TA_NAME()+' 还想再待一会儿');
  else if(c.phase==='bye')tx='等你收好这段时光';
  else if(ps&&!ps.done)tx=fmtDur(ps.remain)+(ps.phase==='break'?' 休息中':' 专注中');
  else tx=c.isCountdown?('还剩 '+fmtDur(coRemain())):('已陪 '+fmtDur(coElapsed()));
